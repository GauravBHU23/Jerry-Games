  ctx.fillText('TIME ' + fmtTime(runDurationMs) + '   ·   ties go to the faster run', W/2, 414);

  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 15px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP TO PLAY AGAIN ◀' : '▶ PRESS R TO PLAY AGAIN ◀', W/2, 445);
  }
  ctx.textAlign = 'left';
}

// ============ RESET ============
function fullReset() {
  score = 0; lives = diff().lives;
  level = 1;
  jerry.x = 60; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.powers.clear();          // powers are earned again each run
  jerry.shield = false;
  jerry.shieldCd = 0;
  jerry.jumps = 0;
  setStage(0);   // start small, no bomb - power blocks earn it
  jerry.invuln = 60; jerry.facing = 1;
  camera.x = 0;
  bombs = [];
  particles = [];
  bossActiveEnemies = [];
  popup = null;
  boss = null;
  villain = null;
  villainShots = [];
  screenShake = 0;
  levelBanner = 0;
  powerBanner = null;
  combo = 0; comboTimer = 0; comboBest = 0;
  floatText = [];
  paused = false; pausedAt = 0; pauseSel = 0;
  document.body.classList.remove('is-paused');
  buildLevel(level);
}

// ============ MAIN LOOP ============
function draw() {
  drawSky();
  drawClouds();
  ctx.save();
  // impact shake during the final fight
  const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
  const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
  // On a wide screen the world is drawn shifted right by VIEW_X, so the extra
  // canvas width shows more level instead of empty margin.
  ctx.translate(VIEW_X - camera.x + sx, sy);
  if (gameState === 'playing') {
    drawGround();
    drawHazards();
    drawSigns();
    drawCheckpoints();
    drawBlocks();
    drawGoal();
    drawEnemies();
    drawEnemyShots();
  } else if (gameState === 'villain') {
    drawVillainScene();
  }
  drawJerry();
  drawBombs();
  drawParticles();
  drawFloatText();
  ctx.restore();

  // UI keeps its 800-wide layout, centred in the view
  ctx.save();
  ctx.translate(VIEW_X, 0);
  drawHUD();
  // banners and popups would print over the pause overlay, and their timers
  // should not tick down while the game is stopped
  if (!paused) {
    if (popup) drawPopup();
    drawLevelBanner();
  }
  ctx.restore();
}

// Full-screen menus lay their content out in the 800-wide box, centred in the
// view. Each one paints its own background across the full width.
function centred(drawFn) {
  ctx.save();
  ctx.translate(VIEW_X, 0);
  drawFn();
  ctx.restore();
}

// ============ MENU ============
let menuSel = 0;
let helpPage = 0;
let levelSel = 1;

// The rows shown on the main menu. Level select only appears once there is
// more than one level to choose from.
function menuRows() {
  const rows = [{ id: 'start', label: '▶  START GAME' }];
  if (unlockedLevel > 1) {
    rows.push({ id: 'levels', label: '⚑  LEVEL SELECT  (1-' + unlockedLevel + ')' });
  }
  rows.push({ id: 'difficulty', label: '⚙  DIFFICULTY:  ' + diff().name });
  rows.push({ id: 'volume', label: '♪  VOLUME:  ' + volumeLabel() });
  rows.push({ id: 'help', label: '?  HOW TO PLAY' });
  rows.push({ id: 'board', label: '★  LEADERBOARD' });
  return rows;
}

// Where the menu block sits. Everything below the title has to fit above the
// hint line, and the row count varies, so the numbers are derived rather than
// hard-coded - otherwise unlocking level select pushes the card off-screen.
// Any key at all continues past the splash.
function anyKeyPressed() {
  for (const k in keys) if (keys[k]) return true;
  return false;
}

function dismissPromo() {
  gameState = 'menu';
  menuSel = 0;
  for (const k in keys) keys[k] = false;   // do not carry the press into the menu
  unlockAudio();
}

function menuLayout() {
  const rows = menuRows().length;
  const hasCard = !!(profile.id && profile.name);
  const bottom = H - 26;                 // leave room for the hint line
  const cardH = hasCard ? 40 : 0;
  const gap = hasCard ? 8 : 0;

  // shrink the rows as the list grows so the mascot keeps its space
  const step = rows >= 6 ? 34 : rows >= 5 ? 36 : 40;
  const rowH = step - 8;

  const blockH = rows * step + gap + cardH;
  // start below the mascot, but slide up if the block would overflow
  let top = Math.min(268, bottom - blockH + step - 10);
  top = Math.max(232, top);              // never ride up over the subtitle

  // The mascot occupies roughly 190-246; only draw it when the first row
  // starts clear of that. The event banner sits in the same band, so it takes
  // priority - the offer matters more than the decoration.
  const showMascot = (top - rowH + 10) >= 248 && !eventLive();

  return { top, step, rowH, gap, cardH, showMascot,
           cardY: top + (rows - 1) * step + 10 + gap,
           bottom };
}

function chooseMenuItem() {
  const rows = menuRows();
  const row = rows[Math.min(menuSel, rows.length - 1)];
  if (!row) return;
  if (row.id === 'start') {
    if (profile.id) startRun();
    else askName();
  } else if (row.id === 'levels') {
    levelSel = Math.min(unlockedLevel, Math.max(1, levelSel));
    gameState = 'levels';
  } else if (row.id === 'difficulty') {
    setDifficulty((difficulty + 1) % DIFFICULTIES.length);   // cycles in place
  } else if (row.id === 'volume') {
    setVolumeStep(volumeStep + 1);                           // wraps at the top
  } else if (row.id === 'help') {
    helpPage = 0;
    gameState = 'help';
  } else if (row.id === 'board') {
    fetchLeaderboard();
    openBoard();
  }
}

// Starts at a chosen level, with the powers you would have earned by then.
function startRunAtLevel(n) {
  if (!profile.id) { askName(); return; }
  startRun();
  level = Math.max(1, Math.min(unlockedLevel, n));
  levelReached = level;
  buildLevel(level);
  // hand over the powers from the levels being skipped, otherwise level 6
  // would be unplayable without bombs
  if (level > 1) {
    setStage(2);
    for (let i = 1; i < level; i++) grantPower(levelDef(i).power);
  }
  levelBanner = 150;
}

// ============ NAVIGATION ============
// Esc / P pause a run; Esc backs out of any other screen. The on-screen
// buttons do the same thing so touch players have the same options.
const backBtn = document.getElementById('backBtn');
const pauseBtn = document.getElementById('pauseBtn');

const PAUSE_ITEMS = ['RESUME', 'RESTART LEVEL', 'LEADERBOARD', 'QUIT TO MENU'];

function inRun() { return gameState === 'playing' || gameState === 'villain'; }

function setPaused(on) {
  if (!inRun()) return;
  if (on === paused) return;
  if (on) {
    pauseSel = 0;
    pausedAt = Date.now();
    // Drop held keys and touch buttons - otherwise Jerry keeps running the
    // moment you resume, or a held jump fires straight away.
    for (const k of Object.keys(keys)) keys[k] = false;
    for (const k of Object.keys(jerry._jumpHeld)) jerry._jumpHeld[k] = false;
    document.querySelectorAll('#touch .btn.active')
      .forEach(b => b.classList.remove('active'));
  } else if (pausedAt) {
    // Don't let paused time count towards the run - it decides score ties.
    runStartedAt += Date.now() - pausedAt;
    pausedAt = 0;
  }
  paused = on;
  document.body.classList.toggle('is-paused', on);
}

// "Back" means something different on each screen.
function goBack() {
  if (askingName) { cancelName(); return; }
  if (inRun()) { setPaused(!paused); return; }
  if (gameState === 'board') { gameState = 'menu'; return; }
  if (gameState === 'help' || gameState === 'levels') { gameState = 'menu'; return; }
  if (gameState === 'win' || gameState === 'gameover') { openBoard(); return; }
}

function choosePauseItem() {
  const item = PAUSE_ITEMS[pauseSel];
  if (item === 'RESUME') {
    setPaused(false);
  } else if (item === 'RESTART LEVEL') {
    setPaused(false);
    const n = level;
    buildLevel(n);
    gameState = 'playing';
    villain = null;
    bossActiveEnemies = [];
    villainShots = [];
    bombs = [];
    jerry.x = checkpointX; jerry.y = 260;
    jerry.vx = 0; jerry.vy = 0; jerry.jumps = 0;
    jerry.invuln = 120;
    camera.x = 0;
    breakCombo();
    levelBanner = 120;
  } else if (item === 'LEADERBOARD') {
    setPaused(false);
    recordRun();          // quitting mid-run still counts what you scored
    openBoard();
  } else if (item === 'QUIT TO MENU') {
    setPaused(false);
    recordRun();
    gameState = 'menu';
  }
}

if (backBtn) {
  backBtn.addEventListener('click', e => { e.stopPropagation(); goBack(); });
  backBtn.addEventListener('pointerdown', e => e.stopPropagation());
}
if (pauseBtn) {
  pauseBtn.addEventListener('click', e => { e.stopPropagation(); setPaused(!paused); });
  pauseBtn.addEventListener('pointerdown', e => e.stopPropagation());
}

window.addEventListener('keydown', e => {
  if (askingName) return;                 // the dialog handles its own keys
  const k = e.key.toLowerCase();
  if (k === 'escape') { e.preventDefault(); goBack(); return; }
  if (k === 'p' && inRun()) { e.preventDefault(); setPaused(!paused); return; }

  // pause menu navigation
  if (paused) {
    if (k === 'arrowup' || k === 'w') {
      e.preventDefault();
      pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length;
    } else if (k === 'arrowdown' || k === 's') {
      e.preventDefault();
      pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length;
    } else if (k === 'enter' || k === ' ') {
      e.preventDefault();
      choosePauseItem();
    }
    return;
  }

  // main menu
  if (gameState === 'menu') {
    const n = menuRows().length;
    if (k === 'arrowup' || k === 'w') { e.preventDefault(); menuSel = (menuSel + n - 1) % n; }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); menuSel = (menuSel + 1) % n; }
    else if (k === 'enter' || k === ' ') { e.preventDefault(); chooseMenuItem(); }
    // left/right adjusts the highlighted setting row
    else if (k === 'arrowleft' || k === 'arrowright') {
      const row = menuRows()[menuSel];
      const dir = k === 'arrowright' ? 1 : -1;
      if (row && row.id === 'difficulty') {
        e.preventDefault();
        setDifficulty((difficulty + dir + DIFFICULTIES.length) % DIFFICULTIES.length);
      } else if (row && row.id === 'volume') {
        e.preventDefault();
        setVolumeStep(volumeStep + dir);
      }
    }
    return;
  }

  // help pages
  if (gameState === 'help') {
    if (k === 'arrowleft' || k === 'a') {
      e.preventDefault(); helpPage = (helpPage + HELP_PAGES.length - 1) % HELP_PAGES.length;
    } else if (k === 'arrowright' || k === 'd' || k === 'enter' || k === ' ') {
      e.preventDefault(); helpPage = (helpPage + 1) % HELP_PAGES.length;
    }
    return;
  }

  // leaderboard: arrows/page keys walk the ranking table
  if (gameState === 'board' && !askingName) {
    if (k === 'arrowdown' || k === 's') { e.preventDefault(); scrollBoard(BOARD_ROW_H); return; }
    if (k === 'arrowup' || k === 'w')   { e.preventDefault(); scrollBoard(-BOARD_ROW_H); return; }
    if (k === 'pagedown')  { e.preventDefault(); scrollBoard(BOARD_VIEW_H); return; }
    if (k === 'pageup')    { e.preventDefault(); scrollBoard(-BOARD_VIEW_H); return; }
    if (k === 'home')      { e.preventDefault(); boardScroll = 0; return; }
    if (k === 'end')       { e.preventDefault(); boardScroll = boardScrollMax; return; }
    // enter/r/escape still leave the board, handled by the loop
  }

  // level select grid
  if (gameState === 'levels') {
    if (k === 'arrowleft' || k === 'a') { e.preventDefault(); levelSel = Math.max(1, levelSel - 1); }
    else if (k === 'arrowright' || k === 'd') { e.preventDefault(); levelSel = Math.min(unlockedLevel, levelSel + 1); }
    else if (k === 'arrowup' || k === 'w') { e.preventDefault(); levelSel = Math.max(1, levelSel - 4); }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); levelSel = Math.min(unlockedLevel, levelSel + 4); }
    else if (k === 'enter' || k === ' ') { e.preventDefault(); startRunAtLevel(levelSel); }
    return;
  }
});

function scrollBoard(dy) {
  boardScroll = Math.max(0, Math.min(boardScrollMax, boardScroll + dy));
}

// Always open the leaderboard at the top, however you got there.
function openBoard() {
  gameState = 'board';
  boardScroll = 0;
  boardDrag = null;
  boardPressed = false;
}

// ---- leaderboard scrolling: wheel, drag and touch ----
canvas.addEventListener('wheel', e => {
  if (gameState !== 'board' || askingName || boardScrollMax <= 0) return;
  e.preventDefault();
  scrollBoard(e.deltaY);
}, { passive: false });

// Dragging the table scrolls it. A drag must not also count as the tap that
// leaves the board, so anything past a few pixels cancels the tap.
canvas.addEventListener('pointerdown', e => {
  if (gameState !== 'board' || askingName) return;
  const r = canvas.getBoundingClientRect();
  const gy = (e.clientY - r.top) / r.height * H;
  if (gy < BOARD_VIEW_Y || gy > BOARD_VIEW_Y + BOARD_VIEW_H) return;
  boardDrag = { y: e.clientY, start: boardScroll, moved: 0, id: e.pointerId };
}, { capture: true });

canvas.addEventListener('pointermove', e => {
  if (!boardDrag || e.pointerId !== boardDrag.id) return;
  const r = canvas.getBoundingClientRect();
  const dy = (boardDrag.y - e.clientY) / r.height * H;
  boardDrag.moved = Math.max(boardDrag.moved, Math.abs(dy));
  boardScroll = Math.max(0, Math.min(boardScrollMax, boardDrag.start + dy));
  if (boardDrag.moved > 4) e.preventDefault();
}, { capture: true, passive: false });

for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
  canvas.addEventListener(ev, e => {
    if (gameState !== 'board' || askingName) return;
    // A press that never really moved was a tap after all, so let it through
    // to leave the board; a drag was a scroll and must not. The press has to
    // have started on the board too - releasing here after clicking
    // "LEADERBOARD" on the menu would otherwise bounce straight back out.
    const wasDrag = boardDrag && boardDrag.moved > 4;
    if (ev === 'pointerup' && !wasDrag && boardPressed) tapConfirm = true;
    boardDrag = null;
    boardPressed = false;
  }, { capture: true });
}

// Tapping a pause menu row picks it. This runs in the capture phase, before
// the tap-to-start latch, and stops the event so choosing "Quit" cannot also
// register as a tap on the screen it lands on.
canvas.addEventListener('pointerdown', e => {
  const interactive = paused || gameState === 'menu' ||
                      gameState === 'help' || gameState === 'levels';
  if (!interactive) return;
  e.preventDefault();
  e.stopPropagation();
  const r = canvas.getBoundingClientRect();
  // screen pixels -> game units, then undo the centring offset
  const gx = (e.clientX - r.left) / r.width * VIEW_W - VIEW_X;
  const gy = (e.clientY - r.top) / r.height * H;

  if (paused) {
    const hit = PAUSE_ITEMS.findIndex((_, i) => {
      const y = 232 + i * 42;
      return gx > W / 2 - 150 && gx < W / 2 + 150 && gy > y - 24 && gy < y + 12;
    });
    if (hit >= 0) { pauseSel = hit; choosePauseItem(); }
    return;
  }

  if (gameState === 'menu') {
    const L = menuLayout();
    const hit = menuRows().findIndex((_, i) => {
      const y = L.top + i * L.step;
      return gx > W / 2 - 170 && gx < W / 2 + 170 &&
             gy > y - L.rowH + 10 && gy < y + 10;
    });
    if (hit >= 0) { menuSel = hit; chooseMenuItem(); }
    return;
  }

  if (gameState === 'help') {
    // tap the left third to go back a page, anywhere else to go forward
    if (gx < W / 3) helpPage = (helpPage + HELP_PAGES.length - 1) % HELP_PAGES.length;
    else helpPage = (helpPage + 1) % HELP_PAGES.length;
    return;
  }

  if (gameState === 'levels') {
    const cols = 4, cw = 150, ch = 84, gapX = 14, gapY = 16;
    const gridW = cols * cw + (cols - 1) * gapX;
    const x0 = W / 2 - gridW / 2, y0 = 100;
    for (let i = 0; i < FINAL_LEVEL; i++) {
      const cx = x0 + (i % cols) * (cw + gapX);
      const cy = y0 + Math.floor(i / cols) * (ch + gapY);
      if (gx > cx && gx < cx + cw && gy > cy && gy < cy + ch) {
        const n = i + 1;
        if (n <= unlockedLevel) { levelSel = n; startRunAtLevel(n); }
        return;
      }
    }
  }
}, true);

function drawPauseMenu() {
  ctx.fillStyle = 'rgba(2, 12, 26, 0.86)';
  ctx.fillRect(-VIEW_X - 2, 0, VIEW_W + 4, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 30px monospace';
  ctx.fillText('PAUSED', W / 2, 150);

  ctx.fillStyle = '#7e9fbb';
  ctx.font = '11px monospace';
  ctx.fillText('LEVEL ' + level + '  ·  SCORE ' + score + '  ·  ' + fmtTime(
    runStartedAt ? Date.now() - runStartedAt : 0), W / 2, 176);

  PAUSE_ITEMS.forEach((item, i) => {
    const y = 232 + i * 42;
    const on = i === pauseSel;
    ctx.fillStyle = on ? 'rgba(74,175,255,0.22)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(W / 2 - 150, y - 24, 300, 34);
    ctx.strokeStyle = on ? '#4af' : 'rgba(120,150,180,0.35)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(W / 2 - 150, y - 24, 300, 34);
    ctx.fillStyle = on ? '#fff' : '#9fbdd6';
    ctx.font = (on ? 'bold ' : '') + '15px monospace';
    ctx.fillText(item, W / 2, y);
  });

  ctx.fillStyle = '#567';
  ctx.font = '10px monospace';
  ctx.fillText(isTouch ? 'tap a choice  ·  ❚❚ to resume'
                       : '↑ ↓ to choose  ·  ENTER to pick  ·  ESC to resume',
               W / 2, 232 + PAUSE_ITEMS.length * 42 + 18);
  ctx.textAlign = 'left';
}

function loop() {
  // consume a pending screen tap once per frame
  const tapped = tapConfirm;
  tapConfirm = false;

  // each scene has its own theme; playMusic ignores repeat calls
  // levels rotate through the action themes so the mood darkens as you climb
  // boss fights get the heavy theme; the final one gets the fiercest
  playMusic(
    gameState === 'villain' ? (level >= FINAL_LEVEL ? 'villain' : 'boss')
    : gameState === 'playing' ? (level >= 6 ? 'boss' : level >= 3 ? 'level2' : 'playing')
    : gameState === 'promo' ? 'win'      // the celebratory theme suits it
    : gameState);

  // the menu-only chrome: player switch and the install button
  const onMenu = (gameState === 'menu' || gameState === 'board') && !askingName;
  if (switchBtn) {
    switchBtn.style.display = (gameState === 'menu' && profile.id && !askingName) ? 'block' : 'none';
  }
  if (installBtn && installPrompt) {
    installBtn.style.display = onMenu ? 'block' : 'none';
  }
  // back arrow on every screen except the menu itself; pause only during a run
  if (backBtn) {
    backBtn.style.display =
      (!askingName && gameState !== 'menu' && gameState !== 'promo' && !paused)
        ? 'block' : 'none';
  }
  if (pauseBtn) {
    pauseBtn.style.display = (!askingName && inRun()) ? 'flex' : 'none';
    pauseBtn.textContent = paused ? '▶' : '❚❚';
    pauseBtn.title = paused ? 'Resume (Esc)' : 'Pause (Esc / P)';
  }

  if (gameState === 'promo') {
    centred(drawPromo);
    promoShown++;
    // ignore input for the first moment so a stray tap does not skip it
    if (promoShown > 40 && (tapped || anyKeyPressed())) {
      dismissPromo();
    }
  } else if (gameState === 'menu') {
    // rows are driven by the keydown handler and the canvas tap handler
    centred(drawMenu);
  } else if (gameState === 'help') {
    centred(drawHelp);
  } else if (gameState === 'levels') {
    centred(drawLevelSelect);
  } else if (gameState === 'board') {
    centred(drawLeaderboard);
    if (!askingName && (keys['enter'] || keys['r'] || tapped)) {
      keys['enter'] = false; keys['r'] = false;
      gameState = 'menu';
    }
  } else if (gameState === 'playing') {
    if (!paused) updatePlaying();
    draw();
    if (paused) centred(drawPauseMenu);
  } else if (gameState === 'villain') {
    if (!paused) updateVillain();
    draw();
    if (paused) centred(drawPauseMenu);
  } else if (gameState === 'gameover') {
    recordRun();
    draw();
    centred(drawGameOver);
    if (keys['r'] || tapped) { keys['r'] = false; openBoard(); }
  } else if (gameState === 'win') {
    recordRun();
    centred(drawWin);
    if (keys['r'] || tapped) { keys['r'] = false; openBoard(); }
  }
  requestAnimationFrame(loop);
}

// Starts a fresh run for the current player.
function startRun() {
  fullReset();
  levelReached = 1;
  scoreSubmitted = false;
  gateFailed = false;
  levelBanner = 150;
  runStartedAt = Date.now();
  runDurationMs = 0;
  gameState = 'playing';
}

// Called every frame on the end screens; only sends once per run.
function recordRun() {
  if (scoreSubmitted) return;
  scoreSubmitted = true;
  runDurationMs = runStartedAt ? Date.now() - runStartedAt : 0;
  submitScore(score, levelReached, runDurationMs, diff().id);
}

// mm:ss for the HUD and the board
function fmtTime(ms) {
  if (!ms || ms < 0) return '--:--';
  const t = Math.floor(ms / 1000);
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

// Totals add up across every run, so they can pass an hour - show h:mm:ss then.
function fmtLongTime(ms) {
  if (!ms || ms < 0) return '--:--';
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  return h > 0
    ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
    : m + ':' + String(s).padStart(2, '0');
}

resetLevel();
loop();
</script>
</body>
</html>
