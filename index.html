  bomb:       { label: 'WATER BOMB',  blurb: 'Press [X] to throw water bombs' },
  rapid:      { label: 'RAPID FIRE',  blurb: 'Throw far more often' },
  triple:     { label: 'TRIPLE SHOT', blurb: 'Three bombs in a spread' },
  doublejump: { label: 'DOUBLE JUMP', blurb: 'Jump again in mid-air' },
  shield:     { label: 'SHIELD',      blurb: 'Absorbs one hit, then recharges' },
  pierce:     { label: 'PIERCING',    blurb: 'Bombs pass through enemies' },
  blast:      { label: 'BLAST RADIUS',blurb: 'Bigger explosions' },
  overdrive:  { label: 'OVERDRIVE',   blurb: 'Maximum fire rate' },
};

function hasPower(p) { return jerry.powers.has(p); }

function grantPower(p) {
  if (!p || jerry.powers.has(p)) return false;
  jerry.powers.add(p);
  if (p === 'shield') jerry.shield = true;
  return true;
}

// Cooldown shrinks as fire-rate powers stack up.
function bombCooldownFrames() {
  let cd = BOMB_COOLDOWN;
  if (hasPower('rapid')) cd /= 3;
  if (hasPower('overdrive')) cd /= 2;
  return Math.max(4, Math.round(cd));
}

function bombRadius() { return hasPower('blast') ? 15 : 9; }

// Every throw goes through here so all levels behave the same.
function throwBombs(speed) {
  const dirs = hasPower('triple') ? [-0.32, 0, 0.32] : [0];
  for (const spread of dirs) {
    bombs.push({
      x: jerry.x + jerry.w / 2,
      y: jerry.y + jerry.h / 2,
      vx: jerry.facing * (speed || 9),
      vy: -1.5 + spread * 9,
      r: bombRadius(),
      pierce: hasPower('pierce'),
      hits: 0,
    });
  }
  jerry.hasBomb = false;
  jerry.bombCooldown = bombCooldownFrames();
  sfx('throw');
}

// ============ LEVEL GENERATION ============
// Built from the LEVELS table so every stage scales the same way.
let platforms = [];
let hazards = [];
let blocks = [];
let enemies = [];
let signs = [];
let goal = { x: 0, y: 0, w: 40, h: 130 };
let boss = null;

const EDU_LINES = [
  'FILTRATION: sand and gravel filters trap solid particles from wastewater.',
  'SEWAGE carries harmful microbes and chemicals. Never touch it directly!',
  'Industries dump waste into rivers. Together we must hold them accountable!',
  'CHLORINATION kills bacteria and viruses in most city water supplies.',
  'UV DISINFECTION cleans water using light instead of chemicals.',
  'Heavy metals like lead and mercury build up in fish and in people.',
  'Wetlands act as natural filters - protecting them protects our water.',
  'One litre of oil can pollute a million litres of drinking water.',
];

// Enemy templates. Ground walkers sit on the floor, fliers hover.
function makeEnemy(kind, x, minX, maxX, speed) {
  const base = { x, alive: true, minX, maxX, type: kind };
  if (kind === 'trash')
    return { ...base, y: GROUND_Y - 30, w: 30, h: 30, vx: -1.2 * speed };
  if (kind === 'drum')
    return { ...base, y: GROUND_Y - 40, w: 40, h: 40, vx: 0 };
  if (kind === 'barrel')
    return { ...base, y: GROUND_Y - 34, w: 34, h: 34, vx: -1.8 * speed };
  if (kind === 'drone')
    return { ...base, y: 250, w: 32, h: 26, vx: 1.6 * speed,
             baseY: 200 + Math.random() * 90, phase: Math.random() * 6 };
  if (kind === 'spitter')
    return { ...base, y: GROUND_Y - 38, w: 34, h: 38, vx: 0.7 * speed,
             fireTimer: 60 + Math.floor(Math.random() * 90) };
  if (kind === 'chaser')
    return { ...base, y: GROUND_Y - 32, w: 32, h: 32, vx: 1.1 * speed, speed };
  return { ...base, y: GROUND_Y - 30, w: 30, h: 30, vx: -1.2 * speed };
}

// Turns a LEVELS row into an actual playable map.
function buildLevel(n) {
  const d = levelDef(n);
  const end = d.len;
  const rnd = mulberry(n * 7919);      // same layout every time you replay

  // --- ground split by sewage pits ---
  platforms = [];
  hazards = [];
  const segCount = d.gaps + 1;
  const usable = end - 260;            // keep the start and the goal solid
  const segW = usable / segCount;
  let x = 0;
  for (let i = 0; i < segCount; i++) {
    const isLast = i === segCount - 1;
    const w = isLast ? end - x : segW - d.gapW;
    platforms.push({ x, y: GROUND_Y, w: Math.max(120, w), h: 60, kind: 'ground' });
    x += Math.max(120, w);
    if (!isLast) {
      hazards.push({ x, y: GROUND_Y, w: d.gapW, h: 60 });
      x += d.gapW;
    }
  }

  // --- floating brick platforms, higher and thinner as levels go up ---
  const brickCount = 5 + Math.floor(n * 0.8);
  const brickW = Math.max(70, 130 - n * 6);
  for (let i = 0; i < brickCount; i++) {
    const bx = 300 + (i * (end - 500) / brickCount) + rnd() * 90;
    const by = 340 - rnd() * (90 + n * 10);
    platforms.push({ x: Math.round(bx), y: Math.round(by), w: brickW, h: 18, kind: 'brick' });
  }

  // --- power blocks: two early ones so bombs are always earnable ---
  // Both must sit over solid ground, otherwise the level's bomb is unreachable.
  blocks = [];
  for (const [wantX, type] of [[250, 'filter'], [620, 'uv']]) {
    blocks.push({ x: solidXNear(wantX), y: 300, w: 40, h: 40, type, hit: false });
  }
  // bonus blocks, fewer the further you get
  const bonus = Math.max(3, 8 - Math.floor(n / 2));
  for (let i = 0; i < bonus; i++) {
    const bx = 900 + i * ((end - 1200) / bonus) + rnd() * 60;
    const by = 320 - rnd() * (80 + n * 8);
    const roll = rnd();
    const type = roll < 0.5 ? 'water' : roll < 0.78 ? 'chlorine' : 'filter';
    const bl = { x: Math.round(bx), y: Math.round(by), w: 40, h: 40, type, hit: false };
    if (!overlapsAny(bl, platforms) && !overSewage(bl)) blocks.push(bl);
  }

  // --- enemies spread across the level ---
  enemies = [];
  for (let i = 0; i < d.enemies; i++) {
    const kind = d.kinds[i % d.kinds.length];
    const span = (end - 700) / d.enemies;
    const from = 500 + i * span;
    enemies.push(makeEnemy(kind, from + span * 0.4, from, from + span, d.speed));
  }

  // --- signs: level intro plus a couple of facts ---
  signs = [
    { x: 150, y: GROUND_Y - 50, text: d.intro },
    { x: Math.round(end * 0.42), y: GROUND_Y - 50, text: EDU_LINES[(n * 2) % EDU_LINES.length] },
    { x: Math.round(end * 0.72), y: GROUND_Y - 50, text: EDU_LINES[(n * 2 + 1) % EDU_LINES.length] },
  ];
  signs.forEach(s => s.shown = false);

  goal = { x: end - 150, y: GROUND_Y - 130, w: 40, h: 130 };

  // three checkpoints on solid ground, so a death in a long level does not
  // mean replaying the whole thing
  checkpoints = [];
  for (let i = 1; i <= 3; i++) {
    checkpoints.push({ x: solidXNear(Math.round((end * i) / 4)), taken: false });
  }
  checkpointX = 60;

  levelData = { ...d, end };
  return levelData;
}

// Nearest x to `want` that has ground under it and is clear of every pit.
function solidXNear(want) {
  const ok = x => {
    const onGround = platforms.some(p =>
      p.kind === 'ground' && x > p.x + 20 && x + 40 < p.x + p.w - 20);
    const clear = !hazards.some(h => x + 40 > h.x - 20 && x < h.x + h.w + 20);
    return onGround && clear;
  };
  if (ok(want)) return want;
  for (let step = 20; step <= 900; step += 20) {
    if (ok(want + step)) return want + step;
    if (want - step > 60 && ok(want - step)) return want - step;
  }
  return want;
}

function overlapsAny(r, list) {
  return list.some(p => rectHit(
    { x: r.x - 6, y: r.y - 6, w: r.w + 12, h: r.h + 12 }, p));
}
function overSewage(r) {
  return hazards.some(h => r.x + r.w > h.x - 10 && r.x < h.x + h.w + 10);
}

// Small seeded RNG so a level looks identical every time it is replayed.
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resetLevel() { buildLevel(level); }

// ============ HELPERS ============
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function eduText(type) {
  return ({
    filter:   'FILTRATION: Sand & carbon filters trap dirt and solids.',
    chlorine: 'CHLORINATION: Chlorine kills bacteria & viruses. Used in most city water supplies.',
    uv:       'UV DISINFECTION: Ultraviolet light kills germs without chemicals.',
    water:    'Clean water collected! Every drop matters. +50 points',
  })[type];
}

function showPopup(text) { popup = { text, timer: 200 }; }

// ---- combo scoring ----
// Every kill inside the combo window raises the multiplier. Getting hit or
// letting the timer run out drops it back to zero.
function addKillScore(base, x, y) {
  combo++;
  comboTimer = 150;                       // ~2.5s to land the next one
  comboBest = Math.max(comboBest, combo);
  const mult = Math.min(8, combo);        // caps so it stays sane
  const gained = base * mult;
  score += gained;
  floatText.push({
    x, y, vy: -1.1, life: 60,
    text: '+' + gained + (mult > 1 ? '  x' + mult : ''),
    color: mult >= 5 ? '#ff8' : mult >= 3 ? '#8f8' : '#fff',
  });
  if (mult > 1) sfx('power');
  return gained;
}

function breakCombo() {
  combo = 0;
  comboTimer = 0;
}

function updateFloatText() {
  for (const f of floatText) { f.y += f.vy; f.life--; }
  floatText = floatText.filter(f => f.life > 0);
  if (comboTimer > 0 && --comboTimer === 0) combo = 0;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 6 - 1,
      color, life: 45, size: 2 + Math.random() * 4
    });
  }
}

function damagePlayer() {
  if (jerry.invuln > 0) return;
  breakCombo();          // getting hit always costs your streak

  // SHIELD soaks the hit and then recharges over a few seconds
  if (jerry.shield) {
    jerry.shield = false;
    jerry.shieldCd = 720;   // 12s - a real safety net, not a free pass
    jerry.invuln = 60;
    sfx('hit');
    spawnParticles(jerry.x + 14, jerry.y + 18, '#6ef', 18);
    return;
  }

  // In the boss arena bombs are the only weapon, so losing them would make the
  // fight unwinnable - take a life instead of dropping a stage.
  const inBossFight = gameState === 'villain';
  if (jerry.stage > 0 && !inBossFight) {
    // drop one stage: armed -> big -> small, only then lose a life
    setStage(jerry.stage - 1);
    jerry.invuln = 90;
    spawnParticles(jerry.x + 14, jerry.y + 18, '#fff', 12);
    sfx('hurt');
  } else {
    lives--;
    sfx('hurt');
    if (lives <= 0) { gameState = 'gameover'; return; }
    respawnPlayer();
  }
}

function respawnPlayer() {
  if (gameState === 'villain') {
    // respawn on the far side from the villain so he can't camp the spawn
    jerry.x = villain && villain.x < W / 2 ? W - 110 : 70;
    jerry.y = 280;
    villainShots = [];
  } else {
    // Send Jerry back to the last checkpoint he touched rather than a blind
    // 200px back, which could drop him straight into the pit that killed him.
    jerry.x = checkpointX;
    jerry.y = 200;
    // clear sludge near the respawn so you are not hit instantly
    villainShots = villainShots.filter(s => Math.abs(s.x - jerry.x) > 220);
    // give the nearby enemies a moment of breathing room
    for (const e of enemies) {
      if (e.alive && Math.abs(e.x - jerry.x) < 150) e.alive = false;
    }
  }
  jerry.vx = 0; jerry.vy = 0;
  jerry.jumps = 0;
  jerry.invuln = 120;
  breakCombo();
}

// Checkpoints sit on solid ground every so often through a level.
function updateCheckpoints() {
  for (const c of checkpoints) {
    if (c.taken) continue;
    if (jerry.x + jerry.w > c.x && jerry.x < c.x + 30) {
      c.taken = true;
      checkpointX = c.x;
      sfx('power');
      spawnParticles(c.x + 12, GROUND_Y - 40, '#4f8', 16);
      floatText.push({ x: c.x + 12, y: GROUND_Y - 60, vy: -1,
                       life: 70, text: 'CHECKPOINT', color: '#4f8' });
    }
  }
}

// ============ UPDATE ============
function updatePlaying() {
  const d = levelData || levelDef(level);

  // ---- input ----
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  // jump, with an extra mid-air jump once DOUBLE JUMP is unlocked
  const jumpKey = keys[' '] || keys['w'] || keys['arrowup'];
  const maxJumps = hasPower('doublejump') ? 2 : 1;
  if (jumpKey && !jerry._jumpHeld && jerry.jumps < maxJumps) {
    jerry.vy = JUMP_POWER * (jerry.jumps === 0 ? 1 : 0.88);
    jerry.onGround = false;
    jerry.jumps++;
    sfx('jump');
    if (jerry.jumps === 2) spawnParticles(jerry.x + 14, jerry.y + jerry.h, '#cfe9ff', 8);
  }
  jerry._jumpHeld = jumpKey;

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    throwBombs(9);
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  // shield slowly recharges after being spent
  if (hasPower('shield') && !jerry.shield) {
    if (--jerry.shieldCd <= 0) { jerry.shield = true; jerry.shieldCd = 0; }
  }

  // ---- physics ----
  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx;
  jerry.y += jerry.vy;
  jerry.onGround = false;
  if (jerry.x < 0) jerry.x = 0;

  for (const p of platforms.concat(blocks)) {
    if (rectHit(jerry, p)) {
      const prevX = jerry.x - jerry.vx;
      const prevY = jerry.y - jerry.vy;
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h; jerry.vy = 0;
        jerry.onGround = true; jerry.jumps = 0;
      } else if (prevY >= p.y + p.h - 1) {
        jerry.y = p.y + p.h; jerry.vy = 1;
        if (!p.hit && p.type) { p.hit = true; triggerBlock(p); }
      } else if (prevX + jerry.w <= p.x + 1) {
        jerry.x = p.x - jerry.w;
      } else if (prevX >= p.x + p.w - 1) {
        jerry.x = p.x + p.w;
      }
    }
  }

  // ---- enemies ----
  for (const e of enemies) {
    if (!e.alive) continue;

    if (e.type === 'chaser') {
      // walks toward Jerry, but only within its own stretch of the level
      const dir = Math.sign((jerry.x + jerry.w / 2) - (e.x + e.w / 2)) || 1;
      e.x += dir * Math.abs(e.vx);
      e.x = Math.max(e.minX, Math.min(e.maxX - e.w, e.x));
      e.vx = dir * Math.abs(e.vx);
    } else if (e.type === 'spitter') {
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
      // fires sludge when Jerry is roughly in front of it
      if (--e.fireTimer <= 0) {
        e.fireTimer = Math.max(50, 130 - level * 8);
        const dx = (jerry.x + jerry.w / 2) - (e.x + e.w / 2);
        if (Math.abs(dx) < 380) {
          villainShots.push({
            x: e.x + e.w / 2, y: e.y + 8,
            vx: Math.sign(dx) * (3 + level * 0.15), vy: -3.4,
            r: 8, kind: 'toxic', spin: 0, fromEnemy: true,
          });
        }
      }
    } else if (e.type !== 'drum') {
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
    }

    if (e.type === 'drone') {
      e.phase += 0.04;
      e.y = e.baseY + Math.sin(e.phase) * 26;
    }

    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      // stompable on top: everything on the ground except drones and drums
      const stompable = e.type === 'trash' || e.type === 'barrel' || e.type === 'chaser';
      if (stompable && jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 10) {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        jerry.jumps = Math.min(jerry.jumps, 1);
        addKillScore(100 + level * 10, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#8b6f47', 10);
      } else {
        damagePlayer();
      }
    }
  }

  // ---- sludge fired by spitters ----
  for (const s of villainShots) {
    s.vy += GRAVITY * 0.55;
    s.x += s.vx; s.y += s.vy;
    s.spin += 0.2;
    if (s.y - s.r > H || s.x < camera.x - 120 || s.x > camera.x + W + 120) s.dead = true;
    if (!s.dead && jerry.invuln <= 0 &&
        rectHit({ x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 }, jerry)) {
      s.dead = true;
      damagePlayer();
    }
  }
  villainShots = villainShots.filter(s => !s.dead);

  // ---- sewage pits ----
  for (const h of hazards) {
    if (jerry.y + jerry.h > h.y + 8 &&
        jerry.x + jerry.w > h.x + 5 && jerry.x < h.x + h.w - 5) {
      damagePlayer();
      break;
    }
  }

  if (jerry.y > H + 50) damagePlayer();

  updateCheckpoints();

  for (const s of signs) {
    if (s.shown) continue;
    if (Math.abs((jerry.x + jerry.w / 2) - (s.x + 20)) < 40) {
      s.shown = true;
      showPopup(s.text);
    }
  }

  // ---- bombs ----
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > d.end + 50) b.dead = true;
    for (const e of enemies) {
      if (!e.alive || b.dead) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, e)) {
        e.alive = false;
        addKillScore(100 + level * 10, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#4af', 15);
        // piercing bombs carry on through a couple of enemies
        if (b.pierce && ++b.hits < 3) continue;
        b.dead = true;
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of particles) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  updateFloatText();

  // clamp against the visible width, so a wide view never scrolls past the end
  camera.x = Math.max(0, Math.min(d.end - VIEW_W, jerry.x - (VIEW_W / 2 - 100)));

  // ---- level complete ----
  if (jerry.x + jerry.w > goal.x + 10) {
    // every level ends with its own boss; nextLevel() runs once it is beaten
    startVillain();
  }

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// Moves on to the next stage, keeping powers and score.
function nextLevel() {
  // clear bonus rewards keeping lives and chaining kills, so playing well
  // pays off instead of just surviving
  const lifeBonus = lives * 150;
  const comboBonus = comboBest * 100;
  score += 500 + lifeBonus + comboBonus;
  powerBanner = {
    text: 'LEVEL CLEAR!  +' + (500 + lifeBonus + comboBonus),
    timer: 170,
  };
  comboBest = 0;
  breakCombo();

  level++;
  levelReached = Math.max(levelReached, level);
  buildLevel(level);
  gameState = 'playing';        // back to the platforming after a boss
  villain = null;
  jerry.x = 60; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
  jerry.jumps = 0;
  camera.x = 0;
  bombs = [];
  villainShots = [];
  bossActiveEnemies = [];
  particles = [];
  levelBanner = 150;
  sfx('power');
}

function triggerBlock(b) {
  spawnParticles(b.x + 20, b.y, '#4af', 12);
  sfx(b.type === 'filter' || b.type === 'uv' ? 'power' : 'hit');

  // filter and UV are the power blocks: each one moves Jerry up a stage
  if (b.type === 'filter' || b.type === 'uv') {
    score += 200;
    if (jerry.stage >= 2) {
      // already armed: hand out this level's reward power
      const reward = (levelData || levelDef(level)).power;
      setStage(2);
      spawnParticles(b.x + 20, b.y - 10, '#ff8', 16);
      if (grantPower(reward) && POWER_INFO[reward]) {
        powerBanner = { text: POWER_INFO[reward].label + ' UNLOCKED!', timer: 150 };
        showPopup(eduText(b.type) + ' ' + POWER_INFO[reward].blurb + '!');
      } else {
        showPopup(eduText(b.type) + ' Bomb recharged!');
      }
    } else {
      setStage(jerry.stage + 1);
      spawnParticles(b.x + 20, b.y - 10, jerry.stage === 2 ? '#ff8' : '#fff', 18);
      if (jerry.stage === 2) grantPower('bomb');
      showPopup(jerry.stage === 1
        ? eduText(b.type) + ' Jerry GREW BIGGER! Hit another power block for water bombs.'
        : eduText(b.type) + ' WATER BOMBS unlocked - press [X] to throw!');
    }
    return;
  }

  showPopup(eduText(b.type));
  if (b.type === 'chlorine') { lives++; score += 200; }
  else if (b.type === 'water') { score += 50; }
}

// ============ LEVEL BOSSES ============
// Every level ends with the polluter behind it. One code path drives all
// eight; BOSSES[] decides how hard each one hits.
function startVillain() {
  gameState = 'villain';
  const d = bossDef(level);
  levelReached = Math.max(levelReached, level);
  jerry.x = 70; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
  jerry.jumps = 0;
  levelBanner = 0;
  // bombs are the only way to hurt a boss, so make sure Jerry has them
  setStage(2);
  grantPower('bomb');
  camera.x = 0;
  bombs = [];
  villainShots = [];
  bossActiveEnemies = [];
  particles = [];

  villain = {
    def: d,
    name: d.name,
    x: 600, y: GROUND_Y - d.h, w: d.w, h: d.h,
    vx: -d.speed, vy: 0, onGround: true,
    hp: d.hp, maxHp: d.hp,
    hurt: 0,           // flash timer after taking a hit
    attackTimer: 90,   // frames until the next attack
    phase: 1,          // gets more aggressive as hp drops
    facing: -1,
    minionTimer: d.minionGap || 0,
    slam: 0,           // shockwave animation timer
    rage: 0,           // final boss only: temporary frenzy
  };
  showPopup('BOSS: ' + d.taunt);
}

function updateVillain() {
  // ---- player ----
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  const jumpKey = keys[' '] || keys['w'] || keys['arrowup'];
  const maxJumps = hasPower('doublejump') ? 2 : 1;
  if (jumpKey && !jerry._jumpHeld && jerry.jumps < maxJumps) {
    jerry.vy = JUMP_POWER * (jerry.jumps === 0 ? 1 : 0.88);
    jerry.onGround = false;
    jerry.jumps++;
    sfx('jump');
  }
  jerry._jumpHeld = jumpKey;

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    throwBombs(9);
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  if (hasPower('shield') && !jerry.shield) {
    if (--jerry.shieldCd <= 0) { jerry.shield = true; jerry.shieldCd = 0; }
  }

  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx; jerry.y += jerry.vy;
  jerry.onGround = false;

  // arena platforms let Jerry get height to dodge
  const arena = [
    { x: 0, y: GROUND_Y, w: W, h: 60 },
    { x: 120, y: 330, w: 110, h: 16 },
    { x: 570, y: 330, w: 110, h: 16 },
    { x: 345, y: 240, w: 110, h: 16 },
  ];
  for (const p of arena) {
    if (rectHit(jerry, p)) {
      const prevY = jerry.y - jerry.vy;
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h; jerry.vy = 0;
        jerry.onGround = true; jerry.jumps = 0;
      }
    }
  }
  if (jerry.x < 0) jerry.x = 0;
  if (jerry.x + jerry.w > W) jerry.x = W - jerry.w;

  // ---- villain AI ----
  const v = villain;
  const d = v.def || bossDef(level);
  v.phase = v.hp <= v.maxHp / 3 ? 3 : (v.hp <= v.maxHp * 2 / 3 ? 2 : 1);

  // pace back and forth, turning at the arena edges; rage makes him sprint
  const speedMul = v.rage > 0 ? 1.7 : 1;
  v.x += v.vx * speedMul;
  if (v.x < 40) { v.x = 40; v.vx = Math.abs(v.vx); }
  if (v.x + v.w > W - 40) { v.x = W - 40 - v.w; v.vx = -Math.abs(v.vx); }
  v.facing = Math.sign(v.vx) || -1;

  // gravity for his jumps
  v.vy += GRAVITY;
  v.y += v.vy;
  if (v.y + v.h >= GROUND_Y) {
    if (!v.onGround && v.slamPending) {
      // landing from a slam sends a shockwave along the floor
      v.slamPending = false;
      v.slam = 26;
      screenShake = 14;
      sfx('boom');
      for (const dir of [-1, 1]) {
        villainShots.push({
          x: v.x + v.w / 2, y: GROUND_Y - 10,
          vx: dir * 5.2, vy: 0, r: 11, kind: 'wave', spin: 0, ground: true,
        });
      }
    }
    v.y = GROUND_Y - v.h; v.vy = 0; v.onGround = true;
  }

  if (v.hurt > 0) v.hurt--;
  if (v.slam > 0) v.slam--;
  if (v.rage > 0) v.rage--;

  // summon helpers on their own timer
  if (d.minions && d.minionGap) {
    if (--v.minionTimer <= 0) {
      v.minionTimer = Math.max(90, d.minionGap - v.phase * 30);
      if (bossActiveEnemies.length < 3 + v.phase) {
        const e = makeEnemy(d.minions, v.x + v.w / 2, 30, W - 30, 1 + v.phase * 0.2);
        e.y = d.minions === 'drone' ? 200 : GROUND_Y - e.h;
        e.baseY = e.y;
        e.minX = 30; e.maxX = W - 30;
        e.fromBoss = true;
        bossActiveEnemies.push(e);
        spawnParticles(v.x + v.w / 2, v.y + 20, '#8a8', 8);
      }
    }
  }

  // ---- attacks ----
  v.attackTimer--;
  if (v.attackTimer <= 0) {
    // later phases and rage shorten the gap between attacks
    const base = d.gap * [1, 0.78, 0.58][v.phase - 1];
    v.attackTimer = Math.max(24, Math.round(base * (v.rage > 0 ? 0.5 : 1))) +
                    Math.floor(Math.random() * 24);

    const moves = d.moves;
    const pick = moves[Math.floor(Math.random() * moves.length)];
    const dirTo = Math.sign((jerry.x + jerry.w / 2) - (v.x + v.w / 2)) || -1;

    if (pick === 'lob') {
      // hurl a money bag on an arc towards Jerry
      villainShots.push({
        x: v.x + v.w / 2, y: v.y + 20,
        vx: dirTo * (3.2 + v.phase * 0.5 + level * 0.12), vy: -5,
        r: 12, kind: 'money', spin: 0,
      });

    } else if (pick === 'spray') {
      // a fan of toxic blobs
      const n = 2 + v.phase + Math.floor(level / 4);
      for (let i = 0; i < n; i++) {
        villainShots.push({
          x: v.x + v.w / 2, y: v.y + 10,
          vx: (i - (n - 1) / 2) * 1.9,
          vy: -6.5,
          r: 9, kind: 'toxic', spin: 0,
        });
      }

    } else if (pick === 'slam') {
      // leap high, then shockwave on landing
      if (v.onGround) {
        v.vy = -13;
        v.onGround = false;
        v.slamPending = true;
        v.vx = dirTo * (2.2 + v.phase * 0.4);
      }

    } else if (pick === 'summon') {
      v.minionTimer = 0;      // trigger a helper immediately

    } else if (pick === 'rage') {
      // final boss only: brief frenzy, everything speeds up
      v.rage = 150;
      screenShake = 10;
      sfx('boom');
      spawnParticles(v.x + v.w / 2, v.y + v.h / 2, '#f44', 26);
    }
  }

  // body contact hurts
  if (jerry.invuln <= 0 && rectHit(jerry, v)) damagePlayer();

  // ---- boss minions ----
  for (const e of bossActiveEnemies) {
    if (!e.alive) continue;
    if (e.type === 'drone') {
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
      e.phase += 0.04;
      e.y = e.baseY + Math.sin(e.phase) * 26;
    } else if (e.type === 'chaser') {
      const dir = Math.sign((jerry.x + jerry.w / 2) - (e.x + e.w / 2)) || 1;
      e.x += dir * Math.abs(e.vx);
      e.vx = dir * Math.abs(e.vx);
    } else if (e.type === 'spitter') {
      if (--e.fireTimer <= 0) {
        e.fireTimer = 110;
        const dx = (jerry.x + jerry.w / 2) - (e.x + e.w / 2);
        villainShots.push({
          x: e.x + e.w / 2, y: e.y + 8,
          vx: Math.sign(dx) * 3.4, vy: -3.4,
          r: 8, kind: 'toxic', spin: 0,
        });
      }
    } else {
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    }
    e.x = Math.max(10, Math.min(W - e.w - 10, e.x));

    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      const stompable = e.type !== 'drone' && e.type !== 'drum';
      if (stompable && jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 10) {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        jerry.jumps = Math.min(jerry.jumps, 1);
        addKillScore(120, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#8b6f47', 10);
      } else {
        damagePlayer();
      }
    }
  }
  // bombs clear minions too
  for (const b of bombs) {
    for (const e of bossActiveEnemies) {
      if (!e.alive || b.dead) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, e)) {
        e.alive = false;
        addKillScore(120, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#4af', 12);
        if (!(b.pierce && ++b.hits < 3)) b.dead = true;
      }
    }
  }
  bossActiveEnemies = bossActiveEnemies.filter(e => e.alive);

  // ---- villain projectiles ----
  for (const s of villainShots) {
    if (s.ground) {
      // shockwave: skims along the floor instead of falling
      s.x += s.vx;
      s.y = GROUND_Y - 10;
      s.spin += 0.3;
      if (s.x < -60 || s.x > W + 60) s.dead = true;
    } else {
      s.vy += GRAVITY * 0.55;
      s.x += s.vx; s.y += s.vy;
      s.spin += 0.2;
      if (s.y - s.r > H || s.x < -60 || s.x > W + 60) s.dead = true;
      // bounce money bags once off the floor so they stay dangerous
      if (s.kind === 'money' && s.y + s.r >= GROUND_Y && s.vy > 0) {
        if (!s.bounced) { s.vy = -5.5; s.bounced = true; }
        else s.dead = true;
      }
    }
    if (!s.dead && jerry.invuln <= 0 &&
        rectHit({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, jerry)) {
      s.dead = true;
      damagePlayer();
    }
  }
  villainShots = villainShots.filter(s => !s.dead);

  // ---- Jerry's bombs vs the villain ----
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > W + 50) b.dead = true;
    if (!b.dead && v.hurt <= 0 &&
        rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r*2, h: b.r*2 }, v)) {
      b.dead = true;
      v.hp--;
      v.hurt = 30;
      screenShake = 12;
      score += 400;
      sfx('boom');
      spawnParticles(b.x, b.y, '#4af', 18);
      spawnParticles(v.x + v.w/2, v.y + 30, '#fff', 12);
      // knock him back a little
      v.vx = Math.sign(v.x - jerry.x) * Math.abs(v.vx) || v.vx;
      if (v.hp <= 0) {
        spawnParticles(v.x + v.w/2, v.y + v.h/2, '#ff8800', 40);
        spawnParticles(v.x + v.w/2, v.y + v.h/2, '#fff', 30);
        score += 500 + level * 250;
        screenShake = 20;
        showPopup('DEFEATED: ' + (v.def || bossDef(level)).name + '. ' +
                  (v.def || bossDef(level)).fact);
        bossActiveEnemies = [];
        villainShots = [];
        if (level >= FINAL_LEVEL) {
          gameState = 'win';
        } else {
          // beat this polluter, on to the next stretch of river.
          // nextLevel() resets bombs/enemies, so stop touching them here.
          nextLevel();
          return;
        }
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of particles) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  updateFloatText();

  if (screenShake > 0) screenShake--;
  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// ============ RENDER ============
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (gameState === 'villain') {
    // stormy showdown sky
    g.addColorStop(0, '#1a1030');
    g.addColorStop(0.55, '#4a2a50');
    g.addColorStop(1, '#8a4a5a');
  } else {
    // each level fades a little dirtier than the last
    const sky = (levelData || levelDef(level)).sky;
    g.addColorStop(0, sky[0]);
    g.addColorStop(1, sky[1]);
  }
  ctx.fillStyle = g;
  // fill the whole view, with a little slack so rounding leaves no edge line
  ctx.fillRect(-2, 0, VIEW_W + 4, H);
}

function drawClouds() {
  const dark = gameState === 'villain' || level >= 6;
  ctx.fillStyle = dark ? 'rgba(80,40,30,0.55)'
    : level >= 3 ? 'rgba(120,110,100,0.55)'
    : 'rgba(255,255,255,0.75)';
  const off = (camera.x * 0.3) % 240;
  const cols = Math.ceil(VIEW_W / 240) + 2;   // cover the full view width
  for (let i = -1; i < cols; i++) {
    const cx = i * 240 - off + 40;
    const cy = 70 + (i % 2) * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.arc(cx + 25, cy - 8, 26, 0, Math.PI*2);
    ctx.arc(cx + 55, cy, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

// Ground palettes per level theme: healthy grass turns to ash further in.
const GROUND_STYLE = {
  grass: { top: '#5a8c3a', tuft: '#7cb85a', soil: '#6b3d1a', dark: '#553015' },
  dead:  { top: '#6b6a45', tuft: '#8a8558', soil: '#5c4a2a', dark: '#42331b' },
  rust:  { top: '#7a5a44', tuft: '#94705a', soil: '#4f3524', dark: '#382417' },
  ash:   { top: '#4f4a52', tuft: '#6b6470', soil: '#332f38', dark: '#221f28' },
};

function drawGround(list) {
  const theme = (levelData || levelDef(level)).ground || 'grass';
  const c = GROUND_STYLE[theme] || GROUND_STYLE.grass;
  for (const p of (list || platforms)) {
    if (p.kind === 'ground') {
      ctx.fillStyle = c.top;
      ctx.fillRect(p.x, p.y, p.w, 10);
      ctx.fillStyle = c.tuft;
      for (let i = 0; i < p.w; i += 12) {
        ctx.fillRect(p.x + i, p.y - 3, 8, 5);
      }
      ctx.fillStyle = c.soil;
      ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
      ctx.fillStyle = c.dark;
      for (let i = 0; i < p.w; i += 30) {
        ctx.fillRect(p.x + i, p.y + 18, 3, 18);
        ctx.fillRect(p.x + i + 15, p.y + 32, 3, 15);
      }
    } else {
      // brick
      ctx.fillStyle = '#a86f3a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#6b3d1a';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      for (let i = 20; i < p.w; i += 20) {
        ctx.beginPath();
        ctx.moveTo(p.x + i, p.y);
        ctx.lineTo(p.x + i, p.y + p.h);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + p.h/2);
      ctx.lineTo(p.x + p.w, p.y + p.h/2);
      ctx.stroke();
    }
  }
}

function drawHazards(list) {
  for (const h of (list || hazards)) {
    ctx.fillStyle = '#4a3a1a';
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = '#3a2a0a';
    ctx.fillRect(h.x, h.y, h.w, 4);
    // bubbles
    for (let i = 0; i < 5; i++) {
      const t = Date.now() * 0.002 + i * 0.7;
      ctx.fillStyle = 'rgba(120,90,40,0.7)';
      ctx.beginPath();
      ctx.arc(h.x + 12 + i * 18, h.y + 25 + Math.sin(t) * 4, 3 + Math.sin(t)*1, 0, Math.PI*2);
      ctx.fill();
    }
    // toxic label
    ctx.fillStyle = 'rgba(255,255,0,0.8)';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('☠ SEWAGE', h.x + 15, h.y + 55);
  }
}

function drawSigns() {
  for (const s of signs) {
    ctx.fillStyle = '#6b4520';
    ctx.fillRect(s.x + 17, s.y + 40, 6, 20);
    ctx.fillStyle = '#d4a86a';
    ctx.fillRect(s.x, s.y, 40, 40);
    ctx.strokeStyle = '#5a3d1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(s.x, s.y, 40, 40);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('!', s.x + 14, s.y + 30);
  }
}

function drawBlocks() {
  for (const b of blocks) {
    if (b.hit) {
      ctx.fillStyle = '#6b4520';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#3a2510';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else {
      const pulse = Math.sin(Date.now() * 0.006) * 0.15 + 1;
      ctx.fillStyle = '#e8a83a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#c88a1a';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3);
      ctx.fillRect(b.x + 3, b.y + b.h - 6, b.w - 6, 3);
      ctx.fillRect(b.x + 3, b.y + 3, 3, b.h - 6);
      ctx.fillRect(b.x + b.w - 6, b.y + 3, 3, b.h - 6);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.floor(24*pulse)}px monospace`;
      ctx.fillText('?', b.x + 12, b.y + 30);
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'trash') {
      // trash bag body
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(e.x + 15, e.y + 20, 15, 12, 0, 0, Math.PI*2);
      ctx.fill();
      // tied top
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(e.x + 8, e.y + 10);
      ctx.lineTo(e.x + 15, e.y);
      ctx.lineTo(e.x + 22, e.y + 10);
      ctx.closePath();
      ctx.fill();
      // menace face
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 7, e.y + 16, 5, 5);
      ctx.fillRect(e.x + 18, e.y + 16, 5, 5);
      ctx.fillStyle = '#a00';
      const eyeShift = e.vx > 0 ? 2 : 0;
      ctx.fillRect(e.x + 8 + eyeShift, e.y + 17, 3, 3);
      ctx.fillRect(e.x + 19 + eyeShift, e.y + 17, 3, 3);
      // little arms
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - 2, e.y + 22, 5, 3);
      ctx.fillRect(e.x + 27, e.y + 22, 5, 3);
    } else if (e.type === 'drum') {
      ctx.fillStyle = '#c04040';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#600';
      ctx.fillRect(e.x, e.y + 6, e.w, 4);
      ctx.fillRect(e.x, e.y + e.h - 10, e.w, 4);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('☠', e.x + 12, e.y + 27);
      // drip
      ctx.fillStyle = '#4a2a0a';
      ctx.fillRect(e.x + 5, e.y + e.h - 2, 6, 4);
    } else if (e.type === 'barrel') {
      // rolling toxic barrel
      const cx = e.x + e.w/2, cy = e.y + e.h/2, r = e.w/2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((e.x * 0.06) * (e.vx > 0 ? 1 : -1));
      ctx.fillStyle = '#a83a2a';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5a1a10'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#701f14';
      ctx.beginPath();
      ctx.moveTo(-r, -r*0.35); ctx.lineTo(r, -r*0.35);
      ctx.moveTo(-r, r*0.35);  ctx.lineTo(r, r*0.35);
      ctx.stroke();
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('☠', -5, 5);
      ctx.restore();
      // leaking sludge
      ctx.fillStyle = 'rgba(90,120,30,0.75)';
      ctx.fillRect(e.x + 8, e.y + e.h - 2, 8, 4);
    } else if (e.type === 'drone') {
      const cx = e.x + e.w/2;
      // rotors
      ctx.strokeStyle = '#889';
      ctx.lineWidth = 2;
      const blur = Math.sin(Date.now() * 0.05) * 6;
      ctx.beginPath();
      ctx.moveTo(e.x - 4 + blur, e.y); ctx.lineTo(e.x + 12 - blur, e.y);
      ctx.moveTo(e.x + e.w - 12 + blur, e.y); ctx.lineTo(e.x + e.w + 4 - blur, e.y);
      ctx.stroke();
      ctx.fillStyle = '#667';
      ctx.fillRect(e.x + 3, e.y + 2, 5, 5);
      ctx.fillRect(e.x + e.w - 8, e.y + 2, 5, 5);
      // body
      ctx.fillStyle = '#4a4a58';
      ctx.fillRect(e.x, e.y + 6, e.w, e.h - 6);
      ctx.strokeStyle = '#22222c';
      ctx.strokeRect(e.x, e.y + 6, e.w, e.h - 6);
      // angry red eye scanning
      ctx.fillStyle = '#f33';
      const ex = cx + (e.vx > 0 ? 4 : -4);
      ctx.beginPath(); ctx.arc(ex, e.y + 14, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,60,60,0.35)';
      ctx.beginPath(); ctx.arc(ex, e.y + 14, 7, 0, Math.PI*2); ctx.fill();

    } else if (e.type === 'spitter') {
      // squat sludge pipe that shoots at Jerry
      const about = e.fireTimer < 25;
      ctx.fillStyle = '#4a5a3a';
      ctx.fillRect(e.x, e.y + 10, e.w, e.h - 10);
      ctx.strokeStyle = '#26301c'; ctx.lineWidth = 2;
      ctx.strokeRect(e.x, e.y + 10, e.w, e.h - 10);
      // nozzle, pointing the way it will fire
      const dir = (jerry.x > e.x) ? 1 : -1;
      ctx.fillStyle = '#33402a';
      ctx.fillRect(dir > 0 ? e.x + e.w - 4 : e.x - 8, e.y + 14, 12, 9);
      // glowing charge before it spits
      ctx.fillStyle = about ? '#cfff5a' : '#7aa83a';
      ctx.beginPath();
      ctx.arc(e.x + e.w / 2, e.y + 8, about ? 8 : 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1e2a14';
      ctx.fillRect(e.x + 8, e.y + 22, 5, 5);
      ctx.fillRect(e.x + e.w - 13, e.y + 22, 5, 5);

    } else if (e.type === 'chaser') {
      // hungry blob that runs at you
      const wob = Math.sin(Date.now() * 0.012 + e.x * 0.05) * 2;
      ctx.fillStyle = '#7a2a5a';
      ctx.beginPath();
      ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2 + wob, e.w / 2, e.h / 2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#43102f'; ctx.lineWidth = 2; ctx.stroke();
      // legs
      ctx.fillStyle = '#43102f';
      for (let i = 0; i < 3; i++) {
        const lx = e.x + 6 + i * 9;
        ctx.fillRect(lx, e.y + e.h - 4, 3, 5 + Math.sin(Date.now() * 0.02 + i) * 2);
      }
      // eyes track Jerry
      const look = jerry.x > e.x ? 3 : -3;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x + 11, e.y + 13 + wob, 5, 0, Math.PI * 2);
      ctx.arc(e.x + e.w - 11, e.y + 13 + wob, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a00';
      ctx.beginPath();
      ctx.arc(e.x + 11 + look, e.y + 14 + wob, 2.5, 0, Math.PI * 2);
      ctx.arc(e.x + e.w - 11 + look, e.y + 14 + wob, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // teeth
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) ctx.fillRect(e.x + 8 + i * 5, e.y + 22 + wob, 3, 4);
    }
  }
}

// Sludge fired by spitters (reuses the villain's projectile list).
function drawEnemyShots() {
  for (const s of villainShots) {
    ctx.fillStyle = 'rgba(120,200,40,0.9)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a6b10'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(200,255,120,0.9)';
    ctx.beginPath(); ctx.arc(s.x - 3, s.y - 3, s.r * 0.35, 0, Math.PI * 2); ctx.fill();
  }
}

// "LEVEL n - NAME" card when a stage starts, and power unlock toasts.
function drawLevelBanner() {
  if (levelBanner > 0) {
    levelBanner--;
    const d = levelDef(level);
    const a = Math.min(1, levelBanner / 40);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,10,25,0.8)';
    ctx.fillRect(0, H / 2 - 52, W, 96);
    ctx.strokeStyle = '#4af'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H / 2 - 52); ctx.lineTo(W, H / 2 - 52);
    ctx.moveTo(0, H / 2 + 44); ctx.lineTo(W, H / 2 + 44);
    ctx.stroke();
    ctx.fillStyle = '#4af';
    ctx.font = 'bold 34px monospace';
    ctx.fillText('LEVEL ' + level, W / 2, H / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(d.name, W / 2, H / 2 + 20);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  if (powerBanner) {
    powerBanner.timer--;
    if (powerBanner.timer <= 0) { powerBanner = null; return; }
    const a = Math.min(1, powerBanner.timer / 30);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(40,30,0,0.85)';
    ctx.fillRect(W / 2 - 190, 150, 380, 44);
    ctx.strokeStyle = '#ffd94a'; ctx.lineWidth = 3;
    ctx.strokeRect(W / 2 - 190, 150, 380, 44);
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 19px monospace';
    ctx.fillText('★ ' + powerBanner.text + ' ★', W / 2, 179);
    ctx.restore();
    ctx.textAlign = 'left';
  }
}

// ============ LEVEL 2 / VILLAIN RENDER ============
function drawVillain() {
  const v = villain;
  const d = v.def || bossDef(level);
  const flash = v.hurt > 0 && Math.floor(Date.now() / 60) % 2 === 0;
  const raging = v.rage > 0;

  // proportions scale with each boss's size
  const S = v.h / 96;
  const bodyTop = v.y + 26 * S;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(v.x + v.w / 2, GROUND_Y + 3, v.w / 2, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // rage aura on the final boss
  if (raging) {
    ctx.strokeStyle = `rgba(255,70,70,${0.35 + Math.sin(Date.now() * 0.02) * 0.25})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(v.x + v.w / 2, v.y + v.h / 2, v.w * 0.85, v.h * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  const skin = flash ? '#fff' : '#e8b98a';
  const suit = flash ? '#fff' : d.color;
  const trim = flash ? '#fff' : d.accent;

  // legs
  ctx.fillStyle = suit;
  ctx.fillRect(v.x + 10 * S, bodyTop + 36 * S, 14 * S, v.h - 62 * S);
  ctx.fillRect(v.x + v.w - 24 * S, bodyTop + 36 * S, 14 * S, v.h - 62 * S);
  // shoes
  ctx.fillStyle = flash ? '#fff' : '#111';
  ctx.fillRect(v.x + 6 * S, v.y + v.h - 8 * S, 20 * S, 8 * S);
  ctx.fillRect(v.x + v.w - 26 * S, v.y + v.h - 8 * S, 20 * S, 8 * S);

  // body
  ctx.fillStyle = suit;
  ctx.fillRect(v.x, bodyTop, v.w, 40 * S);
  // shirt
  ctx.fillStyle = flash ? '#fff' : '#e8e8e8';
  ctx.fillRect(v.x + v.w / 2 - 9 * S, bodyTop + 2 * S, 18 * S, 34 * S);
  // tie in the boss's accent colour
  ctx.fillStyle = trim;
  ctx.beginPath();
  ctx.moveTo(v.x + v.w / 2, bodyTop + 2 * S);
  ctx.lineTo(v.x + v.w / 2 - 5 * S, bodyTop + 10 * S);
  ctx.lineTo(v.x + v.w / 2, bodyTop + 32 * S);
  ctx.lineTo(v.x + v.w / 2 + 5 * S, bodyTop + 10 * S);
  ctx.closePath(); ctx.fill();

  // arms
  ctx.fillStyle = suit;
  ctx.fillRect(v.x - 6 * S, bodyTop + 4 * S, 10 * S, 26 * S);
  ctx.fillRect(v.x + v.w - 4 * S, bodyTop + 4 * S, 10 * S, 26 * S);
  ctx.fillStyle = skin;
  ctx.fillRect(v.x - 6 * S, bodyTop + 28 * S, 10 * S, 8 * S);
  ctx.fillRect(v.x + v.w - 4 * S, bodyTop + 28 * S, 10 * S, 8 * S);

  // head
  ctx.fillStyle = skin;
  ctx.fillRect(v.x + 12 * S, v.y + 2 * S, v.w - 24 * S, 26 * S);

  // hat — every polluter wears a different one
  ctx.fillStyle = flash ? '#fff' : '#15151f';
  if (d.n === 4 || d.n === 7) {
    // peaked cap for the enforcers
    ctx.fillRect(v.x + 10 * S, v.y - 1 * S, v.w - 20 * S, 7 * S);
    ctx.fillRect(v.x + 6 * S, v.y + 4 * S, v.w - 12 * S, 4 * S);
    ctx.fillStyle = trim;
    ctx.fillRect(v.x + 10 * S, v.y + 1 * S, v.w - 20 * S, 3 * S);
  } else if (d.n === 5 || d.n === 3) {
    // hard hat for the site workers
    ctx.fillStyle = flash ? '#fff' : '#e8a83a';
    ctx.beginPath();
    ctx.ellipse(v.x + v.w / 2, v.y + 4 * S, (v.w - 20 * S) / 2, 9 * S, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(v.x + 8 * S, v.y + 3 * S, v.w - 16 * S, 4 * S);
  } else {
    // top hat for the bosses in suits
    ctx.fillRect(v.x + 6 * S, v.y - 2 * S, v.w - 12 * S, 5 * S);
    ctx.fillRect(v.x + 13 * S, v.y - 18 * S, v.w - 26 * S, 17 * S);
    ctx.fillStyle = trim;
    ctx.fillRect(v.x + 13 * S, v.y - 7 * S, v.w - 26 * S, 4 * S);
  }

  // angry eyes follow Jerry
  const look = v.facing > 0 ? 2 * S : -2 * S;
  ctx.fillStyle = '#fff';
  ctx.fillRect(v.x + 17 * S, v.y + 10 * S, 8 * S, 7 * S);
  ctx.fillRect(v.x + v.w - 25 * S, v.y + 10 * S, 8 * S, 7 * S);
  ctx.fillStyle = raging ? '#f00' : '#000';
  ctx.fillRect(v.x + 19 * S + look, v.y + 12 * S, 4 * S, 4 * S);
  ctx.fillRect(v.x + v.w - 23 * S + look, v.y + 12 * S, 4 * S, 4 * S);
  // furious brows
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(v.x + 16 * S, v.y + 7 * S); ctx.lineTo(v.x + 26 * S, v.y + 11 * S);
  ctx.moveTo(v.x + v.w - 16 * S, v.y + 7 * S); ctx.lineTo(v.x + v.w - 26 * S, v.y + 11 * S);
  ctx.stroke();
  // grimace
  ctx.beginPath();
  ctx.moveTo(v.x + 20 * S, v.y + 24 * S); ctx.lineTo(v.x + v.w - 20 * S, v.y + 24 * S);
  ctx.stroke();
  // cigar
  ctx.fillStyle = flash ? '#fff' : '#6b3d1a';
  ctx.fillRect(v.x + v.w - 18 * S, v.y + 21 * S, 12 * S, 4 * S);
  ctx.fillStyle = '#f80';
  ctx.fillRect(v.x + v.w - 7 * S, v.y + 21 * S, 3 * S, 4 * S);

  // name plate and health bar above him
  const bw = Math.max(96, v.w + 46), bx = v.x + v.w / 2 - bw / 2, by = v.y - 40;
  ctx.textAlign = 'center';
  ctx.fillStyle = flash ? '#fff' : trim;
  ctx.font = 'bold 11px monospace';
  ctx.fillText(d.name, v.x + v.w / 2, by - 4);
  ctx.textAlign = 'left';

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
  ctx.fillStyle = '#500';
  ctx.fillRect(bx, by, bw, 8);
  const frac = v.hp / v.maxHp;
  ctx.fillStyle = frac > 0.6 ? '#3d3' : frac > 0.3 ? '#fd3' : '#f44';
  ctx.fillRect(bx, by, bw * frac, 8);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, 8);
  // pip per hit so you can see exactly how many bombs are left
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  for (let i = 1; i < v.maxHp; i++) {
    const x = bx + (bw * i) / v.maxHp;
    ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + 8); ctx.stroke();
  }
}

function drawVillainShots() {
  for (const s of villainShots) {
    if (s.kind === 'money') {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#c8a83a';
      ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#6b5410'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#3a2a08';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('$', -4, 5);
      ctx.restore();
    } else if (s.kind === 'wave') {
      // ground shockwave from a slam
      ctx.strokeStyle = 'rgba(255,180,80,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y + 6, s.r + Math.sin(s.spin * 3) * 2, Math.PI, 0);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,120,40,0.5)';
      ctx.beginPath();
      ctx.arc(s.x, s.y + 6, s.r * 0.6, Math.PI, 0);
      ctx.stroke();
      ctx.fillStyle = 'rgba(120,90,40,0.5)';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(s.x - 6 + i * 6, s.y + 2 - (i % 2) * 4, 3, 3);
      }
    } else {
      // toxic blob
      ctx.fillStyle = 'rgba(120,200,40,0.9)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3a6b10'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(200,255,120,0.9)';
      ctx.beginPath(); ctx.arc(s.x - 3, s.y - 3, s.r * 0.35, 0, Math.PI*2); ctx.fill();
    }
  }
}

// Boss helpers reuse the level enemy art.
function drawBossMinions() {
  const saved = enemies;
  enemies = bossActiveEnemies;
  drawEnemies();
  enemies = saved;
}

function drawVillainScene() {
  // arena floor
  ctx.fillStyle = '#4a3a4a';
  ctx.fillRect(0, GROUND_Y, W, 60);
  ctx.fillStyle = '#2a1f2a';
  ctx.fillRect(0, GROUND_Y, W, 6);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = 'rgba(120,90,20,0.5)';
    ctx.beginPath();
    ctx.ellipse(70 + i * 130, GROUND_Y + 16, 34, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // what the boss is standing on says what they do
  const d = (villain && villain.def) || bossDef(level);
  for (let i = 0; i < 3; i++) {
    const bx = 150 + i * 260;
    if (d.n === 1) {                       // rubbish sacks
      ctx.fillStyle = '#2f2f2f';
      ctx.beginPath();
      ctx.ellipse(bx + 30, GROUND_Y - 8, 30, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(bx + 24, GROUND_Y - 20, 12, 8);
    } else if (d.n === 2 || d.n === 5) {   // stacked drums
      ctx.fillStyle = '#a83a2a';
      ctx.fillRect(bx + 8, GROUND_Y - 26, 22, 26);
      ctx.fillRect(bx + 34, GROUND_Y - 20, 22, 20);
      ctx.fillStyle = '#5a1a10';
      ctx.fillRect(bx + 8, GROUND_Y - 20, 22, 3);
      ctx.fillRect(bx + 34, GROUND_Y - 15, 22, 3);
    } else if (d.n === 3 || d.n === 6) {   // sludge pools
      ctx.fillStyle = 'rgba(110,150,40,0.75)';
      ctx.beginPath();
      ctx.ellipse(bx + 30, GROUND_Y + 4, 42, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (d.n === 4 || d.n === 7) {   // crates and pipes
      ctx.fillStyle = '#5a5a66';
      ctx.fillRect(bx + 10, GROUND_Y - 22, 44, 22);
      ctx.strokeStyle = '#33333c'; ctx.lineWidth = 2;
      ctx.strokeRect(bx + 10, GROUND_Y - 22, 44, 22);
      ctx.beginPath();
      ctx.moveTo(bx + 10, GROUND_Y - 22); ctx.lineTo(bx + 54, GROUND_Y);
      ctx.stroke();
    } else {                                // the tycoon's money
      ctx.fillStyle = '#2f7a3f';
      ctx.fillRect(bx, GROUND_Y - 10, 60, 10);
      ctx.fillStyle = '#3d9b52';
      ctx.fillRect(bx + 6, GROUND_Y - 16, 48, 8);
      ctx.fillStyle = '#1d5a2c';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('$$$', bx + 20, GROUND_Y - 3);
    }
  }

  // arena platforms
  const arena = [
    { x: 120, y: 330, w: 110, h: 16 },
    { x: 570, y: 330, w: 110, h: 16 },
    { x: 345, y: 240, w: 110, h: 16 },
  ];
  for (const p of arena) {
    ctx.fillStyle = '#6a5a6a';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#3a2f3a'; ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  }

  drawBossMinions();
  drawVillain();
  drawVillainShots();
}

function drawGoal() {
  // treatment plant portal
  ctx.fillStyle = '#4af';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.fillStyle = '#28d';
  ctx.fillRect(goal.x - 10, goal.y, goal.w + 20, 20);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('BOSS', goal.x + 5, goal.y - 8);
  ctx.fillStyle = '#8cf';
  for (let i = 0; i < 4; i++) {
    const t = (Date.now() * 0.003 + i * 0.4) % 1;
    ctx.globalAlpha = 1 - t;
    ctx.fillRect(goal.x + 8, goal.y + 30 + t * 80, 24, 4);
  }
  ctx.globalAlpha = 1;
}

function drawJerry() {
  const j = jerry;
  if (j.invuln > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

  const scale = j.powered ? 1.25 : 1;
  const dw = j.w * scale, dh = j.h * scale;
  const px = j.x + (j.w - dw) / 2;
  const py = j.y + (j.h - dh);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px + dw/2, py + dh + 3, dw/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // droplet body
  ctx.fillStyle = j.powered ? '#3ac0ff' : '#4a9fff';
  ctx.beginPath();
  ctx.moveTo(px + dw/2, py);
  ctx.bezierCurveTo(px + dw*1.05, py + dh*0.3, px + dw*1.05, py + dh*0.9, px + dw/2, py + dh);
  ctx.bezierCurveTo(px - dw*0.05, py + dh*0.9, px - dw*0.05, py + dh*0.3, px + dw/2, py);
  ctx.fill();

  // outline
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();

  // highlight
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + dw*0.32, py + dh*0.38, dw*0.11, dh*0.16, 0, 0, Math.PI*2);
  ctx.fill();

  // eyes
  const eyeY = py + dh * 0.55;
  const eyeShift = j.facing > 0 ? 1 : -1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + dw*0.35, eyeY, 5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65, eyeY, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + dw*0.35 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.fill();

  // smile
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + dw/2, py + dh*0.75, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // powered aura
  if (j.powered) {
    ctx.strokeStyle = `rgba(255,255,100,${0.4 + Math.sin(Date.now()*0.015)*0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + dw/2, py + dh/2, dw*0.75, 0, Math.PI*2);
    ctx.stroke();
  }

  // bomb indicator
  if (j.hasBomb) {
    const bx = px + dw + 6, by = py + 4;
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(bx, by, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('X', bx - 3, by + 3);
  }
}

function drawBombs() {
  for (const b of bombs) {
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#28d';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#e8f4ff';
    ctx.beginPath();
    ctx.arc(b.x - 2, b.y - 2, 2.5, 0, Math.PI*2);
    ctx.fill();
    // trail
    ctx.fillStyle = 'rgba(74,175,255,0.4)';
    ctx.beginPath();
    ctx.arc(b.x - b.vx*0.5, b.y - b.vy*0.5, b.r*0.7, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// Checkpoint flags: grey until reached, then green and waving.
function drawCheckpoints() {
  for (const c of checkpoints) {
    const poleTop = GROUND_Y - 62;
    ctx.fillStyle = '#8a8a92';
    ctx.fillRect(c.x + 12, poleTop, 4, 62);
    ctx.fillStyle = '#6a6a72';
    ctx.fillRect(c.x + 6, GROUND_Y - 4, 16, 4);
    const wave = c.taken ? Math.sin(Date.now() * 0.006) * 3 : 0;
    ctx.fillStyle = c.taken ? '#3ad07a' : '#5a6068';
    ctx.beginPath();
    ctx.moveTo(c.x + 16, poleTop + 2);
    ctx.lineTo(c.x + 40 + wave, poleTop + 10);
    ctx.lineTo(c.x + 16, poleTop + 20);
    ctx.closePath();
    ctx.fill();
    if (c.taken) {
      ctx.strokeStyle = 'rgba(58,208,122,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x + 14, poleTop + 11, 16 + Math.sin(Date.now() * 0.004) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// Score popups that rise from whatever you just destroyed.
function drawFloatText() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px monospace';
  for (const f of floatText) {
    ctx.globalAlpha = Math.min(1, f.life / 25);
    ctx.fillStyle = '#000';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, 36);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, W, 36);

  // Laid out left to right in fixed slots so nothing can overlap:
  //   15  name | 100 score | 250 lives | 430 power | 590 timer | right: level
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('◆ JERRY', 15, 23);

  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + score, 100, 23);

  ctx.fillText('LIVES', 250, 23);
  const maxPips = 5;
  for (let i = 0; i < Math.min(lives, maxPips); i++) {
    drawMiniDroplet(316 + i * 19, 15);
  }
  if (lives > maxPips) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('+' + (lives - maxPips), 316 + maxPips * 19, 23);
  }

  // powerup stage: no bomb until Jerry has hit two power blocks
  ctx.font = 'bold 13px monospace';
  if (jerry.stage < 2) {
    ctx.fillStyle = '#789';
    ctx.fillText(jerry.stage === 0 ? 'HIT ? BLOCKS' : 'BIG! ONE MORE ?', 448, 23);
  } else if (jerry.hasBomb) {
    ctx.fillStyle = hasPower('overdrive') ? '#f9a'
      : hasPower('rapid') ? '#ff8' : '#4af';
    ctx.fillText('[X] BOMB', 448, 23);
  } else {
    ctx.fillStyle = '#567';
    ctx.fillText('[X] ...', 448, 23);
  }

  // run timer - this is what settles a tied score
  if (runStartedAt) {
    const ms = scoreSubmitted ? runDurationMs : Date.now() - runStartedAt;
    ctx.fillStyle = '#9fd';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(fmtTime(ms), 590, 23);
  }

  // level number and name, hard right, clear of the timer
  ctx.textAlign = 'right';
  if (gameState === 'villain') {
    ctx.fillStyle = '#f88';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(level >= FINAL_LEVEL ? 'FINAL BOSS' : 'BOSS ' + level + '/' + FINAL_LEVEL,
                 W - 15, 23);
  } else {
    const d = levelData || levelDef(level);
    ctx.fillStyle = '#8bc';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('LEVEL ' + level + '/' + FINAL_LEVEL, W - 15, 15);
    ctx.fillStyle = '#7a93aa';
    ctx.font = '9px monospace';
    ctx.fillText(d.name, W - 15, 28);
  }
  ctx.textAlign = 'left';

  // combo meter - the bar drains, so you can see how long you have left
  if (combo > 1) {
    const mult = Math.min(8, combo);
    const cx = W / 2 - 54;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(cx, 40, 108, 22);
    ctx.strokeStyle = mult >= 5 ? '#ff8' : '#8f8';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx, 40, 108, 22);
    ctx.fillStyle = mult >= 5 ? '#ff8' : '#8f8';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('COMBO x' + mult, cx + 8, 56);
    // draining timer bar
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(cx, 62, 108 * (comboTimer / 150), 3);
  }

  // second row: unlocked powers, and the boss health when fighting
  if (gameState === 'villain' && villain) {
    const bd = villain.def || bossDef(level);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(bd.name + '  ' + villain.hp + '/' + villain.maxHp, 15, 55);
    ctx.fillStyle = '#a67';
    ctx.font = '10px monospace';
    ctx.fillText(bd.title, 15, 68);
  } else {
    drawPowerStrip(15, 46);
  }

  // shield bubble indicator
  if (hasPower('shield')) {
    const ready = jerry.shield;
    ctx.strokeStyle = ready ? '#6ef' : 'rgba(110,238,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W - 30, 55, 9, 0, Math.PI * 2);
    ctx.stroke();
    if (!ready) {
      ctx.fillStyle = '#456';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(jerry.shieldCd / 60) + 's', W - 30, 58);
      ctx.textAlign = 'left';
    }
  }
}

// Little chips showing which powers are active this run.
function drawPowerStrip(x, y) {
  const order = ['bomb', 'rapid', 'triple', 'doublejump', 'shield', 'pierce', 'blast', 'overdrive'];
  const icons = { bomb: 'B', rapid: 'R', triple: '3', doublejump: '↑↑', shield: 'S', pierce: 'P', blast: '*', overdrive: 'OD' };
  let cx = x;
  ctx.font = 'bold 10px monospace';
  for (const p of order) {
    if (!jerry.powers.has(p)) continue;
    const label = icons[p];
    const w = label.length > 1 ? 24 : 18;
    ctx.fillStyle = 'rgba(74,175,255,0.22)';
    ctx.fillRect(cx, y, w, 15);
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx, y, w, 15);
    ctx.fillStyle = '#cfe9ff';
    ctx.fillText(label, cx + (w - label.length * 6) / 2, y + 11);
    cx += w + 4;
  }
}

function drawMiniDroplet(x, y) {
  ctx.fillStyle = '#4af';
  ctx.beginPath();
  ctx.moveTo(x, y - 6);
  ctx.bezierCurveTo(x + 7, y - 2, x + 7, y + 6, x, y + 8);
  ctx.bezierCurveTo(x - 7, y + 6, x - 7, y - 2, x, y - 6);
  ctx.fill();
}

function drawPopup() {
  // Sits just under the HUD at the top: on a phone the bottom of the screen is
  // where the thumbs and the ground are, so text down there gets missed.
  const pad = 18, lh = 24;
  const boxX = 30, boxW = W - 60;
  const textW = boxW - pad * 2;

  ctx.font = 'bold 18px monospace';
  const lines = wrapLines(popup.text, textW);
  const boxH = pad + 22 + lines.length * lh + pad - 8;
  // clear the HUD, and the extra status line the boss fights add
  const boxY = (gameState === 'boss' || gameState === 'villain') ? 66 : 46;

  // drop shadow so the panel separates from the sky behind it
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(boxX + 4, boxY + 4, boxW, boxH);

  ctx.fillStyle = 'rgba(0,12,28,0.95)';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 3;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('◆ DID YOU KNOW?', boxX + pad, boxY + pad + 6);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  lines.forEach((l, i) => {
    ctx.fillText(l, boxX + pad, boxY + pad + 30 + i * lh);
  });
}

// Splits text into lines that fit maxW. Call with the final font already set.
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line !== '') {
      lines.push(line.trim());
      line = w + ' ';
    } else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function wrapText(text, x, y, maxW, lh) {
  const lines = wrapLines(text, maxW);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
  return lines.length * lh;
}

// 1..8 are the stages, 9 means they reached the Greedy Tycoon.
function levelLabel(n) {
  const v = Number(n) || 1;
  return v > FINAL_LEVEL ? 'Final Boss' : 'Level ' + Math.min(v, FINAL_LEVEL);
}

function drawMenu() {
  // backgrounds are drawn across the whole view, not just the 800-wide UI box,
  // so a wide screen has no dark bars down the sides
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a3a70');
  g.addColorStop(0.5, '#1a7abc');
  g.addColorStop(1, '#4ab0e8');
  ctx.fillStyle = g;
  ctx.fillRect(-VIEW_X - 2, 0, VIEW_W + 4, H);

  // decorative water waves at bottom
  for (let layer = 0; layer < 3; layer++) {
    ctx.fillStyle = `rgba(74,175,255,${0.3 + layer * 0.2})`;
    ctx.beginPath();
    ctx.moveTo(-VIEW_X, H);
    for (let x = -VIEW_X; x <= VIEW_W - VIEW_X; x += 10) {
      const y = H - 60 + layer * 20 + Math.sin((x + Date.now() * 0.001 + layer) * 0.02) * 8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VIEW_W - VIEW_X, H);
    ctx.closePath();
    ctx.fill();
  }

  // title. A thick stroke eats into the letters and makes them look blurred,
  // so keep it thin, round the joins, and stroke before filling.
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  const bob = Math.sin(Date.now() * 0.003) * 3;

  ctx.font = 'bold 54px monospace';
  ctx.strokeStyle = '#0a3a70';
  ctx.lineWidth = 3;
  ctx.strokeText('JERRY', W/2, 90 + bob);
  ctx.fillStyle = '#fff';
  ctx.fillText('JERRY', W/2, 90 + bob);

  ctx.font = 'bold 26px monospace';
  ctx.lineWidth = 2.5;
  ctx.strokeText('THE WATER SAVIOUR', W/2, 130 + bob);
  ctx.fillText('THE WATER SAVIOUR', W/2, 130 + bob);

  ctx.font = 'italic 13px monospace';
  ctx.fillStyle = '#c8e8ff';
  ctx.fillText('~ An educational quest to save our rivers ~', W/2, 158);

  // nudge phone players towards landscape, where the view is much bigger
  if (isTouch && window.innerHeight > window.innerWidth) {
    ctx.fillStyle = '#ff8';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('↻ Rotate your phone sideways for a bigger view', W/2, 178);
  }

  // preview jerry
  const jbob = Math.sin(Date.now() * 0.005) * 6;
  const px = W/2 - 20, py = 190 + jbob;
  ctx.save();
  ctx.fillStyle = '#4a9fff';
  ctx.beginPath();
  ctx.moveTo(px + 20, py);
  ctx.bezierCurveTo(px + 42, py + 12, px + 42, py + 40, px + 20, py + 50);
  ctx.bezierCurveTo(px - 2, py + 40, px - 2, py + 12, px + 20, py);
  ctx.fill();
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + 13, py + 18, 4, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + 13, py + 28, 5, 0, Math.PI*2);
  ctx.arc(px + 27, py + 28, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + 14, py + 29, 2.5, 0, Math.PI*2);
  ctx.arc(px + 28, py + 29, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + 20, py + 38, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  ctx.restore();

  // mission panel
  ctx.fillStyle = 'rgba(0,20,40,0.7)';
  ctx.fillRect(120, 258, W - 240, 148);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 2;
  ctx.strokeRect(120, 258, W - 240, 148);

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('◆ MISSION ◆', W/2, 282);
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  ctx.fillText('Waste is choking our waters. Jump on trash goons,', W/2, 306);
  ctx.fillText('avoid sewage, and hit ? blocks from below:', W/2, 324);
  ctx.fillText('1st makes Jerry BIG, 2nd unlocks WATER BOMBS!', W/2, 342);
  ctx.fillStyle = '#ff8';
  ctx.fillText('FILTER · CHLORINE · UV LIGHT', W/2, 366);
  ctx.fillStyle = '#f88';
  ctx.fillText(FINAL_LEVEL + ' LEVELS - each ending with its own polluter boss!', W/2, 390);

  // Returning player gets their own card, clearly separated from the mission
  // panel rather than crowding up against it.

    const cardY = 418, cardH = 42;
    ctx.fillStyle = 'rgba(0,10,26,0.55)';

    ctx.strokeRect(170, cardY, W - 340, cardH);

    ctx.font = '11px monospace';

  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 17px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP HERE TO START ◀' : '▶ PRESS ENTER TO START ◀', W/2, 482);
  }

}

    'CHLORINATION kills harmful bacteria & pathogens',
    'UV DISINFECTION cleans water without chemicals',
    'INDUSTRIAL WASTE is a major cause of river pollution',
    'GREED harms ecosystems - hold polluters accountable',
    'Every citizen can help protect our water sources',
  ];
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  facts.forEach((f, i) => {
    ctx.fillStyle = '#4af';
    ctx.fillText('◆', W/2 - 240, 230 + i * 25);
    ctx.fillStyle = '#fff';
    ctx.fillText(f, W/2 - 220, 230 + i * 25);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('FINAL SCORE: ' + score, W/2, 392);
  ctx.fillStyle = '#9fd';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('TIME ' + fmtTime(runDurationMs) + '   ·   ties go to the faster run', W/2, 414);

  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 15px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP TO PLAY AGAIN ◀' : '▶ PRESS R TO PLAY AGAIN ◀', W/2, 445);
  }
  ctx.textAlign = 'left';
}

// ============ RESET ============
function fullReset() {
  score = 0; lives = 3;
  level = 1;
  jerry.x = 60; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.powers.clear();          // powers are earned again each run
  jerry.shield = false;
  jerry.shieldCd = 0;
  jerry.jumps = 0;
  setStage(0);   // start small, no bomb - power blocks earn it
  jerry.invuln = 60; jerry.facing = 1;
  camera.x = 0;
  bombs = [];
  particles = [];
  bossActiveEnemies = [];
  popup = null;
  boss = null;
  villain = null;
  villainShots = [];
  screenShake = 0;
  levelBanner = 0;
  powerBanner = null;
  combo = 0; comboTimer = 0; comboBest = 0;
  floatText = [];
  buildLevel(level);
}

// ============ MAIN LOOP ============
function draw() {
  drawSky();
  drawClouds();
  ctx.save();
  // impact shake during the final fight
  const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
  const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
  // On a wide screen the world is drawn shifted right by VIEW_X, so the extra
  // canvas width shows more level instead of empty margin.
  ctx.translate(VIEW_X - camera.x + sx, sy);
  if (gameState === 'playing') {
    drawGround();
    drawHazards();
    drawSigns();
    drawCheckpoints();
    drawBlocks();
    drawGoal();
    drawEnemies();
    drawEnemyShots();
  } else if (gameState === 'villain') {
    drawVillainScene();
  }
  drawJerry();
  drawBombs();
  drawParticles();
  drawFloatText();
  ctx.restore();

  // UI keeps its 800-wide layout, centred in the view
  ctx.save();
  ctx.translate(VIEW_X, 0);
  drawHUD();
  if (popup) drawPopup();
  drawLevelBanner();
  ctx.restore();
}

// Full-screen menus lay their content out in the 800-wide box, centred in the
// view. Each one paints its own background across the full width.
function centred(drawFn) {
  ctx.save();
  ctx.translate(VIEW_X, 0);
  drawFn();
  ctx.restore();
}

function loop() {
  // consume a pending screen tap once per frame
  const tapped = tapConfirm;
  tapConfirm = false;

  // each scene has its own theme; playMusic ignores repeat calls
  // levels rotate through the action themes so the mood darkens as you climb
  // boss fights get the heavy theme; the final one gets the fiercest
  playMusic(
    gameState === 'villain' ? (level >= FINAL_LEVEL ? 'villain' : 'boss')
    : gameState === 'playing' ? (level >= 6 ? 'boss' : level >= 3 ? 'level2' : 'playing')
    : gameState);

  // the menu-only chrome: player switch and the install button
  const onMenu = (gameState === 'menu' || gameState === 'board') && !askingName;
  if (switchBtn) {
    switchBtn.style.display = (gameState === 'menu' && profile.id && !askingName) ? 'block' : 'none';
  }
  if (installBtn && installPrompt) {
    installBtn.style.display = onMenu ? 'block' : 'none';
  }

  if (gameState === 'menu') {
    centred(drawMenu);
    // the dialog owns input while it is open
    if (!askingName && (keys['enter'] || tapped)) {
      keys['enter'] = false;
      if (profile.id) startRun();   // known player - straight in
      else askName();               // first time here - ask who they are
    }
  } else if (gameState === 'board') {
    centred(drawLeaderboard);
    if (!askingName && (keys['enter'] || keys['r'] || tapped)) {
      keys['enter'] = false; keys['r'] = false;
      gameState = 'menu';
    }
  } else if (gameState === 'playing') {
    updatePlaying();
    draw();
  } else if (gameState === 'villain') {
    updateVillain();
    draw();
  } else if (gameState === 'gameover') {
    recordRun();
    draw();
    centred(drawGameOver);
    if (keys['r'] || tapped) { keys['r'] = false; gameState = 'board'; }
  } else if (gameState === 'win') {
    recordRun();
    centred(drawWin);
    if (keys['r'] || tapped) { keys['r'] = false; gameState = 'board'; }
  }
  requestAnimationFrame(loop);
}

// Starts a fresh run for the current player.
function startRun() {
  fullReset();
  levelReached = 1;
  scoreSubmitted = false;
  levelBanner = 150;
  runStartedAt = Date.now();
  runDurationMs = 0;
  gameState = 'playing';
}

// Called every frame on the end screens; only sends once per run.
function recordRun() {
  if (scoreSubmitted) return;
  scoreSubmitted = true;
  runDurationMs = runStartedAt ? Date.now() - runStartedAt : 0;
  submitScore(score, levelReached, runDurationMs);
}

// mm:ss for the HUD and the board
function fmtTime(ms) {
  if (!ms || ms < 0) return '--:--';
  const t = Math.floor(ms / 1000);
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

resetLevel();
loop();
</script>
