<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001830">
<title>Jerry the Water Saviour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(#000, #001830);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 6px;
  }
  h1 { color: #4af; margin-bottom: 6px; font-size: 14px; letter-spacing: 2px; text-align: center; }
  #stage {
    position: relative;
    line-height: 0;
    max-width: 100%;
  }
  /* sound toggle, tucked against the top-right of the play area */
  #sound {
    position: absolute;
    top: 8px; right: -52px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.75);
    border: 2px solid #4af;
    color: #cfe9ff;
    font-size: 19px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    touch-action: manipulation;
    transition: transform .08s, background .12s, border-color .12s;
  }
  #sound:hover { background: rgba(74, 175, 255, 0.35); }
  #sound:active { transform: scale(0.9); }
  #sound.off { border-color: #667; color: #889; background: rgba(30, 30, 40, 0.75); }
  /* on narrow screens there is no room beside the canvas - move it inside */
  @media (max-width: 920px) {
    #sound { right: 8px; top: 44px; width: 38px; height: 38px; font-size: 17px; }
  }

  /* ===== name entry ===== */
  #nameOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 12, 30, 0.88);
    z-index: 30;
    line-height: normal;
  }
  #nameOverlay.show { display: flex; }
  #nameOverlay .panel {
    width: min(86%, 380px);
    background: rgba(6, 26, 50, 0.97);
    border: 3px solid #4af;
    border-radius: 6px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.35);
  }
  #nameOverlay h2 {
    color: #4af; font-size: 15px; letter-spacing: 1px; margin-bottom: 8px;
  }
  #nameOverlay p { color: #8bc; font-size: 11px; margin-bottom: 14px; }
  #nameInput {
    width: 100%;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: #06182e;
    border: 2px solid #2a6fa8;
    border-radius: 4px;
    outline: none;
  }
  #nameInput:focus { border-color: #4af; box-shadow: 0 0 12px rgba(74,175,255,0.5); }
  #nameGo {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #04121f;
    background: #4af;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s, transform .06s;
  }
  #nameGo:hover { background: #6cf; }
  #nameGo:active { transform: scale(0.97); }
  #nameHint { margin-top: 9px; color: #567; font-size: 10px; }

  /* lets a second person on the same device claim their own id */
  #switchPlayer {
    position: absolute;
    left: 8px; top: 8px;
    padding: 5px 9px;
    font-size: 10px;
    color: #9cc;
    background: rgba(10, 30, 55, 0.8);
    border: 1px solid #35678f;
    border-radius: 14px;
    cursor: pointer;
    z-index: 20;
    line-height: normal;
    user-select: none;
  }
  #switchPlayer:hover { color: #fff; border-color: #4af; }
  #switchPlayer:active { transform: scale(0.95); }
  #game {
    display: block;
    width: 100%;
    height: auto;
    border: 3px solid #4af;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.6);
    image-rendering: pixelated;
    background: #6bd6ff;
    touch-action: none;
  }
  #info {
    margin-top: 10px;
    font-size: 12px;
    color: #8bc;
    text-align: center;
    max-width: 800px;
  }
  kbd {
    background: #223;
    border: 1px solid #4af;
    padding: 2px 6px;
    border-radius: 3px;
    color: #4af;
    font-size: 11px;
  }

  /* ===== Touch controls (mobile / tablet) ===== */
  #touch {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  body.touch-mode #touch { display: flex; }
  body.touch-mode #info { display: none; }
  /* keep the play area vertically centred in the space above the buttons */
  body.touch-mode { justify-content: center; padding-bottom: 110px; }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch-mode { padding-bottom: 0; }
  }

  .pad { display: flex; gap: 12px; pointer-events: auto; }
  .btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.55);
    border: 2px solid rgba(74, 175, 255, 0.85);
    color: #cfe9ff;
    font-family: inherit;
    font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    touch-action: none;
    transition: transform .06s, background .06s;
  }
  .btn.small { width: 58px; height: 58px; font-size: 16px; }
  .btn.jump { background: rgba(20, 90, 60, 0.55); border-color: rgba(80, 230, 160, 0.9); color: #d6ffe9; }
  .btn.bomb { background: rgba(15, 60, 110, 0.6); border-color: rgba(120, 200, 255, 0.95); color: #eaf6ff; }
  .btn.active { transform: scale(0.9); background: rgba(74, 175, 255, 0.65); color: #fff; }

  @media (max-width: 900px) {
    h1 { font-size: 12px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    h1 { display: none; }
    .btn { width: 56px; height: 56px; font-size: 20px; }
    .btn.small { width: 50px; height: 50px; font-size: 14px; }
  }
</style>
</head>
<body>
<h1>◆ JERRY THE WATER SAVIOUR ◆</h1>
<div id="stage">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="sound" role="button" tabindex="0" aria-label="Sound on" title="Sound on/off (M)">🔊</div>

  <div id="nameOverlay">
    <div class="panel">
      <h2>◆ ENTER YOUR NAME ◆</h2>
      <p>Your score will appear on the leaderboard</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="PLAYER"
             autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="nameGo">START GAME</button>
      <div id="nameHint">Max 12 characters</div>
    </div>
  </div>

  <div id="switchPlayer" role="button" tabindex="0" title="Play as someone else">👤 Not you?</div>
</div>
<div id="info">
  <kbd>←</kbd> <kbd>→</kbd> move &nbsp;•&nbsp;
  <kbd>SPACE</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> jump &nbsp;•&nbsp;
  <kbd>X</kbd> water bomb &nbsp;•&nbsp;
  <kbd>R</kbd> restart &nbsp;•&nbsp;
  <kbd>M</kbd> mute
</div>

<div id="touch">
  <div class="pad">
    <div class="btn" data-key="arrowleft">◀</div>
    <div class="btn" data-key="arrowright">▶</div>
  </div>
  <div class="pad">
    <div class="btn small bomb" data-key="x">BOMB</div>
    <div class="btn jump" data-key=" ">▲</div>
  </div>
</div>

<script>
// ============ SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ============ TOUCH / RESPONSIVE ============
// maxTouchPoints alone is unreliable (desktop Chrome reports 10), so require a
// coarse/hoverless pointer — that is what actually separates phones from mice.
const isTouch = matchMedia('(pointer: coarse)').matches ||
                matchMedia('(hover: none)').matches;
if (isTouch) document.body.classList.add('touch-mode');

// Scale the canvas to fit the viewport while keeping the 800x500 aspect ratio.
// The game keeps drawing in 800x500 space; CSS just stretches the result.
function fitCanvas() {
  const stage = document.getElementById('stage');
  const title = document.querySelector('h1');
  const info = document.getElementById('info');
  const chrome = (title && title.offsetParent ? title.offsetHeight + 6 : 0) +
                 (info && info.offsetParent ? info.offsetHeight + 10 : 0);
  // In portrait the buttons sit below the game, so reserve their height.
  // In landscape they float over the empty side areas, so reserve nothing.
  const landscape = window.innerWidth > window.innerHeight;
  // Landscape buttons float over the sides, but still keep a small margin so
  // they never sit on top of the HUD/action area at the bottom of the canvas.
  const reserved = isTouch ? (landscape ? 30 : 110) : 24;
  const availW = window.innerWidth - 12;
  const availH = window.innerHeight - chrome - reserved;
  const scale = Math.max(0.2, Math.min(availW / W, availH / H));
  stage.style.width = Math.floor(W * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
fitCanvas();

// On-screen buttons drive the same `keys` map the keyboard uses.
document.querySelectorAll('#touch .btn').forEach(btn => {
  const key = btn.dataset.key;
  const press = e => {
    e.preventDefault();
    keys[key] = true;
    btn.classList.add('active');
  };
  const release = e => {
    e.preventDefault();
    keys[key] = false;
    btn.classList.remove('active');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

// Tap the canvas to start / restart on menu, game over and win screens.
// A tap can begin and end inside a single frame, so latch it and let the
// game loop consume the flag instead of sampling a key that is already up.
let tapConfirm = false;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  tapConfirm = true;
});
// Block double-tap zoom / long-press menus over the play area.
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============ AUDIO ============
// Everything is synthesised with the Web Audio API so the game stays a single
// file with no asset downloads. Browsers block audio until the user interacts,
// so the context is only created on the first tap/keypress.
const audio = {
  ctx: null,
  master: null,
  musicGain: null,
  on: true,
  timer: null,
  step: 0,
  track: null,
};

// Melodies per scene: [semitone offset from A2, ...], null = rest.
const TRACKS = {
  menu:    { bpm: 104, wave: 'triangle', bass: [0, null, 7, null, 5, null, 7, null],
             lead: [12, 16, 19, 16, 17, 16, 12, null, 12, 16, 19, 24, 22, 19, 16, null] },
  playing: { bpm: 132, wave: 'square',   bass: [0, 0, 7, 7, 5, 5, 3, 3],
             lead: [12, 12, 16, 19, 17, 16, 12, 14, 16, 16, 19, 21, 19, 16, 12, null] },
  level2:  { bpm: 142, wave: 'square',   bass: [0, 0, 6, 6, 3, 3, 5, 5],
             lead: [12, 15, 12, 18, 17, 15, 12, null, 10, 12, 15, 17, 15, 12, 10, null] },
  boss:    { bpm: 150, wave: 'sawtooth', bass: [0, 0, 1, 1, 0, 0, 3, 3],
             lead: [12, 13, 12, 8, 12, 15, 12, 8, 13, 12, 8, 6, 8, 12, 13, null] },
  villain: { bpm: 162, wave: 'sawtooth', bass: [0, 1, 0, 1, 3, 4, 3, 1],
             lead: [12, 15, 18, 15, 13, 12, 8, 12, 18, 20, 18, 15, 13, 12, 8, null] },
  win:     { bpm: 118, wave: 'triangle', bass: [0, 0, 5, 5, 7, 7, 0, 0],
             lead: [12, 16, 19, 24, 19, 24, 28, null, 26, 24, 21, 19, 17, 16, 12, null] },
  gameover:{ bpm: 76,  wave: 'triangle', bass: [0, null, -2, null, -4, null, -5, null],
             lead: [12, 10, 8, 7, 5, 3, 0, null] },
};

const midi = n => 110 * Math.pow(2, n / 12);   // A2 = 110Hz

function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.master = audio.ctx.createGain();
  audio.master.gain.value = 0.9;
  audio.master.connect(audio.ctx.destination);
  audio.musicGain = audio.ctx.createGain();
  audio.musicGain.gain.value = audio.on ? 0.16 : 0;
  audio.musicGain.connect(audio.master);
}

// One short synth note.
function tone(freq, dur, when, type, gain, dest) {
  const c = audio.ctx;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
  o.connect(g); g.connect(dest || audio.musicGain);
  o.start(when); o.stop(when + dur + 0.03);
}

// Advances the song one sixteenth-note at a time.
function musicTick() {
  if (!audio.ctx || !audio.track) return;
  const t = TRACKS[audio.track];
  if (!t) return;
  const beat = 60 / t.bpm / 2;          // eighth notes
  const now = audio.ctx.currentTime + 0.05;
  const s = audio.step;

  const b = t.bass[s % t.bass.length];
  if (b !== null && s % 2 === 0) tone(midi(b - 12), beat * 1.7, now, 'triangle', 0.5);

  const l = t.lead[s % t.lead.length];
  if (l !== null) tone(midi(l), beat * 0.85, now, t.wave, 0.22);

  // light hats to keep a pulse on the action tracks
  if (audio.track !== 'gameover' && s % 2 === 1) {
    tone(7000 + Math.random() * 900, 0.02, now, 'square', 0.03);
  }

  audio.step++;
  audio.timer = setTimeout(musicTick, beat * 1000);
}

function playMusic(name) {
  if (audio.track === name) return;
  audio.track = name;
  audio.step = 0;
  if (!audio.ctx) return;
  clearTimeout(audio.timer);
  musicTick();
}

function stopMusic() {
  clearTimeout(audio.timer);
  audio.timer = null;
  audio.track = null;
}

// Short sound effects, mixed above the music.
function sfx(kind) {
  if (!audio.ctx || !audio.on) return;
  const c = audio.ctx, now = c.currentTime;
  if (kind === 'jump') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(300, now);
    o.frequency.exponentialRampToValueAtTime(760, now + 0.11);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.16);
  } else if (kind === 'throw') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(680, now);
    o.frequency.exponentialRampToValueAtTime(200, now + 0.13);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.17);
  } else if (kind === 'hit') {
    // noise burst
    const len = Math.floor(c.sampleRate * 0.16);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = 0.22;
    src.connect(g); g.connect(audio.master);
    src.start(now);
  } else if (kind === 'power') {
    [0, 4, 7, 12].forEach((n, i) =>
      tone(midi(12 + n), 0.14, now + i * 0.07, 'square', 0.16, audio.master));
  } else if (kind === 'hurt') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(420, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.35);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.4);
  } else if (kind === 'boom') {
    const len = Math.floor(c.sampleRate * 0.45);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = c.createGain(); g.gain.value = 0.4;
    src.connect(f); f.connect(g); g.connect(audio.master);
    src.start(now);
  }
}

function setAudioOn(on) {
  audio.on = on;
  if (audio.musicGain) {
    const c = audio.ctx;
    audio.musicGain.gain.cancelScheduledValues(c.currentTime);
    audio.musicGain.gain.linearRampToValueAtTime(on ? 0.16 : 0, c.currentTime + 0.15);
  }
  const btn = document.getElementById('sound');
  if (btn) {
    btn.textContent = on ? '🔊' : '🔇';
    btn.classList.toggle('off', !on);
    btn.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
  }
  try { localStorage.setItem('jerry-sound', on ? '1' : '0'); } catch (e) {}
}

// Audio can only start inside a user gesture.
function unlockAudio() {
  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  if (audio.track && !audio.timer) musicTick();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { passive: true }));

// Sound toggle button. stopPropagation keeps the click off the canvas so it
// cannot double as a "tap to start".
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  e.preventDefault();
  unlockAudio();
  setAudioOn(!audio.on);
});
soundBtn.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.stopPropagation();
    e.preventDefault();
    unlockAudio();
    setAudioOn(!audio.on);
  }
});

// M key toggles sound too
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'm') {
    unlockAudio();
    setAudioOn(!audio.on);
  }
});

// restore the saved preference
try {
  const saved = localStorage.getItem('jerry-sound');
  if (saved !== null) audio.on = saved === '1';
} catch (e) {}
setAudioOn(audio.on);

// ============ PLAYER PROFILE + LEADERBOARD ============
// Talks to the local API (see server.js), which stores everything as CSV in
// ./media. If the server is not running the game still plays; scores are then
// kept in this browser and pushed up the next time the API is reachable.
const API = '/api';

const profile = {
  id: null,
  name: '',
  gamesPlayed: 0,
  bestScore: 0,
  bestLevel: 1,
  rank: null,
  totalPlayers: 0,
  history: [],
  returning: false,      // true when we recognised a saved id
};

const leaderboard = { rows: [], status: 'idle' };  // idle|loading|ok|offline

const ID_KEY = 'jerry-player-id';
const PENDING_KEY = 'jerry-pending-scores';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

async function apiJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function applyProfile(p) {
  profile.id = p.id;
  profile.name = p.name;
  profile.gamesPlayed = p.gamesPlayed || 0;
  profile.bestScore = p.bestScore || 0;
  profile.bestLevel = p.bestLevel || 1;
  profile.rank = p.rank == null ? null : p.rank;
  profile.totalPlayers = p.totalPlayers || 0;
  profile.history = p.history || [];
  playerName = p.name;
}

// Look up the saved id so a returning player is greeted by name.
async function loadSavedPlayer() {
  const id = store.get(ID_KEY);
  if (!id) return false;
  try {
    const p = await apiJson(`${API}/player/${encodeURIComponent(id)}`);
    applyProfile(p);
    profile.returning = true;
    flushPendingScores();
    return true;
  } catch (e) {
    return false;
  }
}

async function registerPlayer(name) {
  const clean = (name || 'PLAYER').trim().toUpperCase().slice(0, 12) || 'PLAYER';
  try {
    const p = await apiJson(`${API}/player`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: clean }),
    });
    applyProfile(p);
    store.set(ID_KEY, p.id);
    profile.returning = false;
    return true;
  } catch (e) {
    // offline: still let them play under this name
    profile.id = store.get(ID_KEY) || 'local_' + Math.random().toString(36).slice(2, 10);
    store.set(ID_KEY, profile.id);
    profile.name = clean;
    playerName = clean;
    return false;
  }
}

// Scores recorded while the server was down, retried later.
function queuePending(entry) {
  let q = [];
  try { q = JSON.parse(store.get(PENDING_KEY) || '[]'); } catch (e) {}
  q.push(entry);
  store.set(PENDING_KEY, JSON.stringify(q.slice(-50)));
}

async function flushPendingScores() {
  let q = [];
  try { q = JSON.parse(store.get(PENDING_KEY) || '[]'); } catch (e) {}
  if (!q.length || !profile.id) return;
  const left = [];
  for (const e of q) {
    try {
      const p = await apiJson(`${API}/score`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: profile.id, score: e.score, level: e.level }),
      });
      applyProfile(p);
    } catch (err) { left.push(e); }
  }
  store.set(PENDING_KEY, JSON.stringify(left));
}

async function submitScore(score, level) {
  const entry = { score, level };
  // optimistic local update so the end screen is correct straight away
  profile.gamesPlayed++;
  if (score > profile.bestScore) profile.bestScore = score;
  if (level > profile.bestLevel) profile.bestLevel = level;
  profile.history.unshift({ score, level, playedAt: new Date().toISOString() });

  if (!profile.id) return;
  try {
    const p = await apiJson(`${API}/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: profile.id, score, level }),
    });
    applyProfile(p);
  } catch (e) {
    queuePending(entry);
  }
  fetchLeaderboard();
}

async function fetchLeaderboard() {
  leaderboard.status = 'loading';
  try {
    const d = await apiJson(`${API}/leaderboard?limit=50`);
    leaderboard.rows = d.rows || [];
    leaderboard.status = 'ok';
  } catch (e) {
    leaderboard.status = 'offline';
  }
}

//   stage 0 (small)  -- hit a power block -> stage 1
//   stage 1 (big)    -- hit another power block -> stage 2

// Applies whatever a given stage means, so every place agrees.
function setStage(n) {
  jerry.stage = Math.max(0, Math.min(2, n));
  jerry.powered = jerry.stage >= 1;
  if (jerry.stage < 2) {
    jerry.hasBomb = false;
    jerry.bombCooldown = 0;
    jerry.rapidBomb = false;
  } else {
    jerry.hasBomb = true;
    jerry.bombCooldown = 0;
  }
}

// ============ HELPERS ============
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function eduText(type) {
  return ({
    filter:   'FILTRATION: Sand & carbon filters trap dirt and solids.',
    chlorine: 'CHLORINATION: Chlorine kills bacteria & viruses. Used in most city water supplies.',
    uv:       'UV DISINFECTION: Ultraviolet light kills germs without chemicals.',
    water:    'Clean water collected! Every drop matters. +50 points',
  })[type];
}

function showPopup(text) { popup = { text, timer: 200 }; }

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 6 - 1,
      color, life: 45, size: 2 + Math.random() * 4
    });
  }
}

function damagePlayer() {
  if (jerry.invuln > 0) return;
  // In the boss arenas bombs are the only weapon, so losing them would make the
  // fight unwinnable - take a life instead of dropping a stage.
  const inBossFight = gameState === 'boss' || gameState === 'villain';
  if (jerry.stage > 0 && !inBossFight) {
    // drop one stage: armed -> big -> small, only then lose a life
    setStage(jerry.stage - 1);
    jerry.invuln = 90;
    spawnParticles(jerry.x + 14, jerry.y + 18, '#fff', 12);
    sfx('hurt');
  } else {
    lives--;
    sfx('hurt');
    if (lives <= 0) { gameState = 'gameover'; return; }
    respawnPlayer();
  }
}

function respawnPlayer() {
  if (gameState === 'boss') {
    jerry.x = 80; jerry.y = 300;
  } else if (gameState === 'villain') {
    // respawn on the far side from the villain so he can't camp the spawn
    jerry.x = villain && villain.x < W / 2 ? W - 110 : 70;
    jerry.y = 280;
    villainShots = [];
  } else {
    jerry.x = Math.max(100, jerry.x - 200);
    jerry.y = 200;
  }
  jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
}

// ============ UPDATE ============
function updatePlaying() {
  // input
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if ((keys[' '] || keys['w'] || keys['arrowup']) && jerry.onGround) {
    jerry.vy = JUMP_POWER;
    jerry.onGround = false;
    sfx('jump');
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    // Nearly flat throw: a high arc sailed over enemies at close range.
    bombs.push({
      x: jerry.x + jerry.w / 2, y: jerry.y + jerry.h / 2,
      vx: jerry.facing * 9, vy: -1.5, r: 8
    });
    jerry.hasBomb = false;
    jerry.bombCooldown = jerry.rapidBomb ? BOMB_COOLDOWN / 3 : BOMB_COOLDOWN;
    sfx('throw');
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;

  // recharge the bomb instead of running out
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  // physics
  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx;
  jerry.y += jerry.vy;
  jerry.onGround = false;

  // platform collision
  const allSolids = platforms.concat(blocks.filter(b => true));
  for (const p of allSolids) {
    if (rectHit(jerry, p)) {
      const prevX = jerry.x - jerry.vx;
      const prevY = jerry.y - jerry.vy;
      // top
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h;
        jerry.vy = 0;
        jerry.onGround = true;
      }
      // bottom (hit head)
      else if (prevY >= p.y + p.h - 1) {
        jerry.y = p.y + p.h;
        jerry.vy = 1;
        // trigger mystery block
        if (!p.hit && p.type) {
          p.hit = true;
          triggerBlock(p);
        }
      }
      // sides
      else if (prevX + jerry.w <= p.x + 1) {
        jerry.x = p.x - jerry.w;
      } else if (prevX >= p.x + p.w - 1) {
        jerry.x = p.x + p.w;
      }
    }
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'trash') {
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
    }
    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      if (jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 8 && e.type === 'trash') {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        score += 100;
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#8b6f47', 10);
      } else {
        damagePlayer();
      }
    }
  }

  // hazards - sewage
  for (const h of hazards) {
    if (jerry.y + jerry.h > h.y + 8 &&
        jerry.x + jerry.w > h.x + 5 && jerry.x < h.x + h.w - 5) {
      damagePlayer();
      break;
    }
  }

  // fall off
  if (jerry.y > H + 50) damagePlayer();

  // sign popups
  for (const s of signs) {
    if (s.shown) continue;
    if (Math.abs((jerry.x + jerry.w/2) - (s.x + 20)) < 40) {
      s.shown = true;
      showPopup(s.text);
    }
  }

  // bombs
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > LEVEL_END + 50) b.dead = true;
    // hit enemies — test the bomb's radius, not just its centre point
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, e)) {
        e.alive = false;
        b.dead = true;
        score += 100;
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#4af', 15);
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  // particles
  for (const p of particles) {
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // camera
  camera.x = Math.max(0, Math.min(LEVEL_END - W, jerry.x - 300));

  // goal reached
  if (jerry.x + jerry.w > goal.x + 10) startBoss();

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

function triggerBlock(b) {
  spawnParticles(b.x + 20, b.y, '#4af', 12);
  sfx(b.type === 'filter' || b.type === 'uv' ? 'power' : 'hit');

  // filter and UV are the power blocks: each one moves Jerry up a stage
  if (b.type === 'filter' || b.type === 'uv') {
    score += 200;
    if (jerry.stage >= 2) {
      // already armed - a further power block upgrades to rapid fire
      const wasRapid = jerry.rapidBomb;
      setStage(2);
      jerry.rapidBomb = true;
      spawnParticles(b.x + 20, b.y - 10, '#ff8', 14);
      showPopup(eduText(b.type) +
        (wasRapid ? ' Bomb recharged!' : ' RAPID BOMBS unlocked!'));
    } else {
      setStage(jerry.stage + 1);
      spawnParticles(b.x + 20, b.y - 10, jerry.stage === 2 ? '#ff8' : '#fff', 18);
      showPopup(jerry.stage === 1
        ? eduText(b.type) + ' Jerry GREW BIGGER! Hit another power block for water bombs.'
        : eduText(b.type) + ' WATER BOMBS unlocked - press [X] to throw!');
    }
    return;
  }

  showPopup(eduText(b.type));
  if (b.type === 'chlorine') { lives++; score += 200; }
  else if (b.type === 'water') { score += 50; }
}

// ============ BOSS ============
function startBoss() {
  gameState = 'boss';
  levelReached = Math.max(levelReached, 2);   // cleared level 1
  jerry.x = 80; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  camera.x = 0;
  bombs = [];
  bossActiveEnemies = [];
  // the fight is unwinnable without bombs, so arm Jerry on entry
  setStage(2);
  boss = {
    body: { x: 430, y: 350, w: 320, h: 90 },
    stacks: [
      { x: 470, y: 240, w: 55, h: 200, hp: 2, alive: true, id: 'A' },
      { x: 570, y: 210, w: 55, h: 230, hp: 2, alive: true, id: 'B' },
      { x: 670, y: 190, w: 55, h: 250, hp: 2, alive: true, id: 'C' },
    ],
    smokeTimer: 0,
  };
  showPopup('BOSS: The Polluting Factory! Throw water bombs [X] at each smokestack!');
}

function updateBoss() {
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if ((keys[' '] || keys['w'] || keys['arrowup']) && jerry.onGround) {
    jerry.vy = JUMP_POWER;
    jerry.onGround = false;
    sfx('jump');
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    bombs.push({
      x: jerry.x + jerry.w / 2, y: jerry.y + jerry.h / 2,
      vx: jerry.facing * 9, vy: -4, r: 9
    });
    jerry._xheld = true;
    jerry.hasBomb = false;
    jerry.bombCooldown = jerry.rapidBomb ? BOMB_COOLDOWN / 3 : BOMB_COOLDOWN;
    sfx('throw');
  }
  if (!keys['x']) jerry._xheld = false;

  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx; jerry.y += jerry.vy;
  jerry.onGround = false;

  // simple ground
  if (jerry.y + jerry.h >= GROUND_Y) {
    jerry.y = GROUND_Y - jerry.h;
    jerry.vy = 0;
    jerry.onGround = true;
  }
  if (jerry.x < 0) jerry.x = 0;
  if (jerry.x + jerry.w > W) jerry.x = W - jerry.w;

  // factory spawns smoke enemies
  boss.smokeTimer++;
  if (boss.smokeTimer > 80) {
    boss.smokeTimer = 0;
    const alive = boss.stacks.filter(s => s.alive);
    if (alive.length > 0) {
      const s = alive[Math.floor(Math.random() * alive.length)];
      bossActiveEnemies.push({
        x: s.x + s.w/2 - 10, y: s.y - 10,
        w: 20, h: 20,
        vx: (Math.random() - 0.5) * 4,
        vy: -4,
        life: 240, alive: true
      });
    }
  }

  // smoke enemies
  for (const e of bossActiveEnemies) {
    if (!e.alive) continue;
    e.vy += 0.15;
    e.x += e.vx; e.y += e.vy;
    e.life--;
    if (e.life <= 0 || e.y > H) e.alive = false;
    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      damagePlayer();
      e.alive = false;
    }
  }
  bossActiveEnemies = bossActiveEnemies.filter(e => e.alive);

  // bombs vs stacks
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > W + 50) b.dead = true;
    for (const s of boss.stacks) {
      if (!s.alive) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, s)) {
        s.hp--;
        b.dead = true;
        sfx('hit');
        spawnParticles(b.x, b.y, '#4af', 15);
        if (s.hp <= 0) {
          sfx('boom');
          s.alive = false;
          score += 500;
          spawnParticles(s.x + s.w/2, s.y + 30, '#ff8800', 30);
          spawnParticles(s.x + s.w/2, s.y + 30, '#fff', 20);
        }
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  // particles
  for (const p of particles) {
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // factory destroyed -> the man behind it shows up
  if (boss.stacks.every(s => !s.alive)) {
    startLevel2();
  }

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

  { x: 520,  y: GROUND_Y, w: 120, h: 60 },
  { x: 1060, y: GROUND_Y, w: 120, h: 60 },

    { x: 2400, y: GROUND_Y - 34, w: 34, h: 34, vx: -2.2, type: 'barrel', alive: true, minX: 2170, maxX: 2600 },

    { x: 1350, y: 200, w: 32, h: 26, vx: -1.6, type: 'drone', alive: true, minX: 1200, maxX: 1540, baseY: 200, phase: 1.5 },

function updateLevel2() {
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if ((keys[' '] || keys['w'] || keys['arrowup']) && jerry.onGround) {
    jerry.vy = JUMP_POWER;
    jerry.onGround = false;
    sfx('jump');
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    bombs.push({
      x: jerry.x + jerry.w / 2, y: jerry.y + jerry.h / 2,
      vx: jerry.facing * 9, vy: -1.5, r: 8
    });
    jerry.hasBomb = false;
    jerry.bombCooldown = jerry.rapidBomb ? BOMB_COOLDOWN / 3 : BOMB_COOLDOWN;
    sfx('throw');
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx;
  jerry.y += jerry.vy;
  jerry.onGround = false;
  if (jerry.x < 0) jerry.x = 0;

  for (const p of l2Platforms.concat(blocks)) {
    if (rectHit(jerry, p)) {
      const prevX = jerry.x - jerry.vx;
      const prevY = jerry.y - jerry.vy;
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h; jerry.vy = 0; jerry.onGround = true;
      } else if (prevY >= p.y + p.h - 1) {
        jerry.y = p.y + p.h; jerry.vy = 1;
        if (!p.hit && p.type) { p.hit = true; triggerBlock(p); }
      } else if (prevX + jerry.w <= p.x + 1) {
        jerry.x = p.x - jerry.w;
      } else if (prevX >= p.x + p.w - 1) {
        jerry.x = p.x + p.w;
      }
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
    if (e.type === 'drone') {
      e.phase += 0.04;
      e.y = e.baseY + Math.sin(e.phase) * 26;
    }
    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      // barrels can be stomped; drones fly too fast and must be bombed
      if (e.type === 'barrel' && jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 10) {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        score += 150;
        sfx('hit');
        spawnParticles(e.x + 17, e.y + 17, '#c04040', 12);
      } else {
        damagePlayer();
      }
    }
  }

  for (const h of l2Hazards) {
    if (jerry.y + jerry.h > h.y + 8 &&
        jerry.x + jerry.w > h.x + 5 && jerry.x < h.x + h.w - 5) {
      damagePlayer();
      break;
    }
  }

  if (jerry.y > H + 50) damagePlayer();

  for (const s of signs) {
    if (s.shown) continue;
    if (Math.abs((jerry.x + jerry.w/2) - (s.x + 20)) < 40) {
      s.shown = true;
      showPopup(s.text);
    }
  }

  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > L2_END + 50) b.dead = true;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, e)) {
        e.alive = false;
        b.dead = true;
        score += 150;
        sfx('hit');
        spawnParticles(e.x + 16, e.y + 13, '#4af', 15);
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of particles) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);

  camera.x = Math.max(0, Math.min(L2_END - W, jerry.x - 300));

  if (jerry.x + jerry.w > l2Goal.x + 10) startVillain();

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// ============ FINAL BOSS: THE GREEDY TYCOON ============
// He walks, jumps, throws money-bags and toxic waste, and calls in drones.
// Jerry has to dodge and land 6 bombs while staying alive.
function startVillain() {
  gameState = 'villain';
  levelReached = Math.max(levelReached, 4);   // reached the final boss
  jerry.x = 70; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
  // bombs are the only way to hurt him, so make sure Jerry has them
  setStage(2);
  camera.x = 0;
  bombs = [];
  villainShots = [];
  bossActiveEnemies = [];
  particles = [];

  villain = {
    x: 600, y: GROUND_Y - 96, w: 54, h: 96,
    vx: -1.9, vy: 0, onGround: true,
    hp: 6, maxHp: 6,
    hurt: 0,          // flash timer after taking a hit
    attackTimer: 90,  // frames until next attack
    phase: 1,         // gets more aggressive as hp drops
    facing: -1,
  };
  showPopup('FINAL BOSS: The Greedy Tycoon! He fights back — dodge his attacks and land 6 water bombs!');
}

function updateVillain() {
  // ---- player ----
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if ((keys[' '] || keys['w'] || keys['arrowup']) && jerry.onGround) {
    jerry.vy = JUMP_POWER;
    jerry.onGround = false;
    sfx('jump');
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    bombs.push({
      x: jerry.x + jerry.w / 2, y: jerry.y + jerry.h / 2,
      vx: jerry.facing * 9, vy: -2, r: 9
    });
    jerry.hasBomb = false;
    jerry.bombCooldown = jerry.rapidBomb ? BOMB_COOLDOWN / 3 : BOMB_COOLDOWN;
    sfx('throw');
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx; jerry.y += jerry.vy;
  jerry.onGround = false;

  // arena platforms let Jerry get height to dodge
  const arena = [
    { x: 0, y: GROUND_Y, w: W, h: 60 },
    { x: 120, y: 330, w: 110, h: 16 },
    { x: 570, y: 330, w: 110, h: 16 },
    { x: 345, y: 240, w: 110, h: 16 },
  ];
  for (const p of arena) {
    if (rectHit(jerry, p)) {
      const prevY = jerry.y - jerry.vy;
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h; jerry.vy = 0; jerry.onGround = true;
      }
    }
  }
  if (jerry.x < 0) jerry.x = 0;
  if (jerry.x + jerry.w > W) jerry.x = W - jerry.w;

  // ---- villain AI ----
  const v = villain;
  v.phase = v.hp <= 2 ? 3 : (v.hp <= 4 ? 2 : 1);

  // pace back and forth, turning at the arena edges
  v.x += v.vx;
  if (v.x < 40) { v.x = 40; v.vx = Math.abs(v.vx); }
  if (v.x + v.w > W - 40) { v.x = W - 40 - v.w; v.vx = -Math.abs(v.vx); }
  v.facing = Math.sign(v.vx) || -1;

  // gravity for his jumps
  v.vy += GRAVITY;
  v.y += v.vy;
  if (v.y + v.h >= GROUND_Y) { v.y = GROUND_Y - v.h; v.vy = 0; v.onGround = true; }

  if (v.hurt > 0) v.hurt--;

  // attacks get faster in later phases
  v.attackTimer--;
  if (v.attackTimer <= 0) {
    const gap = [110, 80, 55][v.phase - 1];
    v.attackTimer = gap + Math.floor(Math.random() * 30);

    const roll = Math.random();
    if (roll < 0.45) {
      // hurl a money bag on a lobbing arc towards Jerry
      const dir = Math.sign((jerry.x + jerry.w/2) - (v.x + v.w/2)) || -1;
      villainShots.push({
        x: v.x + v.w/2, y: v.y + 20,
        vx: dir * (3.2 + v.phase * 0.5), vy: -5,
        r: 12, kind: 'money', spin: 0
      });
    } else if (roll < 0.8) {
      // splash of toxic waste: a spread of falling blobs
      const n = 2 + v.phase;
      for (let i = 0; i < n; i++) {
        villainShots.push({
          x: v.x + v.w/2, y: v.y + 10,
          vx: (i - (n - 1) / 2) * 1.9,
          vy: -6.5,
          r: 9, kind: 'toxic', spin: 0
        });
      }
    } else {
      // leap towards Jerry
      if (v.onGround) {
        v.vy = -11;
        v.onGround = false;
        v.vx = (Math.sign((jerry.x + jerry.w/2) - (v.x + v.w/2)) || -1) * (2.2 + v.phase * 0.4);
      }
    }
  }

  // body contact hurts
  if (jerry.invuln <= 0 && rectHit(jerry, v)) damagePlayer();

  // ---- villain projectiles ----
  for (const s of villainShots) {
    s.vy += GRAVITY * 0.55;
    s.x += s.vx; s.y += s.vy;
    s.spin += 0.2;
    if (s.y - s.r > H || s.x < -60 || s.x > W + 60) s.dead = true;
    // bounce money bags once off the floor so they stay dangerous
    if (s.kind === 'money' && s.y + s.r >= GROUND_Y && s.vy > 0) {
      if (!s.bounced) { s.vy = -5.5; s.bounced = true; }
      else s.dead = true;
    }
    if (!s.dead && jerry.invuln <= 0 &&
        rectHit({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, jerry)) {
      s.dead = true;
      damagePlayer();
    }
  }
  villainShots = villainShots.filter(s => !s.dead);

  // ---- Jerry's bombs vs the villain ----
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > W + 50) b.dead = true;
    if (!b.dead && v.hurt <= 0 &&
        rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r*2, h: b.r*2 }, v)) {
      b.dead = true;
      v.hp--;
      v.hurt = 30;
      screenShake = 12;
      score += 400;
      sfx('boom');
      spawnParticles(b.x, b.y, '#4af', 18);
      spawnParticles(v.x + v.w/2, v.y + 30, '#fff', 12);
      // knock him back a little
      v.vx = Math.sign(v.x - jerry.x) * Math.abs(v.vx) || v.vx;
      if (v.hp <= 0) {
        spawnParticles(v.x + v.w/2, v.y + v.h/2, '#ff8800', 40);
        spawnParticles(v.x + v.w/2, v.y + v.h/2, '#fff', 30);
        score += 1500;
        gameState = 'win';
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of particles) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);

  if (screenShake > 0) screenShake--;
  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// ============ RENDER ============
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (gameState === 'boss') {
    g.addColorStop(0, '#4a2540');
    g.addColorStop(0.5, '#8b4a3a');
    g.addColorStop(1, '#c47a4a');
  } else if (gameState === 'villain') {
    // stormy showdown sky
    g.addColorStop(0, '#1a1030');
    g.addColorStop(0.55, '#4a2a50');
    g.addColorStop(1, '#8a4a5a');
  } else if (gameState === 'level2') {
    // polluted haze
    g.addColorStop(0, '#7a86a8');
    g.addColorStop(0.6, '#b9a48c');
    g.addColorStop(1, '#d8c4a0');
  } else {
    g.addColorStop(0, '#6bd6ff');
    g.addColorStop(1, '#c9f2ff');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  const dark = gameState === 'boss' || gameState === 'villain';
  ctx.fillStyle = dark ? 'rgba(80,40,30,0.6)'
    : gameState === 'level2' ? 'rgba(120,110,100,0.55)'
    : 'rgba(255,255,255,0.75)';
  const off = (camera.x * 0.3) % 240;
  for (let i = -1; i < 6; i++) {
    const cx = i * 240 - off + 40;
    const cy = 70 + (i % 2) * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.arc(cx + 25, cy - 8, 26, 0, Math.PI*2);
    ctx.arc(cx + 55, cy, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawGround(list) {
  // level 2 ground is scorched rather than green
  const dead = gameState === 'level2';
  for (const p of (list || platforms)) {
    if (p.kind === 'ground') {
      ctx.fillStyle = dead ? '#6b6a45' : '#5a8c3a';
      ctx.fillRect(p.x, p.y, p.w, 10);
      ctx.fillStyle = dead ? '#8a8558' : '#7cb85a';
      for (let i = 0; i < p.w; i += 12) {
        ctx.fillRect(p.x + i, p.y - 3, 8, 5);
      }
      ctx.fillStyle = '#6b3d1a';
      ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
      ctx.fillStyle = '#553015';
      for (let i = 0; i < p.w; i += 30) {
        ctx.fillRect(p.x + i, p.y + 18, 3, 18);
        ctx.fillRect(p.x + i + 15, p.y + 32, 3, 15);
      }
    } else {
      // brick
      ctx.fillStyle = '#a86f3a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#6b3d1a';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      for (let i = 20; i < p.w; i += 20) {
        ctx.beginPath();
        ctx.moveTo(p.x + i, p.y);
        ctx.lineTo(p.x + i, p.y + p.h);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + p.h/2);
      ctx.lineTo(p.x + p.w, p.y + p.h/2);
      ctx.stroke();
    }
  }
}

function drawHazards(list) {
  for (const h of (list || hazards)) {
    ctx.fillStyle = '#4a3a1a';
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = '#3a2a0a';
    ctx.fillRect(h.x, h.y, h.w, 4);
    // bubbles
    for (let i = 0; i < 5; i++) {
      const t = Date.now() * 0.002 + i * 0.7;
      ctx.fillStyle = 'rgba(120,90,40,0.7)';
      ctx.beginPath();
      ctx.arc(h.x + 12 + i * 18, h.y + 25 + Math.sin(t) * 4, 3 + Math.sin(t)*1, 0, Math.PI*2);
      ctx.fill();
    }
    // toxic label
    ctx.fillStyle = 'rgba(255,255,0,0.8)';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('☠ SEWAGE', h.x + 15, h.y + 55);
  }
}

function drawSigns() {
  for (const s of signs) {
    ctx.fillStyle = '#6b4520';
    ctx.fillRect(s.x + 17, s.y + 40, 6, 20);
    ctx.fillStyle = '#d4a86a';
    ctx.fillRect(s.x, s.y, 40, 40);
    ctx.strokeStyle = '#5a3d1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(s.x, s.y, 40, 40);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('!', s.x + 14, s.y + 30);
  }
}

function drawBlocks() {
  for (const b of blocks) {
    if (b.hit) {
      ctx.fillStyle = '#6b4520';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#3a2510';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else {
      const pulse = Math.sin(Date.now() * 0.006) * 0.15 + 1;
      ctx.fillStyle = '#e8a83a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#c88a1a';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3);
      ctx.fillRect(b.x + 3, b.y + b.h - 6, b.w - 6, 3);
      ctx.fillRect(b.x + 3, b.y + 3, 3, b.h - 6);
      ctx.fillRect(b.x + b.w - 6, b.y + 3, 3, b.h - 6);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.floor(24*pulse)}px monospace`;
      ctx.fillText('?', b.x + 12, b.y + 30);
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'trash') {
      // trash bag body
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(e.x + 15, e.y + 20, 15, 12, 0, 0, Math.PI*2);
      ctx.fill();
      // tied top
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(e.x + 8, e.y + 10);
      ctx.lineTo(e.x + 15, e.y);
      ctx.lineTo(e.x + 22, e.y + 10);
      ctx.closePath();
      ctx.fill();
      // menace face
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 7, e.y + 16, 5, 5);
      ctx.fillRect(e.x + 18, e.y + 16, 5, 5);
      ctx.fillStyle = '#a00';
      const eyeShift = e.vx > 0 ? 2 : 0;
      ctx.fillRect(e.x + 8 + eyeShift, e.y + 17, 3, 3);
      ctx.fillRect(e.x + 19 + eyeShift, e.y + 17, 3, 3);
      // little arms
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - 2, e.y + 22, 5, 3);
      ctx.fillRect(e.x + 27, e.y + 22, 5, 3);
    } else if (e.type === 'drum') {
      ctx.fillStyle = '#c04040';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#600';
      ctx.fillRect(e.x, e.y + 6, e.w, 4);
      ctx.fillRect(e.x, e.y + e.h - 10, e.w, 4);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('☠', e.x + 12, e.y + 27);
      // drip
      ctx.fillStyle = '#4a2a0a';
      ctx.fillRect(e.x + 5, e.y + e.h - 2, 6, 4);
    } else if (e.type === 'barrel') {
      // rolling toxic barrel
      const cx = e.x + e.w/2, cy = e.y + e.h/2, r = e.w/2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((e.x * 0.06) * (e.vx > 0 ? 1 : -1));
      ctx.fillStyle = '#a83a2a';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5a1a10'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#701f14';
      ctx.beginPath();
      ctx.moveTo(-r, -r*0.35); ctx.lineTo(r, -r*0.35);
      ctx.moveTo(-r, r*0.35);  ctx.lineTo(r, r*0.35);
      ctx.stroke();
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('☠', -5, 5);
      ctx.restore();
      // leaking sludge
      ctx.fillStyle = 'rgba(90,120,30,0.75)';
      ctx.fillRect(e.x + 8, e.y + e.h - 2, 8, 4);
    } else if (e.type === 'drone') {
      const cx = e.x + e.w/2;
      // rotors
      ctx.strokeStyle = '#889';
      ctx.lineWidth = 2;
      const blur = Math.sin(Date.now() * 0.05) * 6;
      ctx.beginPath();
      ctx.moveTo(e.x - 4 + blur, e.y); ctx.lineTo(e.x + 12 - blur, e.y);
      ctx.moveTo(e.x + e.w - 12 + blur, e.y); ctx.lineTo(e.x + e.w + 4 - blur, e.y);
      ctx.stroke();
      ctx.fillStyle = '#667';
      ctx.fillRect(e.x + 3, e.y + 2, 5, 5);
      ctx.fillRect(e.x + e.w - 8, e.y + 2, 5, 5);
      // body
      ctx.fillStyle = '#4a4a58';
      ctx.fillRect(e.x, e.y + 6, e.w, e.h - 6);
      ctx.strokeStyle = '#22222c';
      ctx.strokeRect(e.x, e.y + 6, e.w, e.h - 6);
      // angry red eye scanning
      ctx.fillStyle = '#f33';
      const ex = cx + (e.vx > 0 ? 4 : -4);
      ctx.beginPath(); ctx.arc(ex, e.y + 14, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,60,60,0.35)';
      ctx.beginPath(); ctx.arc(ex, e.y + 14, 7, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawVillain() {
  const v = villain;
  // flash white when he has just been hit
  const flash = v.hurt > 0 && Math.floor(Date.now() / 60) % 2 === 0;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(v.x + v.w/2, GROUND_Y + 3, v.w/2, 5, 0, 0, Math.PI*2);
  ctx.fill();

  const skin = flash ? '#fff' : '#e8b98a';
  const suit = flash ? '#fff' : '#2a2a3a';

  // legs
  ctx.fillStyle = suit;
  ctx.fillRect(v.x + 10, v.y + 62, 14, 34);
  ctx.fillRect(v.x + v.w - 24, v.y + 62, 14, 34);
  // shoes
  ctx.fillStyle = flash ? '#fff' : '#111';
  ctx.fillRect(v.x + 6, v.y + v.h - 8, 20, 8);
  ctx.fillRect(v.x + v.w - 26, v.y + v.h - 8, 20, 8);

  // fat greedy body in a business suit
  ctx.fillStyle = suit;
  ctx.fillRect(v.x, v.y + 26, v.w, 40);
  // open jacket + white shirt
  ctx.fillStyle = flash ? '#fff' : '#f0f0f0';
  ctx.fillRect(v.x + v.w/2 - 9, v.y + 28, 18, 34);
  // tie
  ctx.fillStyle = flash ? '#fff' : '#c0392b';
  ctx.beginPath();
  ctx.moveTo(v.x + v.w/2, v.y + 28);
  ctx.lineTo(v.x + v.w/2 - 5, v.y + 36);
  ctx.lineTo(v.x + v.w/2, v.y + 58);
  ctx.lineTo(v.x + v.w/2 + 5, v.y + 36);
  ctx.closePath(); ctx.fill();

  // arms
  ctx.fillStyle = suit;
  ctx.fillRect(v.x - 6, v.y + 30, 10, 26);
  ctx.fillRect(v.x + v.w - 4, v.y + 30, 10, 26);
  ctx.fillStyle = skin;
  ctx.fillRect(v.x - 6, v.y + 54, 10, 8);
  ctx.fillRect(v.x + v.w - 4, v.y + 54, 10, 8);

  // head
  ctx.fillStyle = skin;
  ctx.fillRect(v.x + 12, v.y + 2, v.w - 24, 26);
  // top hat — classic tycoon
  ctx.fillStyle = flash ? '#fff' : '#15151f';
  ctx.fillRect(v.x + 6, v.y - 2, v.w - 12, 5);
  ctx.fillRect(v.x + 13, v.y - 18, v.w - 26, 17);
  ctx.fillStyle = flash ? '#ccc' : '#c0392b';
  ctx.fillRect(v.x + 13, v.y - 7, v.w - 26, 4);

  // angry eyes follow Jerry
  const look = v.facing > 0 ? 2 : -2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(v.x + 17, v.y + 10, 8, 7);
  ctx.fillRect(v.x + v.w - 25, v.y + 10, 8, 7);
  ctx.fillStyle = '#000';
  ctx.fillRect(v.x + 19 + look, v.y + 12, 4, 4);
  ctx.fillRect(v.x + v.w - 23 + look, v.y + 12, 4, 4);
  // furious brows
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(v.x + 16, v.y + 7); ctx.lineTo(v.x + 26, v.y + 11);
  ctx.moveTo(v.x + v.w - 16, v.y + 7); ctx.lineTo(v.x + v.w - 26, v.y + 11);
  ctx.stroke();
  // grimace
  ctx.beginPath();
  ctx.moveTo(v.x + 20, v.y + 24); ctx.lineTo(v.x + v.w - 20, v.y + 24);
  ctx.stroke();
  // cigar
  ctx.fillStyle = flash ? '#fff' : '#6b3d1a';
  ctx.fillRect(v.x + v.w - 18, v.y + 21, 12, 4);
  ctx.fillStyle = '#f80';
  ctx.fillRect(v.x + v.w - 7, v.y + 21, 3, 4);

  // health bar above him
  const bw = 90, bx = v.x + v.w/2 - bw/2, by = v.y - 32;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
  ctx.fillStyle = '#500';
  ctx.fillRect(bx, by, bw, 8);
  ctx.fillStyle = v.hp > 4 ? '#3d3' : v.hp > 2 ? '#fd3' : '#f44';
  ctx.fillRect(bx, by, bw * (v.hp / v.maxHp), 8);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, 8);
}

function drawJerry() {
  const j = jerry;
  if (j.invuln > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

  const scale = j.powered ? 1.25 : 1;
  const dw = j.w * scale, dh = j.h * scale;
  const px = j.x + (j.w - dw) / 2;
  const py = j.y + (j.h - dh);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px + dw/2, py + dh + 3, dw/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // droplet body
  ctx.fillStyle = j.powered ? '#3ac0ff' : '#4a9fff';
  ctx.beginPath();
  ctx.moveTo(px + dw/2, py);
  ctx.bezierCurveTo(px + dw*1.05, py + dh*0.3, px + dw*1.05, py + dh*0.9, px + dw/2, py + dh);
  ctx.bezierCurveTo(px - dw*0.05, py + dh*0.9, px - dw*0.05, py + dh*0.3, px + dw/2, py);
  ctx.fill();

  // outline
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();

  // highlight
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + dw*0.32, py + dh*0.38, dw*0.11, dh*0.16, 0, 0, Math.PI*2);
  ctx.fill();

  // eyes
  const eyeY = py + dh * 0.55;
  const eyeShift = j.facing > 0 ? 1 : -1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + dw*0.35, eyeY, 5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65, eyeY, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + dw*0.35 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.fill();

  // smile
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + dw/2, py + dh*0.75, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // powered aura
  if (j.powered) {
    ctx.strokeStyle = `rgba(255,255,100,${0.4 + Math.sin(Date.now()*0.015)*0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + dw/2, py + dh/2, dw*0.75, 0, Math.PI*2);
    ctx.stroke();
  }

  // bomb indicator
  if (j.hasBomb) {
    const bx = px + dw + 6, by = py + 4;
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(bx, by, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('X', bx - 3, by + 3);
  }
}

function drawBombs() {

  ctx.fillRect(b.x, b.y, b.w, b.h);

  ctx.fillRect(b.x, b.y, b.w, 10);
  ctx.strokeStyle = '#303030';

  ctx.strokeRect(b.x, b.y, b.w, b.h);
  // windows
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = '#ff9';
    ctx.fillRect(b.x + 15 + i * 50, b.y + 25, 22, 22);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(b.x + 15 + i * 50, b.y + 25, 22, 22);
    ctx.beginPath();
    ctx.moveTo(b.x + 26 + i * 50, b.y + 25);
    ctx.lineTo(b.x + 26 + i * 50, b.y + 47);
    ctx.moveTo(b.x + 15 + i * 50, b.y + 36);
    ctx.lineTo(b.x + 37 + i * 50, b.y + 36);
    ctx.stroke();
  }
  // door
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(b.x + b.w/2 - 18, b.y + 55, 36, 35);
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('MEGA-POLLUTE INC.', b.x + 90, b.y - 5);

  // smokestacks
  for (const s of boss.stacks) {
    if (!s.alive) {
      // rubble
      ctx.fillStyle = '#404040';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y + s.h);
      ctx.lineTo(s.x + 10, s.y + s.h - 25);
      ctx.lineTo(s.x + s.w/2, s.y + s.h - 15);
      ctx.lineTo(s.x + s.w - 10, s.y + s.h - 30);
      ctx.lineTo(s.x + s.w, s.y + s.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#202020';
      ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#505050';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = '#303030';
    ctx.strokeRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#303030';
    ctx.fillRect(s.x - 3, s.y, s.w + 6, 10);
    ctx.fillRect(s.x, s.y + 20, s.w, 3);
    // hp bar
    ctx.fillStyle = '#000';
    ctx.fillRect(s.x + 8, s.y + s.h/2 - 3, s.w - 16, 10);
    ctx.fillStyle = s.hp === 2 ? '#0f0' : '#f80';
    ctx.fillRect(s.x + 10, s.y + s.h/2 - 1, (s.w - 20) * (s.hp / 2), 6);

    // black smoke coming out
    for (let i = 0; i < 4; i++) {
      const t = (Date.now() * 0.001 + i * 0.7) % 3;
      ctx.fillStyle = `rgba(40,30,25,${0.8 - t/3})`;
      ctx.beginPath();
      ctx.arc(s.x + s.w/2 + Math.sin(t*3)*8, s.y - t * 25, 10 + t * 5, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // smoke monsters
  for (const e of bossActiveEnemies) {
    if (!e.alive) continue;
    ctx.fillStyle = '#3a3020';
    ctx.beginPath();
    ctx.arc(e.x + 10, e.y + 10, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff4';
    ctx.fillRect(e.x + 4, e.y + 6, 4, 4);
    ctx.fillRect(e.x + 12, e.y + 6, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x + 5, e.y + 7, 2, 2);
    ctx.fillRect(e.x + 13, e.y + 7, 2, 2);
    // angry mouth
    ctx.strokeStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(e.x + 6, e.y + 15);
    ctx.lineTo(e.x + 10, e.y + 13);
    ctx.lineTo(e.x + 14, e.y + 15);
    ctx.stroke();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, 36);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, W, 36);
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('◆ JERRY THE WATER SAVIOUR', 15, 23);
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + score, 340, 23);
  ctx.fillText('LIVES ', 470, 23);
  for (let i = 0; i < lives; i++) {
    drawMiniDroplet(535 + i * 22, 15);
  }
  // powerup stage: no bomb until Jerry has hit two power blocks
  if (jerry.stage < 2) {
    ctx.fillStyle = '#789';
    ctx.fillText(jerry.stage === 0 ? 'HIT ? BLOCKS' : 'BIG! ONE MORE ?', 640, 23);
  } else if (jerry.hasBomb) {
    ctx.fillStyle = jerry.rapidBomb ? '#ff8' : '#4af';
    ctx.fillText(jerry.rapidBomb ? '[X] RAPID!' : '[X] BOMB', 655, 23);
  } else {
    ctx.fillStyle = '#567';
    ctx.fillText('[X] ...', 655, 23);
  }
  // level name on the second row, clear of the bomb indicator above it
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#8bc';
  const label = gameState === 'level2' ? 'LEVEL 2'
    : gameState === 'villain' ? 'FINAL BOSS'
    : gameState === 'boss' ? 'LEVEL 1 - BOSS'
    : 'LEVEL 1';
  ctx.fillText(label, W - 130, 55);

  // keep boss status on the HUD strip, not at the bottom edge where it hides
  if (gameState === 'boss') {
    const alive = boss.stacks.filter(s => s.alive).length;
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('BOSS  STACKS LEFT: ' + alive + '/3', 15, 55);
  } else if (gameState === 'villain' && villain) {
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('THE GREEDY TYCOON  HP: ' + villain.hp + '/' + villain.maxHp, 15, 55);
  }
}

function drawMiniDroplet(x, y) {
  ctx.fillStyle = '#4af';
  ctx.beginPath();
  ctx.moveTo(x, y - 6);
  ctx.bezierCurveTo(x + 7, y - 2, x + 7, y + 6, x, y + 8);
  ctx.bezierCurveTo(x - 7, y + 6, x - 7, y - 2, x, y - 6);
  ctx.fill();
}

function drawPopup() {
  // Sits just under the HUD at the top: on a phone the bottom of the screen is
  // where the thumbs and the ground are, so text down there gets missed.
  const pad = 18, lh = 24;
  const boxX = 30, boxW = W - 60;
  const textW = boxW - pad * 2;

  ctx.font = 'bold 18px monospace';
  const lines = wrapLines(popup.text, textW);
  const boxH = pad + 22 + lines.length * lh + pad - 8;
  // clear the HUD, and the extra status line the boss fights add
  const boxY = (gameState === 'boss' || gameState === 'villain') ? 66 : 46;

  // drop shadow so the panel separates from the sky behind it
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(boxX + 4, boxY + 4, boxW, boxH);

  ctx.fillStyle = 'rgba(0,12,28,0.95)';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 3;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('◆ DID YOU KNOW?', boxX + pad, boxY + pad + 6);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  lines.forEach((l, i) => {
    ctx.fillText(l, boxX + pad, boxY + pad + 30 + i * lh);
  });
}

// Splits text into lines that fit maxW. Call with the final font already set.
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line !== '') {
      lines.push(line.trim());
      line = w + ' ';
    } else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function wrapText(text, x, y, maxW, lh) {
  const lines = wrapLines(text, maxW);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
  return lines.length * lh;
}

// ============ RESET ============
function fullReset() {
  score = 0; lives = 3;
  jerry.x = 100; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  setStage(0);   // start small, no bomb - power blocks earn it
  jerry.invuln = 60; jerry.facing = 1;
  camera.x = 0;
  bombs = [];
  particles = [];
  bossActiveEnemies = [];
  popup = null;
  boss = null;
  villain = null;
  villainShots = [];
  screenShake = 0;
  resetLevel();
}

// ============ MAIN LOOP ============
function draw() {
  drawSky();
  drawClouds();
  ctx.save();
  // impact shake during the final fight
  const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
  const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
  ctx.translate(-camera.x + sx, sy);
  if (gameState === 'playing') {
    drawGround();
    drawHazards();
    drawSigns();
    drawBlocks();
    drawGoal();
    drawEnemies();
  } else if (gameState === 'level2') {
    drawGround(l2Platforms);
    drawHazards(l2Hazards);
    drawSigns();
    drawBlocks();
    drawL2Goal();
    drawEnemies();
  } else if (gameState === 'boss') {
    drawBossScene();
  } else if (gameState === 'villain') {
    drawVillainScene();
  }
  drawJerry();
  drawBombs();
  drawParticles();
  ctx.restore();
  drawHUD();
  if (popup) drawPopup();
}

function loop() {
  // consume a pending screen tap once per frame
  const tapped = tapConfirm;
  tapConfirm = false;

  // each scene has its own theme; playMusic ignores repeat calls
  playMusic(gameState);

  // the "not you?" chip belongs on the menu only
  if (switchBtn) {
    switchBtn.style.display =
      (gameState === 'menu' && profile.id && !askingName) ? 'block' : 'none';
  }

  if (gameState === 'menu') {
    drawMenu();
    // the dialog owns input while it is open
    if (!askingName && (keys['enter'] || tapped)) {
      keys['enter'] = false;
      if (profile.id) startRun();   // known player - straight in
      else askName();               // first time here - ask who they are
    }
  } else if (gameState === 'board') {
    drawLeaderboard();
    if (!askingName && (keys['enter'] || keys['r'] || tapped)) {
      keys['enter'] = false; keys['r'] = false;
      gameState = 'menu';
    }
  } else if (gameState === 'playing') {
    updatePlaying();
    draw();
  } else if (gameState === 'boss') {
    updateBoss();
    draw();
  } else if (gameState === 'level2') {
    updateLevel2();
    draw();
  } else if (gameState === 'villain') {
    updateVillain();
    draw();
  } else if (gameState === 'gameover') {
    recordRun();
    draw();
    drawGameOver();
    if (keys['r'] || tapped) { keys['r'] = false; gameState = 'board'; }
  } else if (gameState === 'win') {
    recordRun();
    drawWin();
    if (keys['r'] || tapped) { keys['r'] = false; gameState = 'board'; }
  }
  requestAnimationFrame(loop);
}

// Starts a fresh run for the current player.
function startRun() {
  fullReset();
  levelReached = 1;
  scoreSubmitted = false;
  gameState = 'playing';
}

// Called every frame on the end screens; only sends once per run.
function recordRun() {
  if (scoreSubmitted) return;
  scoreSubmitted = true;
  submitScore(score, levelReached);
}

resetLevel();
loop();
</script>
