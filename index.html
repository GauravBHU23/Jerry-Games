    } else if (pick === 'rage') {
      // final boss only: brief frenzy, everything speeds up
      v.rage = 150;
      screenShake = 10;
      sfx('boom');
      spawnParticles(v.x + v.w / 2, v.y + v.h / 2, '#f44', 26);

    // ---- signature attacks: one per boss ----
    } else if (pick === 'trashfall') {
      // L1 - tips a truckload from above. Shadows warn where it will land.
      const n = 2 + v.phase;
      for (let i = 0; i < n; i++) {
        const tx = 80 + Math.random() * (W - 160);
        villainShots.push({
          x: tx, y: -20 - i * 70, vx: 0, vy: 2.6 + v.phase * 0.5,
          r: 12, kind: 'junk', spin: Math.random() * 6, warn: true,
        });
      }
      sfx('hurt');

    } else if (pick === 'rollout') {
      // L2 - rolls leaking drums along the floor; jump them or bomb them.
      const n = 1 + Math.floor(v.phase / 2);
      for (let i = 0; i < n; i++) {
        villainShots.push({
          x: v.x + v.w / 2, y: GROUND_Y - 16,
          vx: dirTo * (3.4 + v.phase * 0.6), vy: 0,
          r: 15, kind: 'drum', spin: 0, rolls: true,
        });
      }
      sfx('hurt');

    } else if (pick === 'sludgetide') {
      // L3 - floods the arena floor; you have to be off the ground.
      v.tide = 190;
      screenShake = 6;
      sfx('hurt');
      showPopup('THE TIDE RISES - GET OFF THE FLOOR!');

    } else if (pick === 'laser') {
      // L4 - paints a beam on Jerry, then fires down it a moment later.
      v.laserAim = { x: jerry.x + jerry.w / 2, timer: 45 };
      sfx('jump');

    } else if (pick === 'outfall') {
      // L5 - jets burst upward from fixed pipes in the floor.
      const lanes = [120, 300, 480, 660];
      const count = 2 + Math.floor(v.phase / 2);
      const chosen = lanes.sort(() => Math.random() - 0.5).slice(0, count);
      for (const lx of chosen) {
        villainShots.push({
          x: lx, y: GROUND_Y - 4, vx: 0, vy: -7.5,
          r: 11, kind: 'jet', spin: 0, warn: true, life: 90,
        });
      }
      sfx('hurt');

    } else if (pick === 'mercury') {
      // L6 - heavy blobs that split in two when bombed.
      for (let i = 0; i < 2; i++) {
        villainShots.push({
          x: v.x + v.w / 2, y: v.y + 16,
          vx: (i === 0 ? -1 : 1) * (2.2 + v.phase * 0.4), vy: -5.5,
          r: 13, kind: 'mercury', spin: 0, splits: 1,
        });
      }
      sfx('hurt');

    } else if (pick === 'smogcloud') {
      // L7 - drops a rolling bank of smog that hides the arena.
      v.smog = 240;
      screenShake = 5;
      sfx('boom');
      showPopup('SMOG! You can barely see him.');

    } else if (pick === 'buyout') {
      // L8 - buys back a boss you already beat and borrows its attack.
      const owned = BOSSES.slice(0, 7);
      const bought = owned[Math.floor(Math.random() * owned.length)];
      v.bought = { name: bought.name, timer: 110 };
      showPopup('BOUGHT OUT: ' + bought.name + ' fights for him!');
      // fire that boss's signature straight away
      if (bought.signature === 'trashfall') {
        for (let i = 0; i < 3; i++) {
          villainShots.push({
            x: 80 + Math.random() * (W - 160), y: -20 - i * 70,
            vx: 0, vy: 3.2, r: 12, kind: 'junk', spin: 0, warn: true,
          });
        }
      } else if (bought.signature === 'rollout') {
        villainShots.push({
          x: v.x + v.w / 2, y: GROUND_Y - 16,
          vx: dirTo * 4.4, vy: 0, r: 15, kind: 'drum', spin: 0, rolls: true,
        });
      } else if (bought.signature === 'mercury') {
        for (let i = 0; i < 2; i++) {
          villainShots.push({
            x: v.x + v.w / 2, y: v.y + 16,
            vx: (i === 0 ? -1 : 1) * 3, vy: -5.5,
            r: 13, kind: 'mercury', spin: 0, splits: 1,
          });
        }
      } else if (bought.signature === 'outfall') {
        for (const lx of [200, 420, 620]) {
          villainShots.push({
            x: lx, y: GROUND_Y - 4, vx: 0, vy: -7.5,
            r: 11, kind: 'jet', spin: 0, warn: true, life: 90,
          });
        }
      } else if (bought.signature === 'sludgetide') {
        v.tide = 150;
      } else if (bought.signature === 'smogcloud') {
        v.smog = 160;
      } else {
        v.laserAim = { x: jerry.x + jerry.w / 2, timer: 45 };
      }
      sfx('boom');
    }
  }

  // body contact hurts
  if (jerry.invuln <= 0 && rectHit(jerry, v)) damagePlayer();

  // ---- boss minions ----
  for (const e of bossActiveEnemies) {
    if (!e.alive) continue;
    if (e.type === 'drone') {
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
      e.phase += 0.04;
      e.y = e.baseY + Math.sin(e.phase) * 26;
    } else if (e.type === 'chaser') {
      const dir = Math.sign((jerry.x + jerry.w / 2) - (e.x + e.w / 2)) || 1;
      e.x += dir * Math.abs(e.vx);
      e.vx = dir * Math.abs(e.vx);
    } else if (e.type === 'spitter') {
      if (--e.fireTimer <= 0) {
        e.fireTimer = 110;
        const dx = (jerry.x + jerry.w / 2) - (e.x + e.w / 2);
        villainShots.push({
          x: e.x + e.w / 2, y: e.y + 8,
          vx: Math.sign(dx) * 3.4, vy: -3.4,
          r: 8, kind: 'toxic', spin: 0,
        });
      }
    } else {
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    }
    e.x = Math.max(10, Math.min(W - e.w - 10, e.x));

    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      const stompable = e.type !== 'drone' && e.type !== 'drum';
      if (stompable && jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 10) {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        jerry.jumps = Math.min(jerry.jumps, 1);
        addKillScore(120, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#8b6f47', 10);
      } else {
        damagePlayer();
      }
    }
  }
  // bombs clear minions too
  for (const b of bombs) {
    for (const e of bossActiveEnemies) {
      if (!e.alive || b.dead) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, e)) {
        e.alive = false;
        addKillScore(120, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#4af', 12);
        if (!(b.pierce && ++b.hits < 3)) b.dead = true;
      }
    }
  }
  bossActiveEnemies = bossActiveEnemies.filter(e => e.alive);

  // ---- villain projectiles ----
  for (const s of villainShots) {
    if (s.ground) {
      // shockwave: skims along the floor instead of falling
      s.x += s.vx;
      s.y = GROUND_Y - 10;
      s.spin += 0.3;
      if (s.x < -60 || s.x > W + 60) s.dead = true;
    } else if (s.rolls) {
      // a drum rolling along the floor - keeps going until it leaves the arena
      s.x += s.vx;
      s.y = GROUND_Y - s.r;
      s.spin += 0.26 * Math.sign(s.vx);
      if (s.x < -60 || s.x > W + 60) s.dead = true;
    } else if (s.kind === 'jet') {
      // an outfall jet: bursts up, hangs, then dies back down
      if (s.warn) { if (--s.life <= 60) s.warn = false; }
      else {
        s.y += s.vy;
        s.vy += GRAVITY * 0.35;
        if (--s.life <= 0 || s.y > GROUND_Y + 10) s.dead = true;
      }
      s.spin += 0.25;
    } else if (s.kind === 'junk') {
      // falling rubbish - straight down, no arc
      s.y += s.vy;
      s.spin += 0.14;
      if (s.y - s.r > H) s.dead = true;
    } else {
      s.vy += GRAVITY * 0.55;
      s.x += s.vx; s.y += s.vy;
      s.spin += 0.2;
      if (s.y - s.r > H || s.x < -60 || s.x > W + 60) s.dead = true;
      // bounce money bags once off the floor so they stay dangerous
      if (s.kind === 'money' && s.y + s.r >= GROUND_Y && s.vy > 0) {
        if (!s.bounced) { s.vy = -5.5; s.bounced = true; }
        else s.dead = true;
      }
    }
    if (!s.dead && jerry.invuln <= 0 &&
        rectHit({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, jerry)) {
      s.dead = true;
      damagePlayer();
    }
  }
  villainShots = villainShots.filter(s => !s.dead);

  // ---- Jerry's bombs vs the villain ----
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > W + 50) b.dead = true;

    // Mercury splits instead of dying: bombing a blob buys you nothing unless
    // you finish off both halves, which is what makes the TOXIC BARON awkward.
    if (!b.dead) {
      for (const s of villainShots) {
        if (s.dead || s.kind !== 'mercury') continue;
        if (!rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r*2, h: b.r*2 },
                     { x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 })) continue;
        b.dead = true;
        s.dead = true;
        score += 60;
        sfx('boom');
        spawnParticles(s.x, s.y, '#c9c9d8', 12);
        if (s.splits > 0) {
          for (const dir of [-1, 1]) {
            villainShots.push({
              x: s.x, y: s.y, vx: dir * 2.6, vy: -3.4,
              r: Math.max(7, s.r - 5), kind: 'mercury', spin: 0, splits: s.splits - 1,
            });
          }
        }
        break;
      }
    }

    if (!b.dead && v.hurt <= 0 &&
        rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r*2, h: b.r*2 }, v)) {
      b.dead = true;
      v.hp--;
      v.hurt = 30;
      screenShake = 12;
      score += 400;
      sfx('boom');
      spawnParticles(b.x, b.y, '#4af', 18);
      spawnParticles(v.x + v.w/2, v.y + 30, '#fff', 12);
      // knock him back a little
      v.vx = Math.sign(v.x - jerry.x) * Math.abs(v.vx) || v.vx;
      if (v.hp <= 0) {
        spawnParticles(v.x + v.w/2, v.y + v.h/2, '#ff8800', 40);
        spawnParticles(v.x + v.w/2, v.y + v.h/2, '#fff', 30);
        score += 500 + level * 250;
        screenShake = 20;
        showPopup('DEFEATED: ' + (v.def || bossDef(level)).name + '. ' +
                  (v.def || bossDef(level)).fact);
        bossActiveEnemies = [];
        villainShots = [];
        if (level >= FINAL_LEVEL) {
          gameState = 'win';
        } else {
          // beat this polluter, on to the next stretch of river.
          // nextLevel() resets bombs/enemies, so stop touching them here.
          nextLevel();
          return;
        }
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of particles) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  updateFloatText();

  if (screenShake > 0) screenShake--;
  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// ============ RENDER ============
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (gameState === 'villain') {
    // stormy showdown sky
    g.addColorStop(0, '#1a1030');
    g.addColorStop(0.55, '#4a2a50');
    g.addColorStop(1, '#8a4a5a');
  } else {
    // each level fades a little dirtier than the last
    const sky = (levelData || levelDef(level)).sky;
    g.addColorStop(0, sky[0]);
    g.addColorStop(1, sky[1]);
  }
  ctx.fillStyle = g;
  // fill the whole view, with a little slack so rounding leaves no edge line
  ctx.fillRect(-2, 0, VIEW_W + 4, H);
}

function drawClouds() {
  const dark = gameState === 'villain' || level >= 6;
  ctx.fillStyle = dark ? 'rgba(80,40,30,0.55)'
    : level >= 3 ? 'rgba(120,110,100,0.55)'
    : 'rgba(255,255,255,0.75)';
  const off = (camera.x * 0.3) % 240;
  const cols = Math.ceil(VIEW_W / 240) + 2;   // cover the full view width
  for (let i = -1; i < cols; i++) {
    const cx = i * 240 - off + 40;
    const cy = 70 + (i % 2) * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.arc(cx + 25, cy - 8, 26, 0, Math.PI*2);
    ctx.arc(cx + 55, cy, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

// Ground palettes per level theme: healthy grass turns to ash further in.
const GROUND_STYLE = {
  grass: { top: '#5a8c3a', tuft: '#7cb85a', soil: '#6b3d1a', dark: '#553015' },
  dead:  { top: '#6b6a45', tuft: '#8a8558', soil: '#5c4a2a', dark: '#42331b' },
  rust:  { top: '#7a5a44', tuft: '#94705a', soil: '#4f3524', dark: '#382417' },
  ash:   { top: '#4f4a52', tuft: '#6b6470', soil: '#332f38', dark: '#221f28' },
};

function drawGround(list) {
  const theme = (levelData || levelDef(level)).ground || 'grass';
  const c = GROUND_STYLE[theme] || GROUND_STYLE.grass;
  for (const p of (list || platforms)) {
    if (p.kind === 'ground') {
      ctx.fillStyle = c.top;
      ctx.fillRect(p.x, p.y, p.w, 10);
      ctx.fillStyle = c.tuft;
      for (let i = 0; i < p.w; i += 12) {
        ctx.fillRect(p.x + i, p.y - 3, 8, 5);
      }
      ctx.fillStyle = c.soil;
      ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
      ctx.fillStyle = c.dark;
      for (let i = 0; i < p.w; i += 30) {
        ctx.fillRect(p.x + i, p.y + 18, 3, 18);
        ctx.fillRect(p.x + i + 15, p.y + 32, 3, 15);
      }
    } else {
      // brick
      ctx.fillStyle = '#a86f3a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#6b3d1a';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      for (let i = 20; i < p.w; i += 20) {
        ctx.beginPath();
        ctx.moveTo(p.x + i, p.y);
        ctx.lineTo(p.x + i, p.y + p.h);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + p.h/2);
      ctx.lineTo(p.x + p.w, p.y + p.h/2);
      ctx.stroke();
    }
  }
}

function drawHazards(list) {
  for (const h of (list || hazards)) {
    ctx.fillStyle = '#4a3a1a';
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = '#3a2a0a';
    ctx.fillRect(h.x, h.y, h.w, 4);
    // bubbles
    for (let i = 0; i < 5; i++) {
      const t = Date.now() * 0.002 + i * 0.7;
      ctx.fillStyle = 'rgba(120,90,40,0.7)';
      ctx.beginPath();
      ctx.arc(h.x + 12 + i * 18, h.y + 25 + Math.sin(t) * 4, 3 + Math.sin(t)*1, 0, Math.PI*2);
      ctx.fill();
    }
    // toxic label
    ctx.fillStyle = 'rgba(255,255,0,0.8)';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('☠ SEWAGE', h.x + 15, h.y + 55);
  }
}

function drawSigns() {
  for (const s of signs) {
    ctx.fillStyle = '#6b4520';
    ctx.fillRect(s.x + 17, s.y + 40, 6, 20);
    ctx.fillStyle = '#d4a86a';
    ctx.fillRect(s.x, s.y, 40, 40);
    ctx.strokeStyle = '#5a3d1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(s.x, s.y, 40, 40);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('!', s.x + 14, s.y + 30);
  }
}

function drawBlocks() {
  for (const b of blocks) {
    if (b.hit) {
      ctx.fillStyle = '#6b4520';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#3a2510';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else {
      const pulse = Math.sin(Date.now() * 0.006) * 0.15 + 1;
      ctx.fillStyle = '#e8a83a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#c88a1a';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3);
      ctx.fillRect(b.x + 3, b.y + b.h - 6, b.w - 6, 3);
      ctx.fillRect(b.x + 3, b.y + 3, 3, b.h - 6);
      ctx.fillRect(b.x + b.w - 6, b.y + 3, 3, b.h - 6);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.floor(24*pulse)}px monospace`;
      ctx.fillText('?', b.x + 12, b.y + 30);
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'trash') {
      // trash bag body
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(e.x + 15, e.y + 20, 15, 12, 0, 0, Math.PI*2);
      ctx.fill();
      // tied top
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(e.x + 8, e.y + 10);
      ctx.lineTo(e.x + 15, e.y);
      ctx.lineTo(e.x + 22, e.y + 10);
      ctx.closePath();
      ctx.fill();
      // menace face
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 7, e.y + 16, 5, 5);
      ctx.fillRect(e.x + 18, e.y + 16, 5, 5);
      ctx.fillStyle = '#a00';
      const eyeShift = e.vx > 0 ? 2 : 0;
      ctx.fillRect(e.x + 8 + eyeShift, e.y + 17, 3, 3);
      ctx.fillRect(e.x + 19 + eyeShift, e.y + 17, 3, 3);
      // little arms
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - 2, e.y + 22, 5, 3);
      ctx.fillRect(e.x + 27, e.y + 22, 5, 3);
    } else if (e.type === 'drum') {
      ctx.fillStyle = '#c04040';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#600';
      ctx.fillRect(e.x, e.y + 6, e.w, 4);
      ctx.fillRect(e.x, e.y + e.h - 10, e.w, 4);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('☠', e.x + 12, e.y + 27);
      // drip
      ctx.fillStyle = '#4a2a0a';
      ctx.fillRect(e.x + 5, e.y + e.h - 2, 6, 4);
    } else if (e.type === 'barrel') {
      // rolling toxic barrel
      const cx = e.x + e.w/2, cy = e.y + e.h/2, r = e.w/2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((e.x * 0.06) * (e.vx > 0 ? 1 : -1));
      ctx.fillStyle = '#a83a2a';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5a1a10'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#701f14';
      ctx.beginPath();
      ctx.moveTo(-r, -r*0.35); ctx.lineTo(r, -r*0.35);
      ctx.moveTo(-r, r*0.35);  ctx.lineTo(r, r*0.35);
      ctx.stroke();
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('☠', -5, 5);
      ctx.restore();
      // leaking sludge
      ctx.fillStyle = 'rgba(90,120,30,0.75)';
      ctx.fillRect(e.x + 8, e.y + e.h - 2, 8, 4);
    } else if (e.type === 'drone') {
      const cx = e.x + e.w/2;
      // rotors
      ctx.strokeStyle = '#889';
      ctx.lineWidth = 2;
      const blur = Math.sin(Date.now() * 0.05) * 6;
      ctx.beginPath();
      ctx.moveTo(e.x - 4 + blur, e.y); ctx.lineTo(e.x + 12 - blur, e.y);
      ctx.moveTo(e.x + e.w - 12 + blur, e.y); ctx.lineTo(e.x + e.w + 4 - blur, e.y);
      ctx.stroke();
      ctx.fillStyle = '#667';
      ctx.fillRect(e.x + 3, e.y + 2, 5, 5);
      ctx.fillRect(e.x + e.w - 8, e.y + 2, 5, 5);
      // body
      ctx.fillStyle = '#4a4a58';
      ctx.fillRect(e.x, e.y + 6, e.w, e.h - 6);
      ctx.strokeStyle = '#22222c';
      ctx.strokeRect(e.x, e.y + 6, e.w, e.h - 6);
      // angry red eye scanning
      ctx.fillStyle = '#f33';
      const ex = cx + (e.vx > 0 ? 4 : -4);
      ctx.beginPath(); ctx.arc(ex, e.y + 14, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,60,60,0.35)';
      ctx.beginPath(); ctx.arc(ex, e.y + 14, 7, 0, Math.PI*2); ctx.fill();

    } else if (e.type === 'spitter') {
      // squat sludge pipe that shoots at Jerry
      const about = e.fireTimer < 25;
      ctx.fillStyle = '#4a5a3a';
      ctx.fillRect(e.x, e.y + 10, e.w, e.h - 10);
      ctx.strokeStyle = '#26301c'; ctx.lineWidth = 2;
      ctx.strokeRect(e.x, e.y + 10, e.w, e.h - 10);
      // nozzle, pointing the way it will fire
      const dir = (jerry.x > e.x) ? 1 : -1;
      ctx.fillStyle = '#33402a';
      ctx.fillRect(dir > 0 ? e.x + e.w - 4 : e.x - 8, e.y + 14, 12, 9);
      // glowing charge before it spits
      ctx.fillStyle = about ? '#cfff5a' : '#7aa83a';
      ctx.beginPath();
      ctx.arc(e.x + e.w / 2, e.y + 8, about ? 8 : 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1e2a14';
      ctx.fillRect(e.x + 8, e.y + 22, 5, 5);
      ctx.fillRect(e.x + e.w - 13, e.y + 22, 5, 5);

    } else if (e.type === 'chaser') {
      // hungry blob that runs at you
      const wob = Math.sin(Date.now() * 0.012 + e.x * 0.05) * 2;
      ctx.fillStyle = '#7a2a5a';
      ctx.beginPath();
      ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2 + wob, e.w / 2, e.h / 2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#43102f'; ctx.lineWidth = 2; ctx.stroke();
      // legs
      ctx.fillStyle = '#43102f';
      for (let i = 0; i < 3; i++) {
        const lx = e.x + 6 + i * 9;
        ctx.fillRect(lx, e.y + e.h - 4, 3, 5 + Math.sin(Date.now() * 0.02 + i) * 2);
      }
      // eyes track Jerry
      const look = jerry.x > e.x ? 3 : -3;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x + 11, e.y + 13 + wob, 5, 0, Math.PI * 2);
      ctx.arc(e.x + e.w - 11, e.y + 13 + wob, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a00';
      ctx.beginPath();
      ctx.arc(e.x + 11 + look, e.y + 14 + wob, 2.5, 0, Math.PI * 2);
      ctx.arc(e.x + e.w - 11 + look, e.y + 14 + wob, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // teeth
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) ctx.fillRect(e.x + 8 + i * 5, e.y + 22 + wob, 3, 4);
    }
  }
}

// Sludge fired by spitters (reuses the villain's projectile list).
function drawEnemyShots() {
  for (const s of villainShots) {
    ctx.fillStyle = 'rgba(120,200,40,0.9)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a6b10'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(200,255,120,0.9)';
    ctx.beginPath(); ctx.arc(s.x - 3, s.y - 3, s.r * 0.35, 0, Math.PI * 2); ctx.fill();
  }
}

// "LEVEL n - NAME" card when a stage starts, and power unlock toasts.
function drawLevelBanner() {
  if (levelBanner > 0) {
    levelBanner--;
    const d = levelDef(level);
    const a = Math.min(1, levelBanner / 40);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,10,25,0.8)';
    ctx.fillRect(0, H / 2 - 52, W, 96);
    ctx.strokeStyle = '#4af'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H / 2 - 52); ctx.lineTo(W, H / 2 - 52);
    ctx.moveTo(0, H / 2 + 44); ctx.lineTo(W, H / 2 + 44);
    ctx.stroke();
    ctx.fillStyle = '#4af';
    ctx.font = 'bold 34px monospace';
    ctx.fillText('LEVEL ' + level, W / 2, H / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(d.name, W / 2, H / 2 + 20);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  if (powerBanner) {
    powerBanner.timer--;
    if (powerBanner.timer <= 0) { powerBanner = null; return; }
    const a = Math.min(1, powerBanner.timer / 30);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(40,30,0,0.85)';
    ctx.fillRect(W / 2 - 190, 150, 380, 44);
    ctx.strokeStyle = '#ffd94a'; ctx.lineWidth = 3;
    ctx.strokeRect(W / 2 - 190, 150, 380, 44);
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 19px monospace';
    ctx.fillText('★ ' + powerBanner.text + ' ★', W / 2, 179);
    ctx.restore();
    ctx.textAlign = 'left';
  }
}

// ============ LEVEL 2 / VILLAIN RENDER ============
function drawVillain() {
  const v = villain;
  const d = v.def || bossDef(level);
  const flash = v.hurt > 0 && Math.floor(Date.now() / 60) % 2 === 0;
  const raging = v.rage > 0;

  // proportions scale with each boss's size
  const S = v.h / 96;
  const bodyTop = v.y + 26 * S;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(v.x + v.w / 2, GROUND_Y + 3, v.w / 2, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // rage aura on the final boss
  if (raging) {
    ctx.strokeStyle = `rgba(255,70,70,${0.35 + Math.sin(Date.now() * 0.02) * 0.25})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(v.x + v.w / 2, v.y + v.h / 2, v.w * 0.85, v.h * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  const skin = flash ? '#fff' : '#e8b98a';
  const suit = flash ? '#fff' : d.color;
  const trim = flash ? '#fff' : d.accent;
  const look = v.facing > 0 ? 2 * S : -2 * S;

  // Every boss is a different kind of polluter, so each gets its own body
  // rather than one businessman in eight colours.
  const shape = d.shape || 'tycoon';

  // ---- the human bosses share a torso, but wear their trade ----
  const drawLegs = () => {
    ctx.fillStyle = suit;
    ctx.fillRect(v.x + 10 * S, bodyTop + 36 * S, 14 * S, v.h - 62 * S);
    ctx.fillRect(v.x + v.w - 24 * S, bodyTop + 36 * S, 14 * S, v.h - 62 * S);
    ctx.fillStyle = flash ? '#fff' : '#111';
    ctx.fillRect(v.x + 6 * S, v.y + v.h - 8 * S, 20 * S, 8 * S);
    ctx.fillRect(v.x + v.w - 26 * S, v.y + v.h - 8 * S, 20 * S, 8 * S);
  };
  const drawArms = () => {
    ctx.fillStyle = suit;
    ctx.fillRect(v.x - 6 * S, bodyTop + 4 * S, 10 * S, 26 * S);
    ctx.fillRect(v.x + v.w - 4 * S, bodyTop + 4 * S, 10 * S, 26 * S);
    ctx.fillStyle = skin;
    ctx.fillRect(v.x - 6 * S, bodyTop + 28 * S, 10 * S, 8 * S);
    ctx.fillRect(v.x + v.w - 4 * S, bodyTop + 28 * S, 10 * S, 8 * S);
  };
  const drawFace = () => {
    ctx.fillStyle = skin;
    ctx.fillRect(v.x + 12 * S, v.y + 2 * S, v.w - 24 * S, 26 * S);
    ctx.fillStyle = '#fff';
    ctx.fillRect(v.x + 17 * S, v.y + 10 * S, 8 * S, 7 * S);
    ctx.fillRect(v.x + v.w - 25 * S, v.y + 10 * S, 8 * S, 7 * S);
    ctx.fillStyle = raging ? '#f00' : '#000';
    ctx.fillRect(v.x + 19 * S + look, v.y + 12 * S, 4 * S, 4 * S);
    ctx.fillRect(v.x + v.w - 23 * S + look, v.y + 12 * S, 4 * S, 4 * S);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(v.x + 16 * S, v.y + 7 * S); ctx.lineTo(v.x + 26 * S, v.y + 11 * S);
    ctx.moveTo(v.x + v.w - 16 * S, v.y + 7 * S); ctx.lineTo(v.x + v.w - 26 * S, v.y + 11 * S);
    ctx.beginPath();
    ctx.moveTo(v.x + 20 * S, v.y + 24 * S); ctx.lineTo(v.x + v.w - 20 * S, v.y + 24 * S);
    ctx.stroke();
  };
  const drawTorso = () => {
    ctx.fillStyle = suit;
    ctx.fillRect(v.x, bodyTop, v.w, 40 * S);
  };

  if (shape === 'hauler') {
    // L1 - a bin man behind a tipped-up rubbish skip
    drawLegs(); drawTorso(); drawArms();
    ctx.fillStyle = flash ? '#fff' : '#2f2f2f';
    ctx.fillRect(v.x - 4 * S, bodyTop + 6 * S, v.w + 8 * S, 26 * S);
    ctx.strokeStyle = flash ? '#fff' : trim; ctx.lineWidth = 2;
    ctx.strokeRect(v.x - 4 * S, bodyTop + 6 * S, v.w + 8 * S, 26 * S);
    // rubbish spilling over the lip
    ctx.fillStyle = flash ? '#fff' : '#6a5a3a';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(v.x + 2 * S + i * 13 * S, bodyTop + 1 * S, 9 * S, 7 * S);
    }
    drawFace();
    // flat cap
    ctx.fillStyle = flash ? '#fff' : '#3a3a2a';
    ctx.fillRect(v.x + 8 * S, v.y - 3 * S, v.w - 16 * S, 7 * S);
    ctx.fillRect(v.x + 4 * S, v.y + 2 * S, v.w - 8 * S, 3 * S);

  } else if (shape === 'drumstack') {
    // L2 - a warden built out of the barrels he hoards
    drawLegs();
    for (let i = 0; i < 2; i++) {
      const dy = bodyTop + i * 20 * S;
      ctx.fillStyle = flash ? '#fff' : (i ? '#8a3a24' : suit);
      ctx.fillRect(v.x, dy, v.w, 19 * S);
      ctx.fillStyle = flash ? '#fff' : trim;
      ctx.fillRect(v.x, dy + 5 * S, v.w, 3 * S);
      ctx.fillRect(v.x, dy + 12 * S, v.w, 3 * S);
      // hazard stripe
      ctx.fillStyle = flash ? '#fff' : '#e8c83a';
      ctx.fillRect(v.x + v.w / 2 - 7 * S, dy + 3 * S, 14 * S, 4 * S);
    }
    drawArms();
    drawFace();
    // respirator mask
    ctx.fillStyle = flash ? '#fff' : '#2a2a2a';
    ctx.fillRect(v.x + 15 * S, v.y + 18 * S, v.w - 30 * S, 9 * S);
    ctx.fillStyle = flash ? '#fff' : '#555';
    ctx.beginPath();
    ctx.arc(v.x + v.w / 2, v.y + 23 * S, 4 * S, 0, Math.PI * 2);
    ctx.fill();

  } else if (shape === 'barge') {
    // L3 - not a man at all: a squat waste barge with a funnel
    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.moveTo(v.x, v.y + 22 * S);
    ctx.lineTo(v.x + v.w, v.y + 22 * S);
    ctx.lineTo(v.x + v.w - 9 * S, v.y + v.h);
    ctx.lineTo(v.x + 9 * S, v.y + v.h);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = flash ? '#fff' : trim; ctx.lineWidth = 2; ctx.stroke();
    // deck load of sludge
    ctx.fillStyle = flash ? '#fff' : '#6a8a2a';
    ctx.fillRect(v.x + 6 * S, v.y + 14 * S, v.w - 12 * S, 9 * S);
    // funnel belching
    ctx.fillStyle = flash ? '#fff' : '#2a2a2a';
    ctx.fillRect(v.x + v.w / 2 - 7 * S, v.y - 4 * S, 14 * S, 20 * S);
    ctx.fillStyle = flash ? '#fff' : trim;
    ctx.fillRect(v.x + v.w / 2 - 7 * S, v.y + 1 * S, 14 * S, 4 * S);
    // portholes as "eyes"
    ctx.fillStyle = raging ? '#f00' : '#cfe';
    ctx.beginPath(); ctx.arc(v.x + 20 * S, v.y + 30 * S, 5 * S, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(v.x + v.w - 20 * S, v.y + 30 * S, 5 * S, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(v.x + 20 * S, v.y + 30 * S, 5 * S, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(v.x + v.w - 20 * S, v.y + 30 * S, 5 * S, 0, Math.PI * 2); ctx.stroke();

  } else if (shape === 'drone') {
    // L4 - a security drone: no legs, it hovers
    const cx = v.x + v.w / 2, cy = v.y + v.h / 2;
    // rotors
    ctx.strokeStyle = flash ? '#fff' : '#8a8a9a'; ctx.lineWidth = 2;
    for (const sx of [-1, 1]) {
      const rx = cx + sx * (v.w / 2 - 4 * S);
      ctx.beginPath(); ctx.moveTo(rx, v.y + 6 * S); ctx.lineTo(rx, cy); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(rx, v.y + 6 * S, 15 * S, 3 * S, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // chassis
    ctx.fillStyle = suit;
    ctx.fillRect(v.x + 6 * S, cy - 12 * S, v.w - 12 * S, 24 * S);
    ctx.fillStyle = flash ? '#fff' : trim;
    ctx.fillRect(v.x + 6 * S, cy - 12 * S, v.w - 12 * S, 5 * S);
    // single tracking eye
    ctx.fillStyle = raging ? '#f00' : '#f66';
    ctx.beginPath(); ctx.arc(cx + look * 2, cy + 2 * S, 7 * S, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#300'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx + look * 2 - 2 * S, cy, 2.5 * S, 0, Math.PI * 2); ctx.fill();

  } else if (shape === 'pipeworks') {
    // L5 - a foreman wearing the outfall manifold on his back
    drawLegs(); drawTorso(); drawArms();
    ctx.strokeStyle = flash ? '#fff' : '#8a8a92'; ctx.lineWidth = 5 * S;
    ctx.beginPath();
    ctx.moveTo(v.x + 4 * S, bodyTop + 34 * S);
    ctx.lineTo(v.x + 4 * S, bodyTop + 8 * S);
    ctx.lineTo(v.x + v.w - 4 * S, bodyTop + 8 * S);
    ctx.lineTo(v.x + v.w - 4 * S, bodyTop + 30 * S);
    ctx.stroke();
    // valve wheel on the chest
    ctx.strokeStyle = flash ? '#fff' : trim; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(v.x + v.w / 2, bodyTop + 20 * S, 9 * S, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(v.x + v.w / 2 - 9 * S, bodyTop + 20 * S);
    ctx.lineTo(v.x + v.w / 2 + 9 * S, bodyTop + 20 * S);
    ctx.moveTo(v.x + v.w / 2, bodyTop + 11 * S);
    ctx.lineTo(v.x + v.w / 2, bodyTop + 29 * S);
    ctx.stroke();
    drawFace();
    // hard hat
    ctx.fillStyle = flash ? '#fff' : '#e8a83a';
    ctx.beginPath();
    ctx.ellipse(v.x + v.w / 2, v.y + 4 * S, (v.w - 18 * S) / 2, 9 * S, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(v.x + 7 * S, v.y + 3 * S, v.w - 14 * S, 4 * S);

  } else if (shape === 'hazmat') {
    // L6 - a sealed hazmat suit with a mercury tank
    drawLegs(); drawTorso(); drawArms();
    // suit seams
    ctx.strokeStyle = flash ? '#fff' : trim; ctx.lineWidth = 2;
    ctx.strokeRect(v.x + 3 * S, bodyTop + 3 * S, v.w - 6 * S, 34 * S);
    // tank of mercury on the chest
    ctx.fillStyle = flash ? '#fff' : '#c9c9d8';
    ctx.fillRect(v.x + v.w / 2 - 8 * S, bodyTop + 10 * S, 16 * S, 20 * S);
    ctx.fillStyle = flash ? '#fff' : '#8a8a9a';
    ctx.fillRect(v.x + v.w / 2 - 8 * S, bodyTop + 10 * S, 16 * S, 5 * S);
    // hood + visor instead of a face
    ctx.fillStyle = suit;
    ctx.fillRect(v.x + 9 * S, v.y, v.w - 18 * S, 28 * S);
    ctx.fillStyle = raging ? 'rgba(255,60,60,0.85)' : 'rgba(150,240,180,0.85)';
    ctx.fillRect(v.x + 14 * S, v.y + 8 * S, v.w - 28 * S, 12 * S);
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
    ctx.strokeRect(v.x + 14 * S, v.y + 8 * S, v.w - 28 * S, 12 * S);
    // glowing eyes behind the visor
    ctx.fillStyle = raging ? '#fff' : '#2a6a3a';
    ctx.fillRect(v.x + 18 * S + look, v.y + 12 * S, 5 * S, 4 * S);
    ctx.fillRect(v.x + v.w - 23 * S + look, v.y + 12 * S, 5 * S, 4 * S);

  } else if (shape === 'stack') {
    // L7 - a general fused to a smokestack, chimneys on his shoulders.
    // Drawn before the body so the stacks rise behind his head.
    drawLegs();
    for (const sx of [-10, v.w - 2]) {
      ctx.fillStyle = flash ? '#fff' : '#3a3a3a';
      ctx.fillRect(v.x + sx * S, v.y - 16 * S, 13 * S, 42 * S);
      ctx.fillStyle = flash ? '#fff' : trim;
      ctx.fillRect(v.x + sx * S, v.y - 16 * S, 13 * S, 4 * S);
      // soot puffing out of the top
      ctx.fillStyle = 'rgba(90,90,96,0.55)';
      const puff = (Date.now() * 0.004 + sx) % 3;
      ctx.beginPath();
      ctx.arc(v.x + (sx + 6) * S, v.y - (20 + puff * 7) * S, (4 + puff * 2) * S, 0, Math.PI * 2);
      ctx.fill();
    }
    drawTorso(); drawArms();
    // medals across the chest
    ctx.fillStyle = flash ? '#fff' : '#d8c04a';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(v.x + 14 * S + i * 10 * S, bodyTop + 14 * S, 3.5 * S, 0, Math.PI * 2);
      ctx.fill();
    }
    drawFace();
    // peaked officer's cap
    ctx.fillStyle = flash ? '#fff' : '#15151f';
    ctx.fillRect(v.x + 9 * S, v.y - 2 * S, v.w - 18 * S, 8 * S);
    ctx.fillRect(v.x + 5 * S, v.y + 4 * S, v.w - 10 * S, 4 * S);
    ctx.fillStyle = flash ? '#fff' : trim;
    ctx.fillRect(v.x + 9 * S, v.y + 1 * S, v.w - 18 * S, 3 * S);

  } else {
    // L8 - the tycoon himself: pinstripe suit, top hat, cigar
    drawLegs(); drawTorso();
    ctx.fillStyle = flash ? '#fff' : '#e8e8e8';
    ctx.fillRect(v.x + v.w / 2 - 9 * S, bodyTop + 2 * S, 18 * S, 34 * S);
    ctx.fillStyle = trim;
    ctx.beginPath();
    ctx.moveTo(v.x + v.w / 2, bodyTop + 2 * S);
    ctx.lineTo(v.x + v.w / 2 - 5 * S, bodyTop + 10 * S);
    ctx.lineTo(v.x + v.w / 2, bodyTop + 32 * S);
    ctx.lineTo(v.x + v.w / 2 + 5 * S, bodyTop + 10 * S);
    ctx.closePath(); ctx.fill();
    drawArms();
    drawFace();
    ctx.fillStyle = flash ? '#fff' : '#15151f';
    ctx.fillRect(v.x + 6 * S, v.y - 2 * S, v.w - 12 * S, 5 * S);
    ctx.fillRect(v.x + 13 * S, v.y - 18 * S, v.w - 26 * S, 17 * S);
    ctx.fillStyle = trim;
    ctx.fillRect(v.x + 13 * S, v.y - 7 * S, v.w - 26 * S, 4 * S);
    // cigar
    ctx.fillStyle = flash ? '#fff' : '#6b3d1a';
    ctx.fillRect(v.x + v.w - 18 * S, v.y + 21 * S, 12 * S, 4 * S);
    ctx.fillStyle = '#f80';
    ctx.fillRect(v.x + v.w - 7 * S, v.y + 21 * S, 3 * S, 4 * S);
  }

  // Name plate and health bar above him. Sits clear of the tallest headgear
  // (top hat, chimneys) so the bar never overlaps the boss himself.
  const bw = Math.max(96, v.w + 46), bx = v.x + v.w / 2 - bw / 2;
  const by = Math.max(74, v.y - 52);      // never ride up into the HUD

  // whoever he has bought out this moment, above the plate again
  if (v.bought) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('◆ ' + v.bought.name, v.x + v.w / 2, by - 18);
    ctx.textAlign = 'left';
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = flash ? '#fff' : trim;
  ctx.font = 'bold 11px monospace';
  ctx.fillText(d.name, v.x + v.w / 2, by - 4);
  ctx.textAlign = 'left';

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
  ctx.fillStyle = '#500';
  ctx.fillRect(bx, by, bw, 8);
  const frac = v.hp / v.maxHp;
  ctx.fillStyle = frac > 0.6 ? '#3d3' : frac > 0.3 ? '#fd3' : '#f44';
  ctx.fillRect(bx, by, bw * frac, 8);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, 8);
  // pip per hit so you can see exactly how many bombs are left
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  for (let i = 1; i < v.maxHp; i++) {
    const x = bx + (bw * i) / v.maxHp;
    ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + 8); ctx.stroke();
  }
}

function drawVillainShots() {
  for (const s of villainShots) {
    if (s.kind === 'money') {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#c8a83a';
      ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#6b5410'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#3a2a08';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('$', -4, 5);
      ctx.restore();
    } else if (s.kind === 'junk') {
      // falling rubbish, with a shadow marking where it lands
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(s.x, GROUND_Y + 2, s.r * 0.9, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#6a5a3a';
      ctx.fillRect(-s.r, -s.r, s.r * 2, s.r * 2);
      ctx.strokeStyle = '#3a3020'; ctx.lineWidth = 2;
      ctx.strokeRect(-s.r, -s.r, s.r * 2, s.r * 2);
      ctx.fillStyle = '#8a7a4a';
      ctx.fillRect(-s.r + 3, -s.r + 3, s.r, s.r * 0.7);
      ctx.restore();

    } else if (s.kind === 'drum') {
      // a leaking drum rolling along the floor
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#a83a2a';
      ctx.fillRect(-s.r, -s.r, s.r * 2, s.r * 2);
      ctx.fillStyle = '#e8c83a';
      ctx.fillRect(-s.r, -s.r * 0.4, s.r * 2, s.r * 0.35);
      ctx.strokeStyle = '#5a1a10'; ctx.lineWidth = 2;
      ctx.strokeRect(-s.r, -s.r, s.r * 2, s.r * 2);
      ctx.restore();

    } else if (s.kind === 'jet') {
      if (s.warn) {
        // the pipe rattles before it blows
        ctx.strokeStyle = 'rgba(255,200,60,' + (0.4 + Math.sin(s.spin * 4) * 0.3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(s.x - 12, GROUND_Y - 2); ctx.lineTo(s.x + 12, GROUND_Y - 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(150,220,90,0.85)';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(210,255,150,0.7)';
        ctx.beginPath(); ctx.arc(s.x, s.y + s.r * 0.7, s.r * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3a6b10'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      }

    } else if (s.kind === 'mercury') {
      // heavy silver blob - splits when bombed
      ctx.fillStyle = '#c9c9d8';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6a6a80'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.ellipse(s.x - s.r * 0.3, s.y - s.r * 0.35, s.r * 0.3, s.r * 0.18, -0.6, 0, Math.PI * 2);
      ctx.fill();

    } else if (s.kind === 'wave') {
      // ground shockwave from a slam
      ctx.strokeStyle = 'rgba(255,180,80,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y + 6, s.r + Math.sin(s.spin * 3) * 2, Math.PI, 0);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,120,40,0.5)';
      ctx.beginPath();
      ctx.arc(s.x, s.y + 6, s.r * 0.6, Math.PI, 0);
      ctx.stroke();
      ctx.fillStyle = 'rgba(120,90,40,0.5)';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(s.x - 6 + i * 6, s.y + 2 - (i % 2) * 4, 3, 3);
      }
    } else {
      // toxic blob
      ctx.fillStyle = 'rgba(120,200,40,0.9)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3a6b10'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(200,255,120,0.9)';
      ctx.beginPath(); ctx.arc(s.x - 3, s.y - 3, s.r * 0.35, 0, Math.PI*2); ctx.fill();
    }
  }
}

// Boss helpers reuse the level enemy art.
function drawBossMinions() {
  const saved = enemies;
  enemies = bossActiveEnemies;
  drawEnemies();
  enemies = saved;
}

function drawVillainScene() {
  // arena floor
  ctx.fillStyle = '#4a3a4a';
  ctx.fillRect(0, GROUND_Y, W, 60);
  ctx.fillStyle = '#2a1f2a';
  ctx.fillRect(0, GROUND_Y, W, 6);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = 'rgba(120,90,20,0.5)';
    ctx.beginPath();
    ctx.ellipse(70 + i * 130, GROUND_Y + 16, 34, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // what the boss is standing on says what they do
  const d = (villain && villain.def) || bossDef(level);
  for (let i = 0; i < 3; i++) {
    const bx = 150 + i * 260;
    if (d.n === 1) {                       // rubbish sacks
      ctx.fillStyle = '#2f2f2f';
      ctx.beginPath();
      ctx.ellipse(bx + 30, GROUND_Y - 8, 30, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(bx + 24, GROUND_Y - 20, 12, 8);
    } else if (d.n === 2 || d.n === 5) {   // stacked drums
      ctx.fillStyle = '#a83a2a';
      ctx.fillRect(bx + 8, GROUND_Y - 26, 22, 26);
      ctx.fillRect(bx + 34, GROUND_Y - 20, 22, 20);
      ctx.fillStyle = '#5a1a10';
      ctx.fillRect(bx + 8, GROUND_Y - 20, 22, 3);
      ctx.fillRect(bx + 34, GROUND_Y - 15, 22, 3);
    } else if (d.n === 3 || d.n === 6) {   // sludge pools
      ctx.fillStyle = 'rgba(110,150,40,0.75)';
      ctx.beginPath();
      ctx.ellipse(bx + 30, GROUND_Y + 4, 42, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (d.n === 4 || d.n === 7) {   // crates and pipes
      ctx.fillStyle = '#5a5a66';
      ctx.fillRect(bx + 10, GROUND_Y - 22, 44, 22);
      ctx.strokeStyle = '#33333c'; ctx.lineWidth = 2;
      ctx.strokeRect(bx + 10, GROUND_Y - 22, 44, 22);
      ctx.beginPath();
      ctx.moveTo(bx + 10, GROUND_Y - 22); ctx.lineTo(bx + 54, GROUND_Y);
      ctx.stroke();
    } else {                                // the tycoon's money
      ctx.fillStyle = '#2f7a3f';
      ctx.fillRect(bx, GROUND_Y - 10, 60, 10);
      ctx.fillStyle = '#3d9b52';
      ctx.fillRect(bx + 6, GROUND_Y - 16, 48, 8);
      ctx.fillStyle = '#1d5a2c';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('$$$', bx + 20, GROUND_Y - 3);
    }
  }

  // arena platforms
  const arena = [
    { x: 120, y: 330, w: 110, h: 16 },
    { x: 570, y: 330, w: 110, h: 16 },
    { x: 345, y: 240, w: 110, h: 16 },
  ];
  for (const p of arena) {
    ctx.fillStyle = '#6a5a6a';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#3a2f3a'; ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  }

  // SLUDGE TIDE floods the arena floor - drawn under everyone so you can
  // still see where you are standing.
  if (villain && villain.tide > 0) {
    const t = Date.now() * 0.006;
    ctx.fillStyle = 'rgba(110,150,40,0.75)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 4);
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, GROUND_Y - 10 + Math.sin(t + x * 0.03) * 4);
    }
    ctx.lineTo(W, GROUND_Y + 60); ctx.lineTo(0, GROUND_Y + 60);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(190,230,120,0.5)';
    for (let x = 0; x <= W; x += 60) {
      ctx.fillRect(x + Math.sin(t + x) * 6, GROUND_Y - 12, 14, 3);
    }
  }

  // the DRONE MARSHAL's targeting beam, before and as it fires
  if (villain && villain.laserAim) {
    const a = 0.25 + Math.sin(Date.now() * 0.03) * 0.2;
    ctx.strokeStyle = 'rgba(255,60,60,' + a + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(villain.laserAim.x, villain.y + villain.h);
    ctx.lineTo(villain.laserAim.x, GROUND_Y);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,60,60,' + (a + 0.2) + ')';
    ctx.fillRect(villain.laserAim.x - 13, GROUND_Y - 3, 26, 3);
  }
  if (villain && villain.laserFire > 0) {
    ctx.fillStyle = 'rgba(255,90,90,0.85)';
    ctx.fillRect(villain.lastLaserX - 9, 0, 18, GROUND_Y);
  }

  drawBossMinions();
  drawVillain();
  drawVillainShots();

  // SMOG GENERAL's cloud sits on top of everything, hiding the arena
  if (villain && villain.smog > 0) {
    const fade = Math.min(1, villain.smog / 60);
    const t = Date.now() * 0.0008;
    ctx.save();
    ctx.globalAlpha = 0.55 * fade;
    ctx.fillStyle = '#6a6a72';
    for (let i = 0; i < 7; i++) {
      const cx = ((i * 137 + t * 220) % (W + 200)) - 100;
      ctx.beginPath();
      ctx.ellipse(cx, 120 + Math.sin(t * 3 + i) * 40, 130, 62, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.32 * fade;
    ctx.fillStyle = '#55555c';
    ctx.fillRect(0, 0, W, GROUND_Y);
    ctx.restore();
  }
}

function drawGoal() {
  // treatment plant portal
  ctx.fillStyle = '#4af';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.fillStyle = '#28d';
  ctx.fillRect(goal.x - 10, goal.y, goal.w + 20, 20);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('BOSS', goal.x + 5, goal.y - 8);
  ctx.fillStyle = '#8cf';
  for (let i = 0; i < 4; i++) {
    const t = (Date.now() * 0.003 + i * 0.4) % 1;
    ctx.globalAlpha = 1 - t;
    ctx.fillRect(goal.x + 8, goal.y + 30 + t * 80, 24, 4);
  }
  ctx.globalAlpha = 1;
}

function drawJerry() {
  const j = jerry;
  if (j.invuln > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

  const scale = j.powered ? 1.25 : 1;
  const dw = j.w * scale, dh = j.h * scale;
  const px = j.x + (j.w - dw) / 2;
  const py = j.y + (j.h - dh);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px + dw/2, py + dh + 3, dw/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // droplet body
  ctx.fillStyle = j.powered ? '#3ac0ff' : '#4a9fff';
  ctx.beginPath();
  ctx.moveTo(px + dw/2, py);
  ctx.bezierCurveTo(px + dw*1.05, py + dh*0.3, px + dw*1.05, py + dh*0.9, px + dw/2, py + dh);
  ctx.bezierCurveTo(px - dw*0.05, py + dh*0.9, px - dw*0.05, py + dh*0.3, px + dw/2, py);
  ctx.fill();

  // outline
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();

  // highlight
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + dw*0.32, py + dh*0.38, dw*0.11, dh*0.16, 0, 0, Math.PI*2);
  ctx.fill();

  // eyes
  const eyeY = py + dh * 0.55;
  const eyeShift = j.facing > 0 ? 1 : -1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + dw*0.35, eyeY, 5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65, eyeY, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + dw*0.35 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.fill();

  // smile
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + dw/2, py + dh*0.75, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // powered aura
  if (j.powered) {
    ctx.strokeStyle = `rgba(255,255,100,${0.4 + Math.sin(Date.now()*0.015)*0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + dw/2, py + dh/2, dw*0.75, 0, Math.PI*2);
    ctx.stroke();
  }

  // bomb indicator
  if (j.hasBomb) {
    const bx = px + dw + 6, by = py + 4;
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(bx, by, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('X', bx - 3, by + 3);
  }
}

function drawBombs() {
  for (const b of bombs) {
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#28d';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#e8f4ff';
    ctx.beginPath();
    ctx.arc(b.x - 2, b.y - 2, 2.5, 0, Math.PI*2);
    ctx.fill();
    // trail
    ctx.fillStyle = 'rgba(74,175,255,0.4)';
    ctx.beginPath();
    ctx.arc(b.x - b.vx*0.5, b.y - b.vy*0.5, b.r*0.7, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// Checkpoint flags: grey until reached, then green and waving.
function drawCheckpoints() {
  for (const c of checkpoints) {
    const poleTop = GROUND_Y - 62;
    ctx.fillStyle = '#8a8a92';
    ctx.fillRect(c.x + 12, poleTop, 4, 62);
    ctx.fillStyle = '#6a6a72';
    ctx.fillRect(c.x + 6, GROUND_Y - 4, 16, 4);
    const wave = c.taken ? Math.sin(Date.now() * 0.006) * 3 : 0;
    ctx.fillStyle = c.taken ? '#3ad07a' : '#5a6068';
    ctx.beginPath();
    ctx.moveTo(c.x + 16, poleTop + 2);
    ctx.lineTo(c.x + 40 + wave, poleTop + 10);
    ctx.lineTo(c.x + 16, poleTop + 20);
    ctx.closePath();
    ctx.fill();
    if (c.taken) {
      ctx.strokeStyle = 'rgba(58,208,122,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x + 14, poleTop + 11, 16 + Math.sin(Date.now() * 0.004) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// Score popups that rise from whatever you just destroyed.
function drawFloatText() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px monospace';
  for (const f of floatText) {
    ctx.globalAlpha = Math.min(1, f.life / 25);
    ctx.fillStyle = '#000';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, 36);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, W, 36);

  // Laid out left to right in fixed slots so nothing can overlap:
  //   15  name | 100 score | 250 lives | 430 power | 590 timer | right: level
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('◆ JERRY', 15, 23);

  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + score, 100, 23);

  ctx.fillText('LIVES', 250, 23);
  const maxPips = 5;
  for (let i = 0; i < Math.min(lives, maxPips); i++) {
    drawMiniDroplet(316 + i * 19, 15);
  }
  if (lives > maxPips) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('+' + (lives - maxPips), 316 + maxPips * 19, 23);
  }

  // Bomb slot. Only worth space once bombs are actually in play: before that
  // it says what to do to earn them, and once armed it only appears when there
  // is something to say - ready, or recharging.
  ctx.font = 'bold 13px monospace';
  if (jerry.stage < 2) {
    ctx.fillStyle = '#789';
    ctx.fillText(jerry.stage === 0 ? 'HIT ? BLOCKS' : 'BIG! ONE MORE ?', 448, 23);
  } else if (jerry.hasBomb) {
    ctx.fillStyle = hasPower('overdrive') ? '#f9a'
      : hasPower('rapid') ? '#ff8' : '#4af';
    ctx.fillText('[X] BOMB', 448, 23);
  } else if (jerry.bombCooldown > 0) {
    // recharging - show how close it is instead of a bare "..."
    const total = bombCooldownFrames();
    const done = Math.max(0, 1 - jerry.bombCooldown / total);
    ctx.fillStyle = '#567';
    ctx.fillText('[X]', 448, 23);
    ctx.fillStyle = 'rgba(74,175,255,0.25)';
    ctx.fillRect(482, 14, 54, 10);
    ctx.fillStyle = '#4af';
    ctx.fillRect(482, 14, 54 * done, 10);
  }

  // run timer - this is what settles a tied score
  if (runStartedAt) {
    const ms = scoreSubmitted ? runDurationMs : Date.now() - runStartedAt;
    ctx.fillStyle = '#9fd';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(fmtTime(ms), 590, 23);
  }

  // level number and name, hard right, clear of the timer
  ctx.textAlign = 'right';
  if (gameState === 'villain') {
    ctx.fillStyle = '#f88';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(level >= FINAL_LEVEL ? 'FINAL BOSS' : 'BOSS ' + level + '/' + FINAL_LEVEL,
                 W - 15, 23);
  } else {
    const d = levelData || levelDef(level);
    ctx.fillStyle = '#8bc';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('LEVEL ' + level + '/' + FINAL_LEVEL, W - 15, 15);
    ctx.fillStyle = '#7a93aa';
    ctx.font = '9px monospace';
    ctx.fillText(d.name, W - 15, 28);
  }
  ctx.textAlign = 'left';

  // combo meter - the bar drains, so you can see how long you have left
  if (combo > 1) {
    const mult = Math.min(8, combo);
    const cx = W / 2 - 54;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(cx, 40, 108, 22);
    ctx.strokeStyle = mult >= 5 ? '#ff8' : '#8f8';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx, 40, 108, 22);
    ctx.fillStyle = mult >= 5 ? '#ff8' : '#8f8';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('COMBO x' + mult, cx + 8, 56);
    // draining timer bar
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(cx, 62, 108 * (comboTimer / 150), 3);
  }

  // second row: unlocked powers, and the boss health when fighting
  if (gameState === 'villain' && villain) {
    const bd = villain.def || bossDef(level);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(bd.name + '  ' + villain.hp + '/' + villain.maxHp, 15, 55);
    ctx.fillStyle = '#a67';
    ctx.font = '10px monospace';
    ctx.fillText(bd.title, 15, 68);
  } else {
    drawPowerStrip(15, 46);
  }

  // shield bubble indicator
  if (hasPower('shield')) {
    const ready = jerry.shield;
    ctx.strokeStyle = ready ? '#6ef' : 'rgba(110,238,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W - 30, 55, 9, 0, Math.PI * 2);
    ctx.stroke();
    if (!ready) {
      ctx.fillStyle = '#456';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(jerry.shieldCd / 60) + 's', W - 30, 58);
      ctx.textAlign = 'left';
    }
  }
}

// Little chips showing which powers are active this run.
function drawPowerStrip(x, y) {
  const order = ['bomb', 'rapid', 'triple', 'swift', 'shield', 'pierce', 'blast', 'overdrive'];
  const icons = { bomb: 'B', rapid: 'R', triple: '3', swift: '>>', shield: 'S', pierce: 'P', blast: '*', overdrive: 'OD' };
  let cx = x;
  ctx.font = 'bold 10px monospace';
  for (const p of order) {
    if (!jerry.powers.has(p)) continue;
    const label = icons[p];
    const w = label.length > 1 ? 24 : 18;
    ctx.fillStyle = 'rgba(74,175,255,0.22)';
    ctx.fillRect(cx, y, w, 15);
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx, y, w, 15);
    ctx.fillStyle = '#cfe9ff';
    ctx.fillText(label, cx + (w - label.length * 6) / 2, y + 11);
    cx += w + 4;
  }
}

function drawMiniDroplet(x, y) {
  ctx.fillStyle = '#4af';
  ctx.beginPath();
  ctx.moveTo(x, y - 6);
  ctx.bezierCurveTo(x + 7, y - 2, x + 7, y + 6, x, y + 8);
  ctx.bezierCurveTo(x - 7, y + 6, x - 7, y - 2, x, y - 6);
  ctx.fill();
}

function drawPopup() {
  // Sits just under the HUD at the top: on a phone the bottom of the screen is
  // where the thumbs and the ground are, so text down there gets missed.
  const pad = 18, lh = 24;
  const boxX = 30, boxW = W - 60;
  const textW = boxW - pad * 2;

  ctx.font = 'bold 18px monospace';
  const lines = wrapLines(popup.text, textW);
  const boxH = pad + 22 + lines.length * lh + pad - 8;
  // clear the HUD, and the extra status line the boss fights add
  const boxY = gameState === 'villain' ? 66 : 46;

  // drop shadow so the panel separates from the sky behind it
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(boxX + 4, boxY + 4, boxW, boxH);

  ctx.fillStyle = 'rgba(0,12,28,0.95)';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 3;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('◆ DID YOU KNOW?', boxX + pad, boxY + pad + 6);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  lines.forEach((l, i) => {
    ctx.fillText(l, boxX + pad, boxY + pad + 30 + i * lh);
  });
}

// Splits text into lines that fit maxW. Call with the final font already set.
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line !== '') {
      lines.push(line.trim());
      line = w + ' ';
    } else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function wrapText(text, x, y, maxW, lh) {
  const lines = wrapLines(text, maxW);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
  return lines.length * lh;
}

// 1..8 are the stages, 9 means they reached the Greedy Tycoon.
function levelLabel(n) {
  const v = Number(n) || 1;
  return v > FINAL_LEVEL ? 'Final Boss' : 'Level ' + Math.min(v, FINAL_LEVEL);
}

// A circular badge with the player's initial. The colour is derived from the
// name, so the same person always gets the same one.
const AVATAR_COLOURS = [
  ['#2f6fd0', '#8cc4ff'], ['#1f9a76', '#7ff0cd'], ['#b8543f', '#ffb59f'],
  ['#7a4fc0', '#d0b6ff'], ['#b8892a', '#ffd98a'], ['#2b8fa8', '#95e6f7'],
  ['#a83f74', '#ffa7cf'], ['#4a7a2a', '#c1f08c'],
];

function avatarColour(name) {
  let h = 0;
  const s = String(name || '?');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLOURS[h % AVATAR_COLOURS.length];
}

// First letter or digit of the name; falls back to '?' for odd input.
function avatarInitial(name) {
  const m = String(name || '').match(/[a-z0-9]/i);
  return m ? m[0].toUpperCase() : '?';
}

function drawAvatar(cx, cy, r, name, highlight) {
  const [bg, fg] = avatarColour(name);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.lineWidth = highlight ? 2 : 1.5;
  ctx.strokeStyle = highlight ? '#fff' : 'rgba(255,255,255,0.35)';
  ctx.stroke();
  // subtle top highlight so it reads as a badge, not a flat dot
  ctx.beginPath();
  ctx.arc(cx - r * 0.28, cy - r * 0.32, r * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fill();

  ctx.fillStyle = fg;
  ctx.font = 'bold ' + Math.round(r * 1.5) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(avatarInitial(name), cx, cy + r * 0.08);
  ctx.restore();
}

function drawLeaderboard() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04182f');
  g.addColorStop(1, '#0a3a63');
  ctx.fillStyle = g;
  ctx.fillRect(-VIEW_X - 2, 0, VIEW_W + 4, H);

  // faint moving water bands for depth, across the full view
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = `rgba(74,175,255,${0.04 + i * 0.02})`;
    ctx.beginPath();
    ctx.moveTo(-VIEW_X, H);
    for (let x = -VIEW_X; x <= VIEW_W - VIEW_X; x += 16) {
      ctx.lineTo(x, H - 40 - i * 26 + Math.sin((x + Date.now() * 0.0006 + i * 2) * 0.012) * 9);
    }
    ctx.lineTo(VIEW_W - VIEW_X, H); ctx.closePath(); ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd94a';
  ctx.font = 'bold 28px monospace';
  ctx.fillText('★ LEADERBOARD ★', W / 2, 40);
  ctx.fillStyle = '#6a8fb0';
  ctx.font = '10px monospace';
  // while the event runs, say what the top spot is worth
  if (eventLive()) {
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('🍕 RANK #1 WINS A FREE PIZZA OR BURGER · TILL ' + EVENT.endsLabel +
                 '  ·  ties go to the faster run', W / 2, 56);
  } else {
    ctx.fillText('ties are broken by the faster run', W / 2, 56);
  }

  // ---- your own card ----
  const cardY = 66;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(40, cardY, W - 80, 56);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 2;
  ctx.strokeRect(40, cardY, W - 80, 56);

  ctx.textAlign = 'left';
  // your own badge, larger than the ones in the table
  drawAvatar(74, cardY + 28, 17, profile.name, true);
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 15px monospace';
  ctx.fillText(profile.name || 'PLAYER', 100, cardY + 21);
  ctx.fillStyle = '#cfe9ff';
  ctx.font = '12px monospace';
  ctx.fillText('BEST ' + profile.bestScore, 100, cardY + 41);
  ctx.fillText('GAMES ' + profile.gamesPlayed, 216, cardY + 41);
  ctx.fillText('REACHED ' + levelLabel(profile.bestLevel), 326, cardY + 41);
  if (profile.totalTimeMs) {
    // total time across every run, not just the best one
    ctx.fillStyle = '#9fd';
    ctx.fillText('PLAYED ' + fmtLongTime(profile.totalTimeMs), 486, cardY + 41);
  }
  if (profile.rank) {
    // kept clear of the sound button that floats over the top-right corner
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('#' + profile.rank, W - 112, cardY + 28);
    ctx.fillStyle = '#8bc';
    ctx.font = '11px monospace';
    ctx.fillText('of ' + profile.totalPlayers, W - 112, cardY + 44);
  }

  // ---- ranking table ----
  const tableR = W - 214;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7e9fbb';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('#',      56,  142);
  ctx.fillText('PLAYER', 108, 142);
  ctx.fillText('SCORE',  262, 142);
  ctx.fillText('BEST',   344, 142);   // the run that earned the rank
  ctx.fillText('PLAYED', 412, 142);   // every run added together
  ctx.fillText('LEVEL',  492, 142);
  ctx.strokeStyle = 'rgba(74,175,255,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(50, 148); ctx.lineTo(tableR, 148); ctx.stroke();

  // Every player is listed, not just the first eleven - the table scrolls
  // inside a fixed window so the ones further down can still be read.
  const rows = leaderboard.rows;
  if (!rows.length) {
    ctx.fillStyle = '#8bc';
    ctx.font = '13px monospace';
    ctx.fillText(leaderboard.status === 'offline'
      ? 'No scores on this device yet. Play a game!'
      : 'No scores yet. Be the first!', 56, 178);
  }

  boardScrollMax = Math.max(0, rows.length * BOARD_ROW_H - BOARD_VIEW_H);
  boardScroll = Math.max(0, Math.min(boardScrollMax, boardScroll));

  const MEDAL = ['#ffd94a', '#d8d8d8', '#cd8b4a'];
  const NAME_X = 108;          // names shift right to make room for the avatar

  ctx.save();
  ctx.beginPath();
  ctx.rect(50, BOARD_VIEW_Y, tableR - 50, BOARD_VIEW_H);
  ctx.clip();

  rows.forEach((r, i) => {
    const y = 168 + i * BOARD_ROW_H - boardScroll;
    // skip anything scrolled out of the window
    if (y < BOARD_VIEW_Y - BOARD_ROW_H || y > BOARD_VIEW_Y + BOARD_VIEW_H + BOARD_ROW_H) return;
    // offline rows are grouped by name, so match on either
    const me = r.id === profile.id || (!!profile.name && r.name === profile.name);
    if (me) {
      ctx.fillStyle = 'rgba(74,175,255,0.20)';
      ctx.fillRect(50, y - 13, tableR - 50, 21);
      ctx.fillStyle = '#4af';
      ctx.fillRect(50, y - 13, 3, 21);
    }
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = MEDAL[i] || '#7e9fbb';
    ctx.fillText(i < 3 ? ['1', '2', '3'][i] : String(r.rank), 56, y);
    drawAvatar(88, y - 5, 9, r.name, me);
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = me ? '#fff' : '#cfe9ff';
    ctx.fillText(r.name, NAME_X, y);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(r.score), 262, y);
    // the deciding number when scores are level
    ctx.fillStyle = '#9fd';
    ctx.font = '12px monospace';
    ctx.fillText(fmtTime(r.durationMs), 344, y);
    // total across every run this player has finished
    ctx.fillStyle = '#7fc4a0';
    ctx.font = '11px monospace';
    ctx.fillText(fmtLongTime(r.totalTimeMs || r.durationMs), 412, y);
    ctx.fillStyle = '#7e9fbb';
    ctx.font = '10px monospace';
    ctx.fillText(levelLabel(r.level), 492, y);
    // difficulty the run was set to, so scores can be compared fairly
    if (r.mode && r.mode !== 'normal') {
      ctx.fillStyle = r.mode === 'hard' ? '#f88' : '#8d8';
      ctx.font = 'bold 9px monospace';
      ctx.fillText(r.mode.toUpperCase(), 552, y);
    }
  });
  ctx.restore();

  // ---- scrollbar, only when there is more than one screenful ----
  if (boardScrollMax > 0) {
    const trackX = tableR - 6, trackY = BOARD_VIEW_Y, trackH = BOARD_VIEW_H;
    ctx.fillStyle = 'rgba(74,175,255,0.14)';
    ctx.fillRect(trackX, trackY, 5, trackH);
    const thumbH = Math.max(28, trackH * (BOARD_VIEW_H / (rows.length * BOARD_ROW_H)));
    const thumbY = trackY + (trackH - thumbH) * (boardScroll / boardScrollMax);
    ctx.fillStyle = '#4af';
    ctx.fillRect(trackX, thumbY, 5, thumbH);

    // a nudge that there is more below, until you scroll
    if (boardScroll < boardScrollMax - 1) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8bc';
      ctx.font = '10px monospace';
      ctx.fillText('▼ ' + (rows.length) + ' players - scroll for more',
                   (50 + tableR) / 2, BOARD_VIEW_Y + BOARD_VIEW_H + 14);
      ctx.textAlign = 'left';
    }
  }

  // ---- your recent games ----
  const px = W - 196;
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.fillRect(px - 12, 132, 176, 300);
  ctx.strokeStyle = 'rgba(74,175,255,0.25)';
  ctx.strokeRect(px - 12, 132, 176, 300);
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('YOUR LAST GAMES', px, 152);
  if (!profile.history.length) {
    ctx.fillStyle = '#5d7a94';
    ctx.font = '11px monospace';
    ctx.fillText('No games yet', px, 176);
  }
  profile.history.slice(0, 10).forEach((h, i) => {
    const y = 174 + i * 25;
    ctx.fillStyle = '#cfe9ff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(String(h.score), px, y);
    ctx.fillStyle = '#9fd';
    ctx.font = '10px monospace';
    ctx.fillText(fmtTime(h.durationMs), px + 58, y);
    ctx.fillStyle = '#5d7a94';
    ctx.fillText(levelLabel(h.level), px + 104, y);
  });

  ctx.textAlign = 'center';

  // only worth saying something when scores are NOT being shared
  if (leaderboard.status === 'offline') {
    ctx.fillStyle = '#f88';
    ctx.font = '10px monospace';
    ctx.fillText('this device only - no leaderboard server reachable', W / 2, H - 32);
  }

  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 15px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP TO CONTINUE ◀' : '▶ PRESS ENTER TO CONTINUE ◀', W / 2, H - 12);
  }
  ctx.textAlign = 'left';
}

// ============ EVENT SPLASH ============
// Shown once when the game opens, while the event is running.
function drawPromo() {
  const t = Date.now();

  // warm background so it reads as a celebration, not another game screen
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a1030');
  g.addColorStop(0.55, '#7a2a3a');
  g.addColorStop(1, '#c25a2a');
  ctx.fillStyle = g;
  ctx.fillRect(-VIEW_X - 2, 0, VIEW_W + 4, H);

  // drifting confetti
  for (let i = 0; i < 40; i++) {
    const seed = i * 137.5;
    const x = ((seed * 7) % VIEW_W) - VIEW_X;
    const y = ((t * 0.05 + seed * 3) % (H + 40)) - 20;
    const c = ['#ffd94a', '#ff8a4a', '#8ce0ff', '#fff'][i % 4];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((t * 0.002 + i) % (Math.PI * 2));
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = c;
    ctx.fillRect(-3, -5, 6, 10);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  const pulse = 1 + Math.sin(t * 0.004) * 0.03;
  ctx.textAlign = 'center';

  // ribbon
  ctx.fillStyle = '#ffd94a';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('★  SPECIAL EVENT  ★', W / 2, 56);

  // pizza + burger, drawn rather than emoji so they match the art.
  // Kept out to the sides so the headline does not run over them.
  drawPizzaSlice(W / 2 - 262, 130, 40);
  drawBurger(W / 2 + 262, 130, 40);

  // headline
  ctx.save();
  ctx.translate(W / 2, 132);
  ctx.scale(pulse, pulse);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#4a1020';
  ctx.lineWidth = 4;
  ctx.font = 'bold 30px monospace';
  ctx.strokeText(EVENT.title, 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillText(EVENT.title, 0, 0);
  ctx.restore();

  // what you have to do
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.fillRect(W / 2 - 250, 186, 500, 96);
  ctx.strokeStyle = 'rgba(255,217,74,0.7)';
  ctx.lineWidth = 2;
  ctx.strokeRect(W / 2 - 250, 186, 500, 96);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px monospace';

}

function drawPizzaSlice(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(Date.now() * 0.002) * 0.12);
  // crust
  ctx.fillStyle = '#c98a3a';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.72, r * 0.72);
  ctx.lineTo(-r * 0.72, r * 0.72);
  ctx.closePath();
  ctx.fill();
  // cheese
  ctx.fillStyle = '#f5c34a';
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.82);
  ctx.lineTo(r * 0.58, r * 0.56);
  ctx.lineTo(-r * 0.58, r * 0.56);
  ctx.closePath();
  ctx.fill();
  // pepperoni
  ctx.fillStyle = '#c0392b';
  [[0, -r * 0.3, 5], [-r * 0.22, r * 0.2, 4.5], [r * 0.24, r * 0.24, 4.5]]
    .forEach(([x, y, rr]) => { ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
}

function drawBurger(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy + Math.sin(Date.now() * 0.003) * 3);
  const w = r * 1.5;
  // top bun
  ctx.fillStyle = '#d69a4a';
  ctx.beginPath();
  ctx.ellipse(0, -r * 0.34, w / 2, r * 0.44, 0, Math.PI, 0);
  ctx.fill();
  // sesame
  ctx.fillStyle = '#ffe9c0';
  [[-w * 0.2, -r * 0.5], [0, -r * 0.62], [w * 0.2, -r * 0.5]]
    .forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 2.5, 1.6, 0, 0, Math.PI * 2); ctx.fill(); });
  // lettuce
  ctx.fillStyle = '#6fbf4a';
  ctx.fillRect(-w / 2, -r * 0.34, w, r * 0.16);
  // patty
  ctx.fillStyle = '#7a4a2a';
  ctx.fillRect(-w / 2, -r * 0.18, w, r * 0.28);
  // cheese
  ctx.fillStyle = '#f5c34a';
  ctx.beginPath();
  ctx.moveTo(-w / 2, r * 0.1);
  ctx.lineTo(w / 2, r * 0.1);
  ctx.lineTo(w * 0.36, r * 0.28);
  ctx.lineTo(-w * 0.36, r * 0.28);
  ctx.closePath();
  ctx.fill();
  // bottom bun
  ctx.fillStyle = '#c9883a';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.28, w / 2, r * 0.26, 0, 0, Math.PI);
  ctx.fill();
  ctx.restore();
}

function drawMenu() {
  // backgrounds are drawn across the whole view, not just the 800-wide UI box,
  // so a wide screen has no dark bars down the sides
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a3a70');
  g.addColorStop(0.5, '#1a7abc');
  g.addColorStop(1, '#4ab0e8');
  ctx.fillStyle = g;
  ctx.fillRect(-VIEW_X - 2, 0, VIEW_W + 4, H);

  // decorative water waves at bottom
  for (let layer = 0; layer < 3; layer++) {
    ctx.fillStyle = `rgba(74,175,255,${0.3 + layer * 0.2})`;
    ctx.beginPath();
    ctx.moveTo(-VIEW_X, H);
    for (let x = -VIEW_X; x <= VIEW_W - VIEW_X; x += 10) {
      const y = H - 60 + layer * 20 + Math.sin((x + Date.now() * 0.001 + layer) * 0.02) * 8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VIEW_W - VIEW_X, H);
    ctx.closePath();
    ctx.fill();
  }

  // title. A thick stroke eats into the letters and makes them look blurred,
  // so keep it thin, round the joins, and stroke before filling.
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  const bob = Math.sin(Date.now() * 0.003) * 3;

  ctx.font = 'bold 54px monospace';
  ctx.strokeStyle = '#0a3a70';
  ctx.lineWidth = 3;
  ctx.strokeText('JERRY', W/2, 90 + bob);
  ctx.fillStyle = '#fff';
  ctx.fillText('JERRY', W/2, 90 + bob);

  ctx.font = 'bold 26px monospace';
  ctx.lineWidth = 2.5;
  ctx.strokeText('THE WATER SAVIOUR', W/2, 130 + bob);
  ctx.fillText('THE WATER SAVIOUR', W/2, 130 + bob);

  ctx.font = 'italic 13px monospace';
  ctx.fillStyle = '#c8e8ff';
  ctx.fillText('~ An educational quest to save our rivers ~', W/2, 158);

  // nudge phone players towards landscape, where the view is much bigger
  if (isTouch && window.innerHeight > window.innerWidth) {
    ctx.fillStyle = '#ff8';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('↻ Rotate your phone sideways for a bigger view', W/2, 178);
  }

  // event reminder, so the offer is still visible after the splash is gone
  if (eventLive()) {
    const bw = 400, bx = W/2 - bw/2, by = 186;
    const glow = 0.5 + Math.sin(Date.now() * 0.004) * 0.2;
    ctx.fillStyle = 'rgba(90,30,20,0.75)';
    ctx.fillRect(bx, by, bw, 28);
    ctx.strokeStyle = `rgba(255,217,74,${glow})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 28);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('★ REACH RANK #1 → FREE PIZZA OR BURGER · TILL ' + EVENT.endsLabel + ' ★',
                 W/2, by + 18);
  }

  // preview jerry - skipped when the menu block needs the space
  const jbob = Math.sin(Date.now() * 0.005) * 6;
  const px = W/2 - 20, py = 190 + jbob;
  if (menuLayout().showMascot) {
  ctx.save();
  ctx.fillStyle = '#4a9fff';
  ctx.beginPath();
  ctx.moveTo(px + 20, py);
  ctx.bezierCurveTo(px + 42, py + 12, px + 42, py + 40, px + 20, py + 50);
  ctx.bezierCurveTo(px - 2, py + 40, px - 2, py + 12, px + 20, py);
  ctx.fill();
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + 13, py + 18, 4, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + 13, py + 28, 5, 0, Math.PI*2);
  ctx.arc(px + 27, py + 28, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + 14, py + 29, 2.5, 0, Math.PI*2);
  ctx.arc(px + 28, py + 29, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + 20, py + 38, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  ctx.restore();
  }

  // ---- menu rows ----
  // A real menu instead of a single "press enter": start, level select,
  // difficulty and help, driven by arrows/tap like the pause menu.
  const rows = menuRows();
  // The row count changes once level select unlocks, so the block is measured
  // and placed to fit rather than starting at a fixed y.
  const L = menuLayout();
  const top = L.top;
  rows.forEach((row, i) => {
    const y = top + i * L.step;
    const on = i === menuSel;
    ctx.fillStyle = on ? 'rgba(74,175,255,0.24)' : 'rgba(0,20,40,0.55)';
    ctx.fillRect(W/2 - 170, y - L.rowH + 10, 340, L.rowH);
    ctx.strokeStyle = on ? '#4af' : 'rgba(120,150,180,0.35)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(W/2 - 170, y - L.rowH + 10, 340, L.rowH);
    ctx.fillStyle = on ? '#fff' : '#9fbdd6';
    ctx.font = (on ? 'bold ' : '') + '14px monospace';
    ctx.fillText(row.label, W/2, y);
  });

  // Returning player card, below the menu
  if (profile.id && profile.name) {
    const cardY = L.cardY, cardH = L.cardH;
    ctx.fillStyle = 'rgba(0,10,26,0.55)';
    ctx.fillRect(170, cardY, W - 340, cardH);
    ctx.strokeStyle = 'rgba(255,217,74,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(170, cardY, W - 340, cardH);

    drawAvatar(196, cardY + cardH / 2, 13, profile.name, true);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd94a';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('WELCOME BACK, ' + profile.name + '!', W/2, cardY + 17);
    ctx.fillStyle = '#cfe9ff';
    ctx.font = '10px monospace';
    const bits = ['Best ' + profile.bestScore, profile.gamesPlayed + ' games'];
    if (profile.rank) bits.push('Rank #' + profile.rank + '/' + profile.totalPlayers);
    ctx.fillText(bits.join('   ·   '), W/2, cardY + 31);
  }

  ctx.fillStyle = '#567';
  ctx.font = '10px monospace';
  ctx.fillText(isTouch ? 'tap a choice' : '↑ ↓ to choose  ·  ENTER to pick', W/2, H - 12);
  ctx.textAlign = 'left';
}

// ============ LEVEL SELECT ============
function drawLevelSelect() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04182f');
  g.addColorStop(1, '#0a3a63');
  ctx.fillStyle = g;
  ctx.fillRect(-VIEW_X - 2, 0, VIEW_W + 4, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4af';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('◆ LEVEL SELECT ◆', W / 2, 52);
  ctx.fillStyle = '#7e9fbb';
  ctx.font = '11px monospace';
  ctx.fillText('you start with the powers earned up to that level', W / 2, 72);

  // 4 x 2 grid of the eight levels
  const cols = 4, cw = 150, ch = 84, gapX = 14, gapY = 16;
  const gridW = cols * cw + (cols - 1) * gapX;
  const x0 = W / 2 - gridW / 2, y0 = 100;
  for (let i = 0; i < FINAL_LEVEL; i++) {
    const n = i + 1;
    const cx = x0 + (i % cols) * (cw + gapX);
    const cy = y0 + Math.floor(i / cols) * (ch + gapY);
    const locked = n > unlockedLevel;
    const on = n === levelSel;

    ctx.fillStyle = locked ? 'rgba(20,30,45,0.6)'
                   : on ? 'rgba(74,175,255,0.26)' : 'rgba(0,20,40,0.6)';
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = locked ? 'rgba(90,110,130,0.4)' : on ? '#4af' : 'rgba(120,150,180,0.4)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(cx, cy, cw, ch);

    ctx.textAlign = 'center';
    if (locked) {
      ctx.fillStyle = '#5d7a94';
      ctx.font = 'bold 20px monospace';
      ctx.fillText('🔒', cx + cw / 2, cy + 38);
      ctx.font = '10px monospace';
      ctx.fillText('LEVEL ' + n, cx + cw / 2, cy + 60);
    } else {
      ctx.fillStyle = on ? '#fff' : '#cfe9ff';
      ctx.font = 'bold 16px monospace';
      ctx.fillText('LEVEL ' + n, cx + cw / 2, cy + 26);
      ctx.fillStyle = '#8bc';
      ctx.font = '9px monospace';
      ctx.fillText(levelDef(n).name, cx + cw / 2, cy + 44);
      const bd = bossDef(n);
      ctx.fillStyle = '#f88';
      ctx.font = '9px monospace';
      ctx.fillText(bd.name, cx + cw / 2, cy + 62);
      ctx.fillStyle = '#ffd94a';
      ctx.font = '9px monospace';
      ctx.fillText((POWER_INFO[levelDef(n).power] || {}).label || '', cx + cw / 2, cy + 76);
    }
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 14px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP A LEVEL TO PLAY ◀'
                         : '← → to choose  ·  ENTER to play  ·  ESC to go back',
                 W / 2, H - 26);
  }
  ctx.textAlign = 'left';
}

function drawWin() {

  for (let i = 0; i < drops; i++) {
    const t = (Date.now() * 0.001 + i * 0.3) % 3;
    const x = ((i * 37) % VIEW_W) - VIEW_X;
    const y = t * H / 3;
    ctx.fillStyle = 'rgba(200,232,255,0.8)';

    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fill();

        ? 'Top score to beat: ' + lead.score + ' by ' + lead.name
