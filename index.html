<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001830">
<title>Jerry the Water Saviour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(#000, #001830);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 6px;
  }
  h1 { color: #4af; margin-bottom: 6px; font-size: 14px; letter-spacing: 2px; text-align: center; }
  #stage {
    position: relative;
    line-height: 0;
    max-width: 100%;
  }
  #game {
    display: block;
    width: 100%;
    height: auto;
    border: 3px solid #4af;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.6);
    image-rendering: pixelated;
    background: #6bd6ff;
    touch-action: none;
  }
  #info {
    margin-top: 10px;
    font-size: 12px;
    color: #8bc;
    text-align: center;
    max-width: 800px;
  }
  kbd {
    background: #223;
    border: 1px solid #4af;
    padding: 2px 6px;
    border-radius: 3px;
    color: #4af;
    font-size: 11px;
  }

  /* ===== Touch controls (mobile / tablet) ===== */
  #touch {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  body.touch-mode #touch { display: flex; }
  body.touch-mode #info { display: none; }
  /* keep the play area vertically centred in the space above the buttons */
  body.touch-mode { justify-content: center; padding-bottom: 110px; }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch-mode { padding-bottom: 0; }
  }

  .pad { display: flex; gap: 12px; pointer-events: auto; }
  .btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.55);
    border: 2px solid rgba(74, 175, 255, 0.85);
    color: #cfe9ff;
    font-family: inherit;
    font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    touch-action: none;
    transition: transform .06s, background .06s;
  }
  .btn.small { width: 58px; height: 58px; font-size: 16px; }
  .btn.jump { background: rgba(20, 90, 60, 0.55); border-color: rgba(80, 230, 160, 0.9); color: #d6ffe9; }
  .btn.bomb { background: rgba(15, 60, 110, 0.6); border-color: rgba(120, 200, 255, 0.95); color: #eaf6ff; }
  .btn.active { transform: scale(0.9); background: rgba(74, 175, 255, 0.65); color: #fff; }

  @media (max-width: 900px) {
    h1 { font-size: 12px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    h1 { display: none; }
    .btn { width: 56px; height: 56px; font-size: 20px; }
    .btn.small { width: 50px; height: 50px; font-size: 14px; }
  }
</style>
</head>
<body>
<h1>◆ JERRY THE WATER SAVIOUR ◆</h1>
<div id="stage">
  <canvas id="game" width="800" height="500"></canvas>
</div>
<div id="info">
  <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move &nbsp;•&nbsp;
  <kbd>SPACE</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> to jump &nbsp;•&nbsp;
  <kbd>X</kbd> to throw water bomb &nbsp;•&nbsp;
  <kbd>R</kbd> to restart
</div>

<div id="touch">
  <div class="pad">
    <div class="btn" data-key="arrowleft">◀</div>
    <div class="btn" data-key="arrowright">▶</div>
  </div>
  <div class="pad">
    <div class="btn small bomb" data-key="x">BOMB</div>
    <div class="btn jump" data-key=" ">▲</div>
  </div>
</div>

<script>
// ============ SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ============ TOUCH / RESPONSIVE ============
// maxTouchPoints alone is unreliable (desktop Chrome reports 10), so require a
// coarse/hoverless pointer — that is what actually separates phones from mice.
const isTouch = matchMedia('(pointer: coarse)').matches ||
                matchMedia('(hover: none)').matches;
if (isTouch) document.body.classList.add('touch-mode');

// Scale the canvas to fit the viewport while keeping the 800x500 aspect ratio.
// The game keeps drawing in 800x500 space; CSS just stretches the result.
function fitCanvas() {
  const stage = document.getElementById('stage');
  const title = document.querySelector('h1');
  const info = document.getElementById('info');
  const chrome = (title && title.offsetParent ? title.offsetHeight + 6 : 0) +
                 (info && info.offsetParent ? info.offsetHeight + 10 : 0);
  // In portrait the buttons sit below the game, so reserve their height.
  // In landscape they float over the empty side areas, so reserve nothing.
  const landscape = window.innerWidth > window.innerHeight;
  // Landscape buttons float over the sides, but still keep a small margin so
  // they never sit on top of the HUD/action area at the bottom of the canvas.
  const reserved = isTouch ? (landscape ? 30 : 110) : 24;
  const availW = window.innerWidth - 12;
  const availH = window.innerHeight - chrome - reserved;
  const scale = Math.max(0.2, Math.min(availW / W, availH / H));
  stage.style.width = Math.floor(W * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
fitCanvas();

// On-screen buttons drive the same `keys` map the keyboard uses.
document.querySelectorAll('#touch .btn').forEach(btn => {
  const key = btn.dataset.key;
  const press = e => {
    e.preventDefault();
    keys[key] = true;
    btn.classList.add('active');
  };
  const release = e => {
    e.preventDefault();
    keys[key] = false;
    btn.classList.remove('active');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

// Tap the canvas to start / restart on menu, game over and win screens.
// A tap can begin and end inside a single frame, so latch it and let the
// game loop consume the flag instead of sampling a key that is already up.
let tapConfirm = false;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  tapConfirm = true;
});
// Block double-tap zoom / long-press menus over the play area.
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============ CONSTANTS ============
const GRAVITY = 0.55;
const JUMP_POWER = -12.5;
const MOVE_SPEED = 3.8;
const GROUND_Y = 440;
const LEVEL_END = 3200;

// ============ STATE ============
let gameState = 'menu'; // menu, playing, boss, gameover, win
let score = 0;
let lives = 3;
let camera = { x: 0 };
let popup = null;
let bombs = [];
let particles = [];
let bossActiveEnemies = [];

const jerry = {
  x: 100, y: 300, vx: 0, vy: 0,
  w: 28, h: 36,
  onGround: false,
  powered: false,
  hasBomb: false,
  facing: 1,
  invuln: 0,
  _xheld: false
};

// ============ LEVEL DATA ============
const platforms = [
  { x: 0,    y: GROUND_Y, w: 600, h: 60, kind: 'ground' },
  { x: 700,  y: GROUND_Y, w: 500, h: 60, kind: 'ground' },
  { x: 1300, y: GROUND_Y, w: 400, h: 60, kind: 'ground' },
  { x: 1800, y: GROUND_Y, w: 500, h: 60, kind: 'ground' },
  { x: 2400, y: GROUND_Y, w: 850, h: 60, kind: 'ground' },
  { x: 340,  y: 340, w: 110, h: 18, kind: 'brick' },
  { x: 900,  y: 320, w: 130, h: 18, kind: 'brick' },
  { x: 1380, y: 300, w: 110, h: 18, kind: 'brick' },
  { x: 1540, y: 220, w: 90,  h: 18, kind: 'brick' },
  { x: 2000, y: 320, w: 160, h: 18, kind: 'brick' },
  { x: 2530, y: 300, w: 110, h: 18, kind: 'brick' },
];

let blocks = [];
let enemies = [];
let signs = [];

function resetLevel() {
  blocks = [
    { x: 250, y: 300, w: 40, h: 40, type: 'filter',   hit: false },
    { x: 450, y: 200, w: 40, h: 40, type: 'water',    hit: false },
    { x: 950, y: 240, w: 40, h: 40, type: 'chlorine', hit: false },
    { x: 1420, y: 220, w: 40, h: 40, type: 'water',   hit: false },
    { x: 1560, y: 140, w: 40, h: 40, type: 'uv',      hit: false },
    { x: 2050, y: 240, w: 40, h: 40, type: 'water',   hit: false },
    { x: 2560, y: 220, w: 40, h: 40, type: 'filter',  hit: false },
    { x: 2800, y: 340, w: 40, h: 40, type: 'uv',      hit: false },
  ];
  enemies = [
    { x: 480, y: 410, w: 30, h: 30, vx: -1.2, type: 'trash', alive: true, minX: 300,  maxX: 590 },
    { x: 900, y: 410, w: 30, h: 30, vx: -1.2, type: 'trash', alive: true, minX: 720,  maxX: 1180 },
    { x: 1500,y: 410, w: 30, h: 30, vx:  1.2, type: 'trash', alive: true, minX: 1310, maxX: 1680 },
    { x: 2100,y: 410, w: 30, h: 30, vx: -1.2, type: 'trash', alive: true, minX: 1820, maxX: 2280 },
    { x: 2700,y: 400, w: 40, h: 40, vx: 0,    type: 'drum',  alive: true },
    { x: 3000,y: 410, w: 30, h: 30, vx: -1.5, type: 'trash', alive: true, minX: 2450, maxX: 3150 },
  ];
  signs = [
    { x: 150,  y: GROUND_Y - 50, text: "Help Jerry save the rivers! Break blocks from below for powers." },
    { x: 810,  y: GROUND_Y - 50, text: "FILTRATION: Sand and gravel filters trap solid particles from wastewater." },
    { x: 1350, y: GROUND_Y - 50, text: "SEWAGE contains harmful microbes and chemicals. Never touch it directly!" },
    { x: 1930, y: GROUND_Y - 50, text: "Industries dump waste into rivers. Together we must hold them accountable!" },
  ];
  signs.forEach(s => s.shown = false);
}

const hazards = [
  { x: 600, y: GROUND_Y, w: 100, h: 60 },
  { x: 1200, y: GROUND_Y, w: 100, h: 60 },
  { x: 1700, y: GROUND_Y, w: 100, h: 60 },
  { x: 2300, y: GROUND_Y, w: 100, h: 60 },
];

const goal = { x: LEVEL_END - 150, y: GROUND_Y - 130, w: 40, h: 130 };

let boss = null;

// ============ HELPERS ============
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function eduText(type) {
  return ({
    filter:   'FILTRATION: Sand & carbon filters trap dirt and solids. First step in water treatment!',
    chlorine: 'CHLORINATION: Chlorine kills bacteria & viruses. Used in most city water supplies.',
    uv:       'UV DISINFECTION: Ultraviolet light kills germs without any chemicals. Powerful!',
    water:    'Clean water collected! Every drop matters. +50 points',
  })[type];
}

function showPopup(text) { popup = { text, timer: 200 }; }

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 6 - 1,
      color, life: 45, size: 2 + Math.random() * 4
    });
  }
}

function damagePlayer() {
  if (jerry.invuln > 0) return;
  if (jerry.powered) {
    jerry.powered = false;
    jerry.invuln = 90;
    spawnParticles(jerry.x + 14, jerry.y + 18, '#fff', 12);
  } else {
    lives--;
    if (lives <= 0) { gameState = 'gameover'; return; }
    respawnPlayer();
  }
}

function respawnPlayer() {
  if (gameState === 'boss') {
    jerry.x = 80; jerry.y = 300;
  } else {
    jerry.x = Math.max(100, jerry.x - 200);
    jerry.y = 200;
  }
  jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
}

// ============ UPDATE ============
function updatePlaying() {
  // input
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if ((keys[' '] || keys['w'] || keys['arrowup']) && jerry.onGround) {
    jerry.vy = JUMP_POWER;
    jerry.onGround = false;
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    bombs.push({
      x: jerry.x + jerry.w / 2, y: jerry.y + 10,
      vx: jerry.facing * 8, vy: -6, r: 8
    });
    jerry.hasBomb = false;
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;

  // physics
  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx;
  jerry.y += jerry.vy;
  jerry.onGround = false;

  // platform collision
  const allSolids = platforms.concat(blocks.filter(b => true));
  for (const p of allSolids) {
    if (rectHit(jerry, p)) {
      const prevX = jerry.x - jerry.vx;
      const prevY = jerry.y - jerry.vy;
      // top
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h;
        jerry.vy = 0;
        jerry.onGround = true;
      }
      // bottom (hit head)
      else if (prevY >= p.y + p.h - 1) {
        jerry.y = p.y + p.h;
        jerry.vy = 1;
        // trigger mystery block
        if (!p.hit && p.type) {
          p.hit = true;
          triggerBlock(p);
        }
      }
      // sides
      else if (prevX + jerry.w <= p.x + 1) {
        jerry.x = p.x - jerry.w;
      } else if (prevX >= p.x + p.w - 1) {
        jerry.x = p.x + p.w;
      }
    }
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'trash') {
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
    }
    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      if (jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 8 && e.type === 'trash') {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        score += 100;
        spawnParticles(e.x + 15, e.y + 15, '#8b6f47', 10);
      } else {
        damagePlayer();
      }
    }
  }

  // hazards - sewage
  for (const h of hazards) {
    if (jerry.y + jerry.h > h.y + 8 &&
        jerry.x + jerry.w > h.x + 5 && jerry.x < h.x + h.w - 5) {
      damagePlayer();
      break;
    }
  }

  // fall off
  if (jerry.y > H + 50) damagePlayer();

  // sign popups
  for (const s of signs) {
    if (s.shown) continue;
    if (Math.abs((jerry.x + jerry.w/2) - (s.x + 20)) < 40) {
      s.shown = true;
      showPopup(s.text);
    }
  }

  // bombs
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > LEVEL_END + 50) b.dead = true;
    // hit enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        e.alive = false;
        b.dead = true;
        score += 100;
        spawnParticles(e.x + 15, e.y + 15, '#4af', 15);
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  // particles
  for (const p of particles) {
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // camera
  camera.x = Math.max(0, Math.min(LEVEL_END - W, jerry.x - 300));

  // goal reached
  if (jerry.x + jerry.w > goal.x + 10) startBoss();

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

function triggerBlock(b) {
  showPopup(eduText(b.type));
  spawnParticles(b.x + 20, b.y, '#4af', 12);
  if (b.type === 'filter')   { jerry.powered = true; score += 200; }
  else if (b.type === 'chlorine') { lives++; score += 200; }
  else if (b.type === 'uv')       { jerry.hasBomb = true; score += 200; }
  else if (b.type === 'water')    { score += 50; }
}

// ============ BOSS ============
function startBoss() {
  gameState = 'boss';
  jerry.x = 80; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  camera.x = 0;
  bombs = [];
  bossActiveEnemies = [];
  jerry.hasBomb = true;
  boss = {
    body: { x: 430, y: 350, w: 320, h: 90 },
    stacks: [
      { x: 470, y: 240, w: 55, h: 200, hp: 2, alive: true, id: 'A' },
      { x: 570, y: 210, w: 55, h: 230, hp: 2, alive: true, id: 'B' },
      { x: 670, y: 190, w: 55, h: 250, hp: 2, alive: true, id: 'C' },
    ],
    smokeTimer: 0,
  };
  showPopup('BOSS: The Polluting Factory! Throw water bombs [X] at each smokestack!');
}

function updateBoss() {
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -MOVE_SPEED;
  if (keys['arrowright'] || keys['d']) ax = MOVE_SPEED;
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if ((keys[' '] || keys['w'] || keys['arrowup']) && jerry.onGround) {
    jerry.vy = JUMP_POWER;
    jerry.onGround = false;
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    bombs.push({
      x: jerry.x + jerry.w / 2, y: jerry.y + 10,
      vx: jerry.facing * 9, vy: -8, r: 9
    });
    jerry._xheld = true;
    jerry.hasBomb = false;
    setTimeout(() => { jerry.hasBomb = true; }, 500);
  }
  if (!keys['x']) jerry._xheld = false;

  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx; jerry.y += jerry.vy;
  jerry.onGround = false;

  // simple ground
  if (jerry.y + jerry.h >= GROUND_Y) {
    jerry.y = GROUND_Y - jerry.h;
    jerry.vy = 0;
    jerry.onGround = true;
  }
  if (jerry.x < 0) jerry.x = 0;
  if (jerry.x + jerry.w > W) jerry.x = W - jerry.w;

  // factory spawns smoke enemies
  boss.smokeTimer++;
  if (boss.smokeTimer > 80) {
    boss.smokeTimer = 0;
    const alive = boss.stacks.filter(s => s.alive);
    if (alive.length > 0) {
      const s = alive[Math.floor(Math.random() * alive.length)];
      bossActiveEnemies.push({
        x: s.x + s.w/2 - 10, y: s.y - 10,
        w: 20, h: 20,
        vx: (Math.random() - 0.5) * 4,
        vy: -4,
        life: 240, alive: true
      });
    }
  }

  // smoke enemies
  for (const e of bossActiveEnemies) {
    if (!e.alive) continue;
    e.vy += 0.15;
    e.x += e.vx; e.y += e.vy;
    e.life--;
    if (e.life <= 0 || e.y > H) e.alive = false;
    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      damagePlayer();
      e.alive = false;
    }
  }
  bossActiveEnemies = bossActiveEnemies.filter(e => e.alive);

  // bombs vs stacks
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > W + 50) b.dead = true;
    for (const s of boss.stacks) {
      if (!s.alive) continue;
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        s.hp--;
        b.dead = true;
        spawnParticles(b.x, b.y, '#4af', 15);
        if (s.hp <= 0) {
          s.alive = false;
          score += 500;
          spawnParticles(s.x + s.w/2, s.y + 30, '#ff8800', 30);
          spawnParticles(s.x + s.w/2, s.y + 30, '#fff', 20);
        }
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  // particles
  for (const p of particles) {
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  if (boss.stacks.every(s => !s.alive)) {
    gameState = 'win';
  }

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// ============ RENDER ============
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (gameState === 'boss') {
    g.addColorStop(0, '#4a2540');
    g.addColorStop(0.5, '#8b4a3a');
    g.addColorStop(1, '#c47a4a');
  } else {
    g.addColorStop(0, '#6bd6ff');
    g.addColorStop(1, '#c9f2ff');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  const isBoss = gameState === 'boss';
  ctx.fillStyle = isBoss ? 'rgba(80,40,30,0.6)' : 'rgba(255,255,255,0.75)';
  const off = (camera.x * 0.3) % 240;
  for (let i = -1; i < 6; i++) {
    const cx = i * 240 - off + 40;
    const cy = 70 + (i % 2) * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.arc(cx + 25, cy - 8, 26, 0, Math.PI*2);
    ctx.arc(cx + 55, cy, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawGround() {
  for (const p of platforms) {
    if (p.kind === 'ground') {
      ctx.fillStyle = '#5a8c3a';
      ctx.fillRect(p.x, p.y, p.w, 10);
      ctx.fillStyle = '#7cb85a';
      for (let i = 0; i < p.w; i += 12) {
        ctx.fillRect(p.x + i, p.y - 3, 8, 5);
      }
      ctx.fillStyle = '#6b3d1a';
      ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
      ctx.fillStyle = '#553015';
      for (let i = 0; i < p.w; i += 30) {
        ctx.fillRect(p.x + i, p.y + 18, 3, 18);
        ctx.fillRect(p.x + i + 15, p.y + 32, 3, 15);
      }
    } else {
      // brick
      ctx.fillStyle = '#a86f3a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#6b3d1a';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      for (let i = 20; i < p.w; i += 20) {
        ctx.beginPath();
        ctx.moveTo(p.x + i, p.y);
        ctx.lineTo(p.x + i, p.y + p.h);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + p.h/2);
      ctx.lineTo(p.x + p.w, p.y + p.h/2);
      ctx.stroke();
    }
  }
}

function drawHazards() {

function drawBlocks() {

function drawEnemies() {

function drawJerry() {
  const j = jerry;
  if (j.invuln > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

  const scale = j.powered ? 1.25 : 1;
  const dw = j.w * scale, dh = j.h * scale;
  const px = j.x + (j.w - dw) / 2;
  const py = j.y + (j.h - dh);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px + dw/2, py + dh + 3, dw/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // droplet body
  ctx.fillStyle = j.powered ? '#3ac0ff' : '#4a9fff';
  ctx.beginPath();
  ctx.moveTo(px + dw/2, py);
  ctx.bezierCurveTo(px + dw*1.05, py + dh*0.3, px + dw*1.05, py + dh*0.9, px + dw/2, py + dh);
  ctx.bezierCurveTo(px - dw*0.05, py + dh*0.9, px - dw*0.05, py + dh*0.3, px + dw/2, py);
  ctx.fill();

  // outline
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();

  // highlight
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + dw*0.32, py + dh*0.38, dw*0.11, dh*0.16, 0, 0, Math.PI*2);
  ctx.fill();

  // eyes
  const eyeY = py + dh * 0.55;
  const eyeShift = j.facing > 0 ? 1 : -1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + dw*0.35, eyeY, 5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65, eyeY, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + dw*0.35 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.arc(px + dw*0.65 + eyeShift, eyeY + 1, 2.5, 0, Math.PI*2);
  ctx.fill();

  // smile
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + dw/2, py + dh*0.75, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // powered aura
  if (j.powered) {
    ctx.strokeStyle = `rgba(255,255,100,${0.4 + Math.sin(Date.now()*0.015)*0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + dw/2, py + dh/2, dw*0.75, 0, Math.PI*2);
    ctx.stroke();
  }

  // bomb indicator
  if (j.hasBomb) {
    const bx = px + dw + 6, by = py + 4;
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(bx, by, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('X', bx - 3, by + 3);
  }
}

function drawBombs() {

function drawBossScene() {
  // ground
  ctx.fillStyle = '#5a4a3a';
  ctx.fillRect(0, GROUND_Y, W, 60);
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(0, GROUND_Y, W, 6);
  // toxic puddles on ground
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = 'rgba(120,90,20,0.6)';
    ctx.beginPath();
    ctx.ellipse(80 + i * 150, GROUND_Y + 15, 30, 4, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // factory body
  const b = boss.body;
  ctx.fillStyle = '#606060';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#404040';
  ctx.fillRect(b.x, b.y, b.w, 10);
  ctx.strokeStyle = '#303030';
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  // windows
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = '#ff9';
    ctx.fillRect(b.x + 15 + i * 50, b.y + 25, 22, 22);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(b.x + 15 + i * 50, b.y + 25, 22, 22);
    ctx.beginPath();
    ctx.moveTo(b.x + 26 + i * 50, b.y + 25);
    ctx.lineTo(b.x + 26 + i * 50, b.y + 47);
    ctx.moveTo(b.x + 15 + i * 50, b.y + 36);
    ctx.lineTo(b.x + 37 + i * 50, b.y + 36);
    ctx.stroke();
  }
  // door
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(b.x + b.w/2 - 18, b.y + 55, 36, 35);
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('MEGA-POLLUTE INC.', b.x + 90, b.y - 5);

  // smokestacks
  for (const s of boss.stacks) {
    if (!s.alive) {
      // rubble
      ctx.fillStyle = '#404040';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y + s.h);
      ctx.lineTo(s.x + 10, s.y + s.h - 25);
      ctx.lineTo(s.x + s.w/2, s.y + s.h - 15);
      ctx.lineTo(s.x + s.w - 10, s.y + s.h - 30);
      ctx.lineTo(s.x + s.w, s.y + s.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#202020';
      ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#505050';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = '#303030';
    ctx.strokeRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#303030';
    ctx.fillRect(s.x - 3, s.y, s.w + 6, 10);
    ctx.fillRect(s.x, s.y + 20, s.w, 3);
    // hp bar
    ctx.fillStyle = '#000';
    ctx.fillRect(s.x + 8, s.y + s.h/2 - 3, s.w - 16, 10);
    ctx.fillStyle = s.hp === 2 ? '#0f0' : '#f80';
    ctx.fillRect(s.x + 10, s.y + s.h/2 - 1, (s.w - 20) * (s.hp / 2), 6);

    // black smoke coming out
    for (let i = 0; i < 4; i++) {
      const t = (Date.now() * 0.001 + i * 0.7) % 3;
      ctx.fillStyle = `rgba(40,30,25,${0.8 - t/3})`;
      ctx.beginPath();
      ctx.arc(s.x + s.w/2 + Math.sin(t*3)*8, s.y - t * 25, 10 + t * 5, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // smoke monsters
  for (const e of bossActiveEnemies) {
    if (!e.alive) continue;
    ctx.fillStyle = '#3a3020';
    ctx.beginPath();
    ctx.arc(e.x + 10, e.y + 10, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff4';
    ctx.fillRect(e.x + 4, e.y + 6, 4, 4);
    ctx.fillRect(e.x + 12, e.y + 6, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x + 5, e.y + 7, 2, 2);
    ctx.fillRect(e.x + 13, e.y + 7, 2, 2);
    // angry mouth
    ctx.strokeStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(e.x + 6, e.y + 15);
    ctx.lineTo(e.x + 10, e.y + 13);
    ctx.lineTo(e.x + 14, e.y + 15);
    ctx.stroke();
  }
}

function drawPopup() {
  // Sits just under the HUD at the top: on a phone the bottom of the screen is
  // where the thumbs and the ground are, so text down there gets missed.
  const pad = 18, lh = 24;
  const boxX = 30, boxW = W - 60;
  const textW = boxW - pad * 2;

  ctx.font = 'bold 18px monospace';
  const lines = wrapLines(popup.text, textW);
  const boxH = pad + 22 + lines.length * lh + pad - 8;
  // clear the HUD, and the extra boss status line when it is showing
  const boxY = gameState === 'boss' ? 66 : 46;

  // drop shadow so the panel separates from the sky behind it
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(boxX + 4, boxY + 4, boxW, boxH);

  ctx.fillStyle = 'rgba(0,12,28,0.95)';
  ctx.fillRect(boxX, boxY, boxW, boxH);

  ctx.lineWidth = 3;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('◆ DID YOU KNOW?', boxX + pad, boxY + pad + 6);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  lines.forEach((l, i) => {
    ctx.fillText(l, boxX + pad, boxY + pad + 30 + i * lh);
  });
}

// Splits text into lines that fit maxW. Call with the final font already set.
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line !== '') {
      lines.push(line.trim());
      line = w + ' ';
    } else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function wrapText(text, x, y, maxW, lh) {
  const lines = wrapLines(text, maxW);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
  return lines.length * lh;
}

function drawMenu() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a3a70');
  g.addColorStop(0.5, '#1a7abc');
  g.addColorStop(1, '#4ab0e8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // decorative water waves at bottom
  for (let layer = 0; layer < 3; layer++) {
    ctx.fillStyle = `rgba(74,175,255,${0.3 + layer * 0.2})`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) {
      const y = H - 60 + layer * 20 + Math.sin((x + Date.now() * 0.001 + layer) * 0.02) * 8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  // title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 5;
  ctx.font = 'bold 54px monospace';
  const bob = Math.sin(Date.now() * 0.003) * 3;
  ctx.strokeText('JERRY', W/2, 90 + bob);
  ctx.fillText('JERRY', W/2, 90 + bob);
  ctx.font = 'bold 26px monospace';

  ctx.font = 'italic 13px monospace';
  ctx.fillStyle = '#c8e8ff';
  ctx.fillText('~ An educational quest to save our rivers ~', W/2, 158);

  // nudge phone players towards landscape, where the view is much bigger
  if (isTouch && window.innerHeight > window.innerWidth) {
    ctx.fillStyle = '#ff8';
    ctx.font = 'bold 13px monospace';

  // preview jerry

  ctx.fillStyle = '#4a9fff';

  ctx.bezierCurveTo(px + 42, py + 12, px + 42, py + 40, px + 20, py + 50);
  ctx.bezierCurveTo(px - 2, py + 40, px - 2, py + 12, px + 20, py);
  ctx.fill();
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.ellipse(px + 13, py + 18, 4, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + 13, py + 28, 5, 0, Math.PI*2);
  ctx.arc(px + 27, py + 28, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px + 14, py + 29, 2.5, 0, Math.PI*2);
  ctx.arc(px + 28, py + 29, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px + 20, py + 38, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  ctx.restore();

  // mission panel
  ctx.fillStyle = 'rgba(0,20,40,0.7)';
  ctx.fillRect(120, 265, W - 240, 155);
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 2;
  ctx.strokeRect(120, 265, W - 240, 155);

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('◆ MISSION ◆', W/2, 290);
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  ctx.fillText('Waste is choking our waters. Jump on trash goons,', W/2, 315);
  ctx.fillText('avoid sewage pits & toxic drums, and break blocks', W/2, 333);
  ctx.fillText('from below to unlock water treatment tech!', W/2, 351);
  ctx.fillStyle = '#ff8';
  ctx.fillText('FILTER · CHLORINE · UV LIGHT', W/2, 375);
  ctx.fillStyle = '#fff';
  ctx.fillText('Reach the factory and destroy it with water bombs.', W/2, 400);

  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 18px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP HERE TO START ◀' : '▶ PRESS ENTER TO START ◀', W/2, 460);
  }
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 52px monospace';
  ctx.fillText('GAME OVER', W/2, H/2 - 30);
  ctx.fillStyle = '#fff';
  ctx.font = '15px monospace';
  ctx.fillText('The waters remain polluted...', W/2, H/2 + 15);
  ctx.font = '13px monospace';
  ctx.fillStyle = '#8bc';
  ctx.fillText('But Jerry never gives up.', W/2, H/2 + 40);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 16px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP TO TRY AGAIN ◀' : '▶ PRESS R TO TRY AGAIN ◀', W/2, H/2 + 90);
  }
  ctx.textAlign = 'left';
}

function drawWin() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a4a80');
  g.addColorStop(1, '#1aa0e8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // celebratory water drops falling
  for (let i = 0; i < 30; i++) {
    const t = (Date.now() * 0.001 + i * 0.3) % 3;
    const x = (i * 37) % W;
    const y = t * H / 3;
    ctx.fillStyle = 'rgba(200,232,255,0.8)';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 4;
  ctx.font = 'bold 36px monospace';
  ctx.strokeText('★ VICTORY ★', W/2, 70);
  ctx.fillText('★ VICTORY ★', W/2, 70);
  ctx.font = 'bold 20px monospace';
  ctx.fillText('THE RIVER IS SAVED!', W/2, 105);

  ctx.font = '14px monospace';
  ctx.fillStyle = '#c8e8ff';
  ctx.fillText('Jerry stopped the polluters. Fish are returning.', W/2, 135);
  ctx.fillText('Children can drink clean water again.', W/2, 155);

  ctx.fillStyle = '#ff8';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('★ WHAT YOU LEARNED ★', W/2, 200);

  const facts = [
    'FILTRATION removes solid particles from wastewater',
    'CHLORINATION kills harmful bacteria & pathogens',
    'UV DISINFECTION cleans water without chemicals',
    'INDUSTRIAL WASTE is a major cause of river pollution',
    'Every citizen can help protect our water sources',
  ];
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  facts.forEach((f, i) => {
    ctx.fillStyle = '#4af';
    ctx.fillText('◆', W/2 - 240, 230 + i * 25);
    ctx.fillStyle = '#fff';
    ctx.fillText(f, W/2 - 220, 230 + i * 25);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('FINAL SCORE: ' + score, W/2, 395);

  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 15px monospace';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillText(isTouch ? '▶ TAP TO PLAY AGAIN ◀' : '▶ PRESS R TO PLAY AGAIN ◀', W/2, 445);
  }
  ctx.textAlign = 'left';
}

// ============ RESET ============
function fullReset() {
  score = 0; lives = 3;
  jerry.x = 100; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.powered = false; jerry.hasBomb = false;
  jerry.invuln = 60; jerry.facing = 1;
  camera.x = 0;
  bombs = [];
  particles = [];
  bossActiveEnemies = [];
  popup = null;
  boss = null;
  resetLevel();
}

// ============ MAIN LOOP ============
function draw() {
  drawSky();
  drawClouds();
  ctx.save();
  ctx.translate(-camera.x, 0);
  if (gameState === 'playing') {
    drawGround();
    drawHazards();
    drawSigns();
    drawBlocks();
    drawGoal();
    drawEnemies();
  } else if (gameState === 'boss') {
    drawBossScene();
  }
  drawJerry();
  drawBombs();
  drawParticles();
  ctx.restore();
  drawHUD();
  if (popup) drawPopup();
}

function loop() {
  // consume a pending screen tap once per frame
  const tapped = tapConfirm;
  tapConfirm = false;

  if (gameState === 'menu') {
    drawMenu();
    if (keys['enter'] || tapped) {
      fullReset();
      gameState = 'playing';
    }
  } else if (gameState === 'playing') {
    updatePlaying();
    draw();
  } else if (gameState === 'boss') {
    updateBoss();
    draw();
  } else if (gameState === 'gameover') {
    draw();
    drawGameOver();
    if (keys['r'] || tapped) { gameState = 'menu'; }
  } else if (gameState === 'win') {
    drawWin();
    if (keys['r'] || tapped) { gameState = 'menu'; }
  }
  requestAnimationFrame(loop);
}

resetLevel();
loop();
</script>
