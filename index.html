<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001830">
<meta name="description" content="An educational platformer about water pollution and treatment. 8 levels, a greedy tycoon and a shared leaderboard.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jerry">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-192.png">
<title>Jerry the Water Saviour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(#000, #001830);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 6px;
  }
  h1 { color: #4af; margin-bottom: 6px; font-size: 14px; letter-spacing: 2px; text-align: center; }
  #stage {
    position: relative;
    line-height: 0;
    max-width: 100%;
  }
  /* sound toggle, tucked against the top-right of the play area */
  #sound {
    position: absolute;
    top: 8px; right: -52px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.75);
    border: 2px solid #4af;
    color: #cfe9ff;
    font-size: 19px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    touch-action: manipulation;
    transition: transform .08s, background .12s, border-color .12s;
  }
  #sound:hover { background: rgba(74, 175, 255, 0.35); }
  #sound:active { transform: scale(0.9); }
  #sound.off { border-color: #667; color: #889; background: rgba(30, 30, 40, 0.75); }
  /* on narrow screens there is no room beside the canvas - move it inside */
  /* No room beside the canvas: put the button inside it. Touch devices always
     fill the width, so they always need the inside position - a width-only
     breakpoint missed big phones like the 932px iPhone Pro Max. */
  @media (max-width: 920px) {
    #sound { right: 8px; top: 44px; width: 38px; height: 38px; font-size: 17px; }
  }
  body.touch-mode #sound {
    right: 8px; top: 44px; width: 38px; height: 38px; font-size: 17px;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch-mode #sound { top: 8px; width: 34px; height: 34px; font-size: 15px; }
  }

  /* ===== name entry ===== */
  #nameOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 12, 30, 0.88);
    z-index: 30;
    line-height: normal;
  }
  #nameOverlay.show { display: flex; }
  #nameOverlay .panel {
    width: min(86%, 380px);
    background: rgba(6, 26, 50, 0.97);
    border: 3px solid #4af;
    border-radius: 6px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.35);
  }
  #nameOverlay h2 {
    color: #4af; font-size: 15px; letter-spacing: 1px; margin-bottom: 8px;
  }
  #nameOverlay p { color: #8bc; font-size: 11px; margin-bottom: 14px; }
  #nameInput {
    width: 100%;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: #06182e;
    border: 2px solid #2a6fa8;
    border-radius: 4px;
    outline: none;
  }
  #nameInput:focus { border-color: #4af; box-shadow: 0 0 12px rgba(74,175,255,0.5); }
  #nameGo {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #04121f;
    background: #4af;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s, transform .06s;
  }
  #nameGo:hover { background: #6cf; }
  #nameGo:active { transform: scale(0.97); }
  #nameHint { margin-top: 9px; color: #567; font-size: 10px; }

  /* lets a second person on the same device claim their own id */
  #switchPlayer {
    position: absolute;
    left: 8px; top: 8px;
    padding: 5px 9px;
    font-size: 10px;
    color: #9cc;
    background: rgba(10, 30, 55, 0.8);
    border: 1px solid #35678f;
    border-radius: 14px;
    cursor: pointer;
    z-index: 20;
    line-height: normal;
    user-select: none;
  }
  #switchPlayer:hover { color: #fff; border-color: #4af; }
  #switchPlayer:active { transform: scale(0.95); }

  /* install-as-app button, only shown when the browser offers it */
  #installBtn {
    position: absolute;
    right: 8px; bottom: 8px;
    display: none;
    padding: 7px 13px;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #04121f;
    background: linear-gradient(#7cd4ff, #4af);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    z-index: 21;
    box-shadow: 0 3px 12px rgba(74,175,255,0.45);
    animation: pulseIn 2.4s ease-in-out infinite;
  }
  #installBtn:active { transform: scale(0.95); }
  @keyframes pulseIn {
    0%, 100% { box-shadow: 0 3px 12px rgba(74,175,255,0.35); }
    50%      { box-shadow: 0 3px 20px rgba(74,175,255,0.8); }
  }

  /* small transient message (installed, offline, score saved…) */
  #toast {
    position: absolute;
    left: 50%; bottom: 14px;
    transform: translateX(-50%) translateY(12px);
    padding: 9px 16px;
    font-size: 12px;
    color: #cfe9ff;
    background: rgba(6, 26, 50, 0.95);
    border: 1px solid #4af;
    border-radius: 18px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 40;
    line-height: normal;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #game {
    display: block;
    width: 100%;
    height: auto;   /* fitCanvas() sets an explicit height */
    border: 3px solid #4af;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.6);
    /* no image-rendering:pixelated - the canvas now renders at the device's
       own resolution, so letting the browser do nothing keeps text crisp */
    background: #6bd6ff;
    touch-action: none;
  }
  #info {
    margin-top: 10px;
    font-size: 12px;
    color: #8bc;
    text-align: center;
    max-width: 800px;
  }
  kbd {
    background: #223;
    border: 1px solid #4af;
    padding: 2px 6px;
    border-radius: 3px;
    color: #4af;
    font-size: 11px;
  }

  /* ===== Touch controls (mobile / tablet) ===== */
  #touch {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  body.touch-mode #touch { display: flex; }
  body.touch-mode #info { display: none; }
  /* keep the play area vertically centred in the space above the buttons */
  body.touch-mode { justify-content: center; padding-bottom: 110px; }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch-mode { padding-bottom: 0; }
  }

  .pad { display: flex; gap: 12px; pointer-events: auto; }
  .btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.55);
    border: 2px solid rgba(74, 175, 255, 0.85);
    color: #cfe9ff;
    font-family: inherit;
    font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    touch-action: none;
    transition: transform .06s, background .06s;
  }
  .btn.small { width: 58px; height: 58px; font-size: 16px; }
  .btn.jump { background: rgba(20, 90, 60, 0.55); border-color: rgba(80, 230, 160, 0.9); color: #d6ffe9; }
  .btn.bomb { background: rgba(15, 60, 110, 0.6); border-color: rgba(120, 200, 255, 0.95); color: #eaf6ff; }
  .btn.active { transform: scale(0.9); background: rgba(74, 175, 255, 0.65); color: #fff; }

  @media (max-width: 900px) {
    h1 { font-size: 12px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    h1 { display: none; }
    .btn { width: 56px; height: 56px; font-size: 20px; }
    .btn.small { width: 50px; height: 50px; font-size: 14px; }
    /* phone landscape: hand every pixel to the game */
    body { padding: 0; justify-content: center; }
    #game { border-width: 2px; }
  }
</style>
</head>
<body>
<h1>◆ JERRY THE WATER SAVIOUR ◆</h1>
<div id="stage">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="sound" role="button" tabindex="0" aria-label="Sound on" title="Sound on/off (M)">🔊</div>

  <div id="nameOverlay">
    <div class="panel">
      <h2>◆ ENTER YOUR NAME ◆</h2>
      <p>Your score will appear on the leaderboard</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="PLAYER"
             autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="nameGo">START GAME</button>
      <div id="nameHint">Max 12 characters</div>
    </div>
  </div>

  <div id="switchPlayer" role="button" tabindex="0" title="Play as someone else">👤 Not you?</div>
  <button id="installBtn" type="button" title="Install this game">⬇ Install</button>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="info">
  <kbd>←</kbd> <kbd>→</kbd> move &nbsp;•&nbsp;
  <kbd>SPACE</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> jump &nbsp;•&nbsp;
  <kbd>X</kbd> water bomb &nbsp;•&nbsp;
  <kbd>R</kbd> restart &nbsp;•&nbsp;
  <kbd>M</kbd> mute
</div>

<div id="touch">
  <div class="pad">
    <div class="btn" data-key="arrowleft">◀</div>
    <div class="btn" data-key="arrowright">▶</div>
  </div>
  <div class="pad">
    <div class="btn small bomb" data-key="x">BOMB</div>
    <div class="btn jump" data-key=" ">▲</div>
  </div>
</div>

<script>
// ============ SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// The game always thinks in this coordinate space. The canvas backing store is
// resized to the real device resolution in fitCanvas(), which keeps text sharp.
const W = 800, H = 500;
// On a wide screen (phone landscape especially) the 800x500 box leaves big
// empty margins. VIEW_W is how many game units are actually visible; anything
// wider than W is extra world shown to the left and right. HUD and menus stay
// laid out in the 800-wide box, centred inside the view.
let VIEW_W = W;
let VIEW_X = 0;      // left edge of the 800-wide UI box inside the view

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ============ TOUCH / RESPONSIVE ============
// maxTouchPoints alone is unreliable (desktop Chrome reports 10), so require a
// coarse/hoverless pointer — that is what actually separates phones from mice.
const isTouch = matchMedia('(pointer: coarse)').matches ||
                matchMedia('(hover: none)').matches;
if (isTouch) document.body.classList.add('touch-mode');

// Scale the canvas to fit the viewport while keeping the 800x500 aspect ratio.
// The game keeps drawing in 800x500 space; CSS just stretches the result.
function fitCanvas() {
  const stage = document.getElementById('stage');
  const title = document.querySelector('h1');
  const info = document.getElementById('info');
  const chrome = (title && title.offsetParent ? title.offsetHeight + 6 : 0) +
                 (info && info.offsetParent ? info.offsetHeight + 10 : 0);
  // In portrait the buttons sit below the game, so reserve their height.
  // In landscape they float over the empty side areas, so reserve nothing.
  const landscape = window.innerWidth > window.innerHeight;
  // Landscape buttons float over the sides, but still keep a small margin so
  // they never sit on top of the HUD/action area at the bottom of the canvas.
  const reserved = isTouch ? (landscape ? 6 : 110) : 24;
  const availW = window.innerWidth - (isTouch && landscape ? 0 : 12);
  const availH = window.innerHeight - chrome - reserved;

  // Height decides the scale, then we let the canvas be as wide as the screen
  // allows. That extra width becomes more visible world instead of black bars,
  // so phone landscape genuinely fills the screen.
  let scale = Math.max(0.2, availH / H);
  // never let the 800-wide UI box itself overflow the screen
  scale = Math.min(scale, availW / W);
  const wantW = Math.min(availW, Math.round(W * 2.4 * scale));  // sane upper bound
  const cssW = Math.floor(Math.min(availW, Math.max(W * scale, wantW)));
  const cssH = Math.floor(H * scale);

  VIEW_W = Math.round(cssW / scale);       // game units across the canvas
  VIEW_X = Math.round((VIEW_W - W) / 2);   // centre the 800-wide UI box

  stage.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  // Render at the real device resolution instead of stretching a small bitmap,
  // which is what made text look soft.
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const pxW = Math.round(cssW * dpr);
  const pxH = Math.round(cssH * dpr);
  if (canvas.width !== pxW || canvas.height !== pxH) {
    canvas.width = pxW;
    canvas.height = pxH;
  }
  // one unit of game space -> however many real pixels that is now
  ctx.setTransform(pxH / H, 0, 0, pxH / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
fitCanvas();

// On-screen buttons drive the same `keys` map the keyboard uses.
document.querySelectorAll('#touch .btn').forEach(btn => {
  const key = btn.dataset.key;
  const press = e => {
    e.preventDefault();
    keys[key] = true;
    btn.classList.add('active');
  };
  const release = e => {
    e.preventDefault();
    keys[key] = false;
    btn.classList.remove('active');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

// Tap the canvas to start / restart on menu, game over and win screens.
// A tap can begin and end inside a single frame, so latch it and let the
// game loop consume the flag instead of sampling a key that is already up.
let tapConfirm = false;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  tapConfirm = true;
});
// Block double-tap zoom / long-press menus over the play area.
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============ AUDIO ============
// Everything is synthesised with the Web Audio API so the game stays a single
// file with no asset downloads. Browsers block audio until the user interacts,
// so the context is only created on the first tap/keypress.
const audio = {
  ctx: null,
  master: null,
  musicGain: null,
  on: true,
  timer: null,
  step: 0,
  track: null,
};

// Melodies per scene: [semitone offset from A2, ...], null = rest.
const TRACKS = {
  menu:    { bpm: 104, wave: 'triangle', bass: [0, null, 7, null, 5, null, 7, null],
             lead: [12, 16, 19, 16, 17, 16, 12, null, 12, 16, 19, 24, 22, 19, 16, null] },
  playing: { bpm: 132, wave: 'square',   bass: [0, 0, 7, 7, 5, 5, 3, 3],
             lead: [12, 12, 16, 19, 17, 16, 12, 14, 16, 16, 19, 21, 19, 16, 12, null] },
  level2:  { bpm: 142, wave: 'square',   bass: [0, 0, 6, 6, 3, 3, 5, 5],
             lead: [12, 15, 12, 18, 17, 15, 12, null, 10, 12, 15, 17, 15, 12, 10, null] },
  boss:    { bpm: 150, wave: 'sawtooth', bass: [0, 0, 1, 1, 0, 0, 3, 3],
             lead: [12, 13, 12, 8, 12, 15, 12, 8, 13, 12, 8, 6, 8, 12, 13, null] },
  villain: { bpm: 162, wave: 'sawtooth', bass: [0, 1, 0, 1, 3, 4, 3, 1],
             lead: [12, 15, 18, 15, 13, 12, 8, 12, 18, 20, 18, 15, 13, 12, 8, null] },
  win:     { bpm: 118, wave: 'triangle', bass: [0, 0, 5, 5, 7, 7, 0, 0],
             lead: [12, 16, 19, 24, 19, 24, 28, null, 26, 24, 21, 19, 17, 16, 12, null] },
  gameover:{ bpm: 76,  wave: 'triangle', bass: [0, null, -2, null, -4, null, -5, null],
             lead: [12, 10, 8, 7, 5, 3, 0, null] },
};

const midi = n => 110 * Math.pow(2, n / 12);   // A2 = 110Hz

function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.master = audio.ctx.createGain();
  audio.master.gain.value = 0.9;
  audio.master.connect(audio.ctx.destination);
  audio.musicGain = audio.ctx.createGain();
  audio.musicGain.gain.value = audio.on ? 0.16 : 0;
  audio.musicGain.connect(audio.master);
}

// One short synth note.
function tone(freq, dur, when, type, gain, dest) {
  const c = audio.ctx;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
  o.connect(g); g.connect(dest || audio.musicGain);
  o.start(when); o.stop(when + dur + 0.03);
}

// Advances the song one sixteenth-note at a time.
function musicTick() {
  if (!audio.ctx || !audio.track) return;
  const t = TRACKS[audio.track];
  if (!t) return;
  const beat = 60 / t.bpm / 2;          // eighth notes
  const now = audio.ctx.currentTime + 0.05;
  const s = audio.step;

  const b = t.bass[s % t.bass.length];
  if (b !== null && s % 2 === 0) tone(midi(b - 12), beat * 1.7, now, 'triangle', 0.5);

  const l = t.lead[s % t.lead.length];
  if (l !== null) tone(midi(l), beat * 0.85, now, t.wave, 0.22);

  // light hats to keep a pulse on the action tracks
  if (audio.track !== 'gameover' && s % 2 === 1) {
    tone(7000 + Math.random() * 900, 0.02, now, 'square', 0.03);
  }

  audio.step++;
  audio.timer = setTimeout(musicTick, beat * 1000);
}

function playMusic(name) {
  if (audio.track === name) return;
  audio.track = name;
  audio.step = 0;
  if (!audio.ctx) return;
  clearTimeout(audio.timer);
  musicTick();
}

function stopMusic() {
  clearTimeout(audio.timer);
  audio.timer = null;
  audio.track = null;
}

// Short sound effects, mixed above the music.
function sfx(kind) {
  if (!audio.ctx || !audio.on) return;
  const c = audio.ctx, now = c.currentTime;
  if (kind === 'jump') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(300, now);
    o.frequency.exponentialRampToValueAtTime(760, now + 0.11);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.16);
  } else if (kind === 'throw') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(680, now);
    o.frequency.exponentialRampToValueAtTime(200, now + 0.13);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.17);
  } else if (kind === 'hit') {
    // noise burst
    const len = Math.floor(c.sampleRate * 0.16);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = 0.22;
    src.connect(g); g.connect(audio.master);
    src.start(now);
  } else if (kind === 'power') {
    [0, 4, 7, 12].forEach((n, i) =>
      tone(midi(12 + n), 0.14, now + i * 0.07, 'square', 0.16, audio.master));
  } else if (kind === 'hurt') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(420, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.35);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.4);
  } else if (kind === 'boom') {
    const len = Math.floor(c.sampleRate * 0.45);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = c.createGain(); g.gain.value = 0.4;
    src.connect(f); f.connect(g); g.connect(audio.master);
    src.start(now);
  }
}

function setAudioOn(on) {
  audio.on = on;
  if (audio.musicGain) {
    const c = audio.ctx;
    audio.musicGain.gain.cancelScheduledValues(c.currentTime);
    audio.musicGain.gain.linearRampToValueAtTime(on ? 0.16 : 0, c.currentTime + 0.15);
  }
  const btn = document.getElementById('sound');
  if (btn) {
    btn.textContent = on ? '🔊' : '🔇';
    btn.classList.toggle('off', !on);
    btn.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
  }
  try { localStorage.setItem('jerry-sound', on ? '1' : '0'); } catch (e) {}
}

  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  if (audio.track && !audio.timer) musicTick();
}

// ============ PLAYER PROFILE + LEADERBOARD ============
// Talks to the local API (see server.js), which stores everything as CSV in
// ./media. If the server is not running the game still plays; scores are then
// kept in this browser and pushed up the next time the API is reachable.
const API = '/api';

const profile = {
  id: null,
  name: '',
  gamesPlayed: 0,
  bestScore: 0,
  bestLevel: 1,
  bestTimeMs: 0,
  rank: null,
  totalPlayers: 0,
  history: [],
  returning: false,      // true when we recognised a saved id
};

const leaderboard = { rows: [], status: 'idle' };  // idle|loading|ok|offline

const ID_KEY = 'jerry-player-id';
const NAME_KEY = 'jerry-player-name';
const PENDING_KEY = 'jerry-pending-scores';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

async function apiJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function applyProfile(p) {
  profile.id = p.id;
  profile.name = p.name;
  profile.gamesPlayed = p.gamesPlayed || 0;
  profile.bestScore = p.bestScore || 0;
  profile.bestLevel = p.bestLevel || 1;
  profile.bestTimeMs = p.bestTimeMs || 0;
  profile.rank = p.rank == null ? null : p.rank;
  profile.totalPlayers = p.totalPlayers || 0;
  profile.history = p.history || [];
  playerName = p.name;
}

// Look up the saved id so a returning player is greeted by name.
async function loadSavedPlayer() {
  const id = store.get(ID_KEY);
  if (!id) return false;
  try {
    const p = await apiJson(`${API}/player?id=${encodeURIComponent(id)}`);
    applyProfile(p);
    profile.returning = true;
    store.set(NAME_KEY, p.name);
    flushPendingScores();
    return true;
  } catch (e) {
    // No server: fall back to whatever this browser remembers.
    const savedName = store.get(NAME_KEY);
    if (savedName) {
      profile.id = id;
      profile.name = savedName;
      playerName = savedName;
      profile.returning = true;
      applyLocalStats();
      return true;
    }
    return false;
  }
}

async function registerPlayer(name) {
  const clean = (name || 'PLAYER').trim().toUpperCase().slice(0, 12) || 'PLAYER';
  try {
    const p = await apiJson(`${API}/player`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: clean }),
    });
    applyProfile(p);
    store.set(ID_KEY, p.id);
    profile.returning = false;
    return true;
  } catch (e) {
    // No server (static hosting or it is down): keep playing locally, and
    // remember the name so a reload still recognises them.
    profile.id = store.get(ID_KEY) || 'local_' + Math.random().toString(36).slice(2, 10);
    store.set(ID_KEY, profile.id);
    store.set(NAME_KEY, clean);
    profile.name = clean;
    playerName = clean;
    profile.returning = false;
    applyLocalStats();
    return false;
  }
}

// Rebuilds profile numbers from the runs saved in this browser.
function applyLocalStats() {
  const mine = loadLocalRuns().filter(r => r.name === profile.name);
  profile.gamesPlayed = mine.length;
  profile.bestScore = mine.reduce((m, r) => Math.max(m, r.score), 0);
  profile.bestLevel = mine.reduce((m, r) => Math.max(m, r.level), 1);
  profile.history = mine
    .slice()
    .sort((a, b) => new Date(b.playedAt) - new Date(a.playedAt))
    .slice(0, 20);
  const board = localBoard();
  const entry = board.find(r => r.name === profile.name);
  profile.rank = entry ? entry.rank : null;
  profile.totalPlayers = board.length;
  profile.bestTimeMs = entry ? entry.durationMs : 0;
}

// Scores recorded while the server was down, retried later.
function queuePending(entry) {
  let q = [];
  try { q = JSON.parse(store.get(PENDING_KEY) || '[]'); } catch (e) {}
  q.push(entry);
  store.set(PENDING_KEY, JSON.stringify(q.slice(-50)));
}

async function flushPendingScores() {
  let q = [];
  try { q = JSON.parse(store.get(PENDING_KEY) || '[]'); } catch (e) {}
  if (!q.length || !profile.id) return;
  const left = [];
  for (const e of q) {
    try {
      const p = await apiJson(`${API}/score`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: profile.id, score: e.score, level: e.level, durationMs: e.durationMs }),
      });
      applyProfile(p);
    } catch (err) { left.push(e); }
  }
  store.set(PENDING_KEY, JSON.stringify(left));
}

async function submitScore(score, level, durationMs) {
  const playedAt = new Date().toISOString();
  const entry = { score, level, durationMs, playedAt };
  // optimistic local update so the end screen is correct straight away
  profile.gamesPlayed++;
  if (score > profile.bestScore) profile.bestScore = score;
  if (level > profile.bestLevel) profile.bestLevel = level;
  profile.history.unshift({ score, level, durationMs, playedAt });

  // always keep a copy in this browser, so the board works with no server
  saveLocalRun({ id: profile.id || 'local', name: profile.name || 'PLAYER',
                 score, level, durationMs, playedAt });

  if (!profile.id) { fetchLeaderboard(); return; }
  try {
    const p = await apiJson(`${API}/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: profile.id, score, level, durationMs }),
    });
    applyProfile(p);
  } catch (e) {
    queuePending(entry);
    // offline: work out our own rank from the local runs
    const board = localBoard();
    const mine = board.find(r => r.name === profile.name);
    profile.rank = mine ? mine.rank : null;
    profile.totalPlayers = board.length;
    profile.bestTimeMs = mine ? mine.durationMs : 0;
  }
  fetchLeaderboard();
}

async function fetchLeaderboard() {
  leaderboard.status = 'loading';
  try {
    const d = await apiJson(`${API}/leaderboard?limit=50`);
    leaderboard.rows = d.rows || [];
    leaderboard.status = 'ok';
  } catch (e) {
    // No API (static hosting, or the server is down). Show this device's own
    // runs so the board is never just an empty screen.
    leaderboard.rows = localBoard();
    leaderboard.status = 'offline';
  }
}

// Builds a board out of the runs stored in this browser, ranked with the same
// rules the server uses.
function localBoard() {
  const runs = loadLocalRuns();
  const best = new Map();
  for (const r of runs) {
    const cur = best.get(r.name);
    if (!cur || compareRunsClient(r, cur) < 0) best.set(r.name, r);
  }
  const rows = [...best.values()].sort(compareRunsClient);
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}

function compareRunsClient(a, b) {
  if (b.score !== a.score) return b.score - a.score;
  const ad = a.durationMs || Infinity, bd = b.durationMs || Infinity;
  if (ad !== bd) return ad - bd;
  const at = new Date(a.playedAt).getTime() || 0;
  const bt = new Date(b.playedAt).getTime() || 0;
  if (at !== bt) return at - bt;
  return String(a.id || '').localeCompare(String(b.id || ''));
}

const LOCAL_RUNS_KEY = 'jerry-local-runs';

function loadLocalRuns() {
  try { return JSON.parse(store.get(LOCAL_RUNS_KEY) || '[]'); }
  catch (e) { return []; }
}

function saveLocalRun(entry) {
  const runs = loadLocalRuns();
  runs.push(entry);
  // keep the file small; only the best 100 matter for a board
  runs.sort(compareRunsClient);
  store.set(LOCAL_RUNS_KEY, JSON.stringify(runs.slice(0, 100)));
}

// Registers the service worker so the game installs to the home screen and
// keeps working with no connection.
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, ms) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2600);
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // A cached old build would otherwise stick around until every tab is
      // closed. Watch for a new worker and reload as soon as it takes over.
      reg.addEventListener('updatefound', () => {
        const fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener('statechange', () => {
          if (fresh.state === 'installed' && navigator.serviceWorker.controller) {
            toast('Update ready - reloading');
            setTimeout(() => location.reload(), 900);
          }
        });
      });
      reg.update();
    }).catch(() => {});
  });

  // if the worker is replaced, pick up the new version once
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}

// Chrome/Edge fire this instead of installing straight away; we stash it and
// show our own button so the prompt appears at a sensible moment.
const installBtn = document.getElementById('installBtn');

  e.preventDefault();

    e.stopPropagation();
    if (!installPrompt) return;
    installBtn.style.display = 'none';
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null;
    if (outcome === 'accepted') toast('Installed! Look for Jerry on your home screen');
    else if (installBtn) installBtn.style.display = 'block';
  });
  installBtn.addEventListener('pointerdown', e => e.stopPropagation());
}

  installPrompt = null;

function setStage(n) {
  jerry.stage = Math.max(0, Math.min(2, n));
  jerry.powered = jerry.stage >= 1;
  if (jerry.stage < 2) {
    jerry.hasBomb = false;
    jerry.bombCooldown = 0;
  } else {
    jerry.hasBomb = true;
    jerry.bombCooldown = 0;

}
