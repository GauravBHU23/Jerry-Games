<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001830">
<meta name="description" content="An educational platformer about water pollution and treatment. 8 levels, a greedy tycoon and a shared leaderboard.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jerry">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-192.png">
<title>Jerry the Water Saviour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(#000, #001830);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 6px;
  }
  h1 { color: #4af; margin-bottom: 6px; font-size: 14px; letter-spacing: 2px; text-align: center; }
  #stage {
    position: relative;
    line-height: 0;
    max-width: 100%;
  }
  /* sound toggle, tucked against the top-right of the play area */
  #sound {
    position: absolute;
    top: 8px; right: -52px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.75);
    border: 2px solid #4af;
    color: #cfe9ff;
    font-size: 19px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    touch-action: manipulation;
    transition: transform .08s, background .12s, border-color .12s;
  }
  #sound:hover { background: rgba(74, 175, 255, 0.35); }
  #sound:active { transform: scale(0.9); }
  #sound.off { border-color: #667; color: #889; background: rgba(30, 30, 40, 0.75); }
  /* on narrow screens there is no room beside the canvas - move it inside */
  /* No room beside the canvas: put the button inside it. Touch devices always
     fill the width, so they always need the inside position - a width-only
     breakpoint missed big phones like the 932px iPhone Pro Max. */
  @media (max-width: 920px) {
    #sound { right: 8px; top: 44px; width: 38px; height: 38px; font-size: 17px; }
  }
  body.touch-mode #sound {
    right: 8px; top: 44px; width: 38px; height: 38px; font-size: 17px;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch-mode #sound { top: 8px; width: 34px; height: 34px; font-size: 15px; }
  }

  /* ===== name entry ===== */
  #nameOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 12, 30, 0.88);
    z-index: 30;
    line-height: normal;
  }
  #nameOverlay.show { display: flex; }
  #nameOverlay .panel {
    width: min(86%, 380px);
    background: rgba(6, 26, 50, 0.97);
    border: 3px solid #4af;
    border-radius: 6px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.35);
  }
  #nameOverlay h2 {
    color: #4af; font-size: 15px; letter-spacing: 1px; margin-bottom: 8px;
  }
  #nameOverlay p { color: #8bc; font-size: 11px; margin-bottom: 14px; }
  /* one row of the sign-up / log-in form */
  #nameOverlay .field { text-align: left; margin-bottom: 10px; }
  #nameOverlay .field.hide { display: none; }
  #nameOverlay .field label {
    display: block;
    color: #7fb0d8;
    font-size: 9px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  #nameOverlay input {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    color: #fff;
    background: #06182e;
    border: 2px solid #2a6fa8;
    border-radius: 4px;
    outline: none;
  }
  #nameOverlay input:focus { border-color: #4af; box-shadow: 0 0 12px rgba(74,175,255,0.5); }
  #nameOverlay input.invalid {
    border-color: #d05a5a; box-shadow: 0 0 10px rgba(208,90,90,0.45);
  }
  /* the eye sits inside the password box */
  #nameOverlay .passwrap { position: relative; }
  #nameOverlay .passwrap input { padding-right: 42px; }
  #passEye {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    font-size: 14px;
    line-height: 1;
    color: #8bc;
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
  }
  #passEye:hover { color: #fff; background: rgba(74,175,255,0.18); }
  #passEye.on { color: #4af; }
  /* the "log in instead / forgot password" links under the button */
  #authSwitch { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  #nameOverlay .linkbtn {
    display: none;
    font-family: inherit;
    font-size: 10px;
    color: #8bc;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }
  #nameOverlay .linkbtn.show { display: block; }
  #nameOverlay .linkbtn b { color: #4af; }
  #nameOverlay .linkbtn:hover { color: #fff; }
  #nameGo {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #04121f;
    background: #4af;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s, transform .06s;
  }
  #nameGo:hover { background: #6cf; }
  #nameGo:active { transform: scale(0.97); }
  #nameHint { margin-top: 9px; color: #567; font-size: 10px; }
  #nameHint.error { color: #ff8080; font-weight: bold; }
  #nameInput.invalid { border-color: #d05a5a; box-shadow: 0 0 10px rgba(208,90,90,0.45); }
  #nameGo:disabled {
    background: #35505f; color: #7d96a3; cursor: not-allowed; box-shadow: none;
  }
  #nameOverlay .panel { position: relative; }
  #nameClose {
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    color: #8bc;
    background: rgba(10, 30, 55, 0.9);
    border: 1px solid #2a6fa8;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
  }
  #nameClose:hover { color: #fff; border-color: #4af; background: rgba(74,175,255,0.25); }
  #nameClose:active { transform: scale(0.92); }

  /* ===== navigation ===== */
  #backBtn, #pauseBtn {
    position: absolute;
    display: none;
    font-family: inherit;
    font-weight: bold;
    color: #cfe9ff;
    background: rgba(10, 30, 55, 0.85);
    border: 2px solid #4af;
    cursor: pointer;
    z-index: 22;
    line-height: 1;
    transition: transform .06s, background .12s;
  }
  #backBtn {
    left: 8px; top: 8px;
    padding: 7px 12px;
    font-size: 12px;
    border-radius: 16px;
  }
  #pauseBtn {
    right: 8px; bottom: 8px;
    width: 40px; height: 40px;
    font-size: 13px;
    border-radius: 50%;
    align-items: center; justify-content: center;
  }
  #backBtn:hover, #pauseBtn:hover { background: rgba(74,175,255,0.35); color: #fff; }
  #backBtn:active, #pauseBtn:active { transform: scale(0.93); }
  /* landscape phones: keep these clear of the thumb controls */
  @media (orientation: landscape) and (max-height: 500px) {
    #backBtn { padding: 5px 10px; font-size: 11px; }
    #pauseBtn { width: 34px; height: 34px; font-size: 11px; right: 8px; bottom: auto; top: 8px; }
  }

  /* lets a second person on the same device claim their own id */
  #switchPlayer {
    position: absolute;
    left: 8px; top: 8px;
    padding: 5px 9px;
    font-size: 10px;
    color: #9cc;
    background: rgba(10, 30, 55, 0.8);
    border: 1px solid #35678f;
    border-radius: 14px;
    cursor: pointer;
    z-index: 20;
    line-height: normal;
    user-select: none;
  }
  #switchPlayer:hover { color: #fff; border-color: #4af; }
  #switchPlayer:active { transform: scale(0.95); }

  /* install-as-app button, only shown when the browser offers it */
  #installBtn {
    position: absolute;
    right: 8px; bottom: 8px;
    display: none;
    padding: 7px 13px;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #04121f;
    background: linear-gradient(#7cd4ff, #4af);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    z-index: 21;
    box-shadow: 0 3px 12px rgba(74,175,255,0.45);
    animation: pulseIn 2.4s ease-in-out infinite;
  }
  #installBtn:active { transform: scale(0.95); }
  @keyframes pulseIn {
    0%, 100% { box-shadow: 0 3px 12px rgba(74,175,255,0.35); }
    50%      { box-shadow: 0 3px 20px rgba(74,175,255,0.8); }
  }

  /* small transient message (installed, offline, score saved…) */
  #toast {
    position: absolute;
    left: 50%; bottom: 14px;
    transform: translateX(-50%) translateY(12px);
    padding: 9px 16px;
    font-size: 12px;
    color: #cfe9ff;
    background: rgba(6, 26, 50, 0.95);
    border: 1px solid #4af;
    border-radius: 18px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 40;
    line-height: normal;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #game {
    display: block;
    width: 100%;
    height: auto;   /* fitCanvas() sets an explicit height */
    border: 3px solid #4af;
    box-shadow: 0 0 40px rgba(74, 175, 255, 0.6);
    /* no image-rendering:pixelated - the canvas now renders at the device's
       own resolution, so letting the browser do nothing keeps text crisp */
    background: #6bd6ff;
    touch-action: none;
  }
  #info {
    margin-top: 10px;
    font-size: 12px;
    color: #8bc;
    text-align: center;
    max-width: 800px;
  }
  kbd {
    background: #223;
    border: 1px solid #4af;
    padding: 2px 6px;
    border-radius: 3px;
    color: #4af;
    font-size: 11px;
  }

  /* ===== Touch controls (mobile / tablet) ===== */
  #touch {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  body.touch-mode #touch { display: flex; }
  /* the thumb controls are dead while the pause menu is up */
  body.is-paused #touch .btn { opacity: 0.35; pointer-events: none; }
  body.touch-mode #info { display: none; }
  /* keep the play area vertically centred in the space above the buttons */
  body.touch-mode { justify-content: center; padding-bottom: 110px; }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch-mode { padding-bottom: 0; }
  }

  .pad { display: flex; gap: 12px; pointer-events: auto; }
  .btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(20, 45, 75, 0.55);
    border: 2px solid rgba(74, 175, 255, 0.85);
    color: #cfe9ff;
    font-family: inherit;
    font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    touch-action: none;
    transition: transform .06s, background .06s;
  }
  .btn.small { width: 58px; height: 58px; font-size: 16px; }
  .btn.jump { background: rgba(20, 90, 60, 0.55); border-color: rgba(80, 230, 160, 0.9); color: #d6ffe9; }
  .btn.bomb { background: rgba(15, 60, 110, 0.6); border-color: rgba(120, 200, 255, 0.95); color: #eaf6ff; }
  .btn.active { transform: scale(0.9); background: rgba(74, 175, 255, 0.65); color: #fff; }

  @media (max-width: 900px) {
    h1 { font-size: 12px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    h1 { display: none; }
    .btn { width: 56px; height: 56px; font-size: 20px; }
    .btn.small { width: 50px; height: 50px; font-size: 14px; }
    /* phone landscape: hand every pixel to the game */
    body { padding: 0; justify-content: center; }
    #game { border-width: 2px; }
  }
</style>
</head>
<body>
<h1>◆ JERRY THE WATER SAVIOUR ◆</h1>
<div id="stage">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="sound" role="button" tabindex="0" aria-label="Sound on" title="Sound on/off (M)">🔊</div>

  <div id="nameOverlay">
    <div class="panel">
      <button id="nameClose" type="button" aria-label="Close" title="Close">✕</button>
      <h2 id="authTitle">◆ CREATE ACCOUNT ◆</h2>
      <p id="authSub">Your username will appear on the leaderboard</p>

      <!-- name: signup only -->
      <div class="field" id="fieldName">
        <label for="nameInput">NAME</label>
        <input id="nameInput" type="text" maxlength="24" placeholder="Your name" required
               autocomplete="name" autocorrect="off" spellcheck="false">
      </div>

      <div class="field" id="fieldEmail">
        <label for="emailInput">EMAIL</label>
        <input id="emailInput" type="email" maxlength="120" placeholder="you@example.com" required
               autocomplete="email" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="field" id="fieldPass">
        <label for="passInput"><span id="passLabel">PASSWORD</span></label>
        <div class="passwrap">
          <input id="passInput" type="password" maxlength="64" placeholder="••••••" required
                 autocomplete="current-password" spellcheck="false">
          <button id="passEye" type="button" title="Show password" aria-label="Show password">👁</button>
        </div>
      </div>

      <button id="nameGo">CREATE &amp; PLAY</button>
      <div id="nameHint">Pick any password you like</div>

      <div id="authSwitch">
        <button type="button" class="linkbtn" data-mode="login">Already have an account? <b>Log in</b></button>
        <button type="button" class="linkbtn" data-mode="signup">New here? <b>Create account</b></button>
        <button type="button" class="linkbtn" data-mode="forgot">Forgot password?</button>
      </div>
    </div>
  </div>

  <button id="backBtn" type="button" title="Back (Esc)">◀ BACK</button>
  <button id="pauseBtn" type="button" title="Pause (Esc / P)">❚❚</button>
  <div id="switchPlayer" role="button" tabindex="0" title="Play as someone else">👤 Not you?</div>
  <button id="installBtn" type="button" title="Install this game">⬇ Install</button>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="info">
  <kbd>←</kbd> <kbd>→</kbd> move &nbsp;•&nbsp;
  <kbd>SPACE</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> jump (press again in mid-air to double jump) &nbsp;•&nbsp;
  <kbd>X</kbd> water bomb &nbsp;•&nbsp;
  <kbd>R</kbd> restart &nbsp;•&nbsp;
  <kbd>M</kbd> mute &nbsp;•&nbsp;
  <kbd>ESC</kbd> pause / back
</div>

<div id="touch">
  <div class="pad">
    <div class="btn" data-key="arrowleft">◀</div>
    <div class="btn" data-key="arrowright">▶</div>
  </div>
  <div class="pad">
    <div class="btn small bomb" data-key="x">BOMB</div>
    <div class="btn jump" data-key=" ">▲</div>
  </div>
</div>

<script>
// ============ SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// The game always thinks in this coordinate space. The canvas backing store is
// resized to the real device resolution in fitCanvas(), which keeps text sharp.
const W = 800, H = 500;
// On a wide screen (phone landscape especially) the 800x500 box leaves big
// empty margins. VIEW_W is how many game units are actually visible; anything
// wider than W is extra world shown to the left and right. HUD and menus stay
// laid out in the 800-wide box, centred inside the view.
let VIEW_W = W;
let VIEW_X = 0;      // left edge of the 800-wide UI box inside the view

// Input
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  // While paused the movement keys must not latch, or Jerry bolts the instant
  // you resume. The pause menu reads its own keys separately.
  if (paused) return;
  keys[k] = true;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ============ TOUCH / RESPONSIVE ============
// maxTouchPoints alone is unreliable (desktop Chrome reports 10), so require a
// coarse/hoverless pointer — that is what actually separates phones from mice.
const isTouch = matchMedia('(pointer: coarse)').matches ||
                matchMedia('(hover: none)').matches;
if (isTouch) document.body.classList.add('touch-mode');

// Scale the canvas to fit the viewport while keeping the 800x500 aspect ratio.
// The game keeps drawing in 800x500 space; CSS just stretches the result.
function fitCanvas() {
  const stage = document.getElementById('stage');
  const title = document.querySelector('h1');
  const info = document.getElementById('info');
  const chrome = (title && title.offsetParent ? title.offsetHeight + 6 : 0) +
                 (info && info.offsetParent ? info.offsetHeight + 10 : 0);
  // In portrait the buttons sit below the game, so reserve their height.
  // In landscape they float over the empty side areas, so reserve nothing.
  const landscape = window.innerWidth > window.innerHeight;
  // Landscape buttons float over the sides, but still keep a small margin so
  // they never sit on top of the HUD/action area at the bottom of the canvas.
  const reserved = isTouch ? (landscape ? 6 : 110) : 24;
  const availW = window.innerWidth - (isTouch && landscape ? 0 : 12);
  const availH = window.innerHeight - chrome - reserved;

  // Height decides the scale, then we let the canvas be as wide as the screen
  // allows. That extra width becomes more visible world instead of black bars,
  // so phone landscape genuinely fills the screen.
  let scale = Math.max(0.2, availH / H);
  // never let the 800-wide UI box itself overflow the screen
  scale = Math.min(scale, availW / W);
  const wantW = Math.min(availW, Math.round(W * 2.4 * scale));  // sane upper bound
  const cssW = Math.floor(Math.min(availW, Math.max(W * scale, wantW)));
  const cssH = Math.floor(H * scale);

  VIEW_W = Math.round(cssW / scale);       // game units across the canvas
  VIEW_X = Math.round((VIEW_W - W) / 2);   // centre the 800-wide UI box

  stage.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  // Render at the real device resolution instead of stretching a small bitmap,
  // which is what made text look soft.
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const pxW = Math.round(cssW * dpr);
  const pxH = Math.round(cssH * dpr);
  if (canvas.width !== pxW || canvas.height !== pxH) {
    canvas.width = pxW;
    canvas.height = pxH;
  }
  // one unit of game space -> however many real pixels that is now
  ctx.setTransform(pxH / H, 0, 0, pxH / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
fitCanvas();

// On-screen buttons drive the same `keys` map the keyboard uses.
document.querySelectorAll('#touch .btn').forEach(btn => {
  const key = btn.dataset.key;
  const press = e => {
    e.preventDefault();
    if (paused) return;          // the pause menu owns input while it is open
    keys[key] = true;
    btn.classList.add('active');
  };
  const release = e => {
    e.preventDefault();
    keys[key] = false;
    btn.classList.remove('active');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

// Tap the canvas to start / restart on menu, game over and win screens.
// A tap can begin and end inside a single frame, so latch it and let the
// game loop consume the flag instead of sampling a key that is already up.
let tapConfirm = false;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (paused) return;      // the pause menu handles its own taps
  // On the leaderboard a press might be the start of a scroll drag, so wait
  // for the pointer to lift before deciding it was a tap. Latching here would
  // let the loop consume it a frame before we know the finger moved.
  if (gameState === 'board' && !askingName) { boardPressed = true; return; }
  tapConfirm = true;
});
// Block double-tap zoom / long-press menus over the play area.
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============ AUDIO ============
// Everything is synthesised with the Web Audio API so the game stays a single
// file with no asset downloads. Browsers block audio until the user interacts,
// so the context is only created on the first tap/keypress.
const audio = {
  ctx: null,
  master: null,
  musicGain: null,
  on: true,
  timer: null,
  step: 0,
  track: null,
};

// Melodies per scene: [semitone offset from A2, ...], null = rest.
const TRACKS = {
  menu:    { bpm: 104, wave: 'triangle', bass: [0, null, 7, null, 5, null, 7, null],
             lead: [12, 16, 19, 16, 17, 16, 12, null, 12, 16, 19, 24, 22, 19, 16, null] },
  playing: { bpm: 132, wave: 'square',   bass: [0, 0, 7, 7, 5, 5, 3, 3],
             lead: [12, 12, 16, 19, 17, 16, 12, 14, 16, 16, 19, 21, 19, 16, 12, null] },
  level2:  { bpm: 142, wave: 'square',   bass: [0, 0, 6, 6, 3, 3, 5, 5],
             lead: [12, 15, 12, 18, 17, 15, 12, null, 10, 12, 15, 17, 15, 12, 10, null] },
  boss:    { bpm: 150, wave: 'sawtooth', bass: [0, 0, 1, 1, 0, 0, 3, 3],
             lead: [12, 13, 12, 8, 12, 15, 12, 8, 13, 12, 8, 6, 8, 12, 13, null] },
  villain: { bpm: 162, wave: 'sawtooth', bass: [0, 1, 0, 1, 3, 4, 3, 1],
             lead: [12, 15, 18, 15, 13, 12, 8, 12, 18, 20, 18, 15, 13, 12, 8, null] },
  win:     { bpm: 118, wave: 'triangle', bass: [0, 0, 5, 5, 7, 7, 0, 0],
             lead: [12, 16, 19, 24, 19, 24, 28, null, 26, 24, 21, 19, 17, 16, 12, null] },
  gameover:{ bpm: 76,  wave: 'triangle', bass: [0, null, -2, null, -4, null, -5, null],
             lead: [12, 10, 8, 7, 5, 3, 0, null] },
};

const midi = n => 110 * Math.pow(2, n / 12);   // A2 = 110Hz

function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.master = audio.ctx.createGain();
  audio.master.gain.value = 0.9;
  audio.master.connect(audio.ctx.destination);
  audio.musicGain = audio.ctx.createGain();
  audio.musicGain.gain.value = audio.on ? 0.16 : 0;
  audio.musicGain.connect(audio.master);
  applyVolume();
}

// One short synth note.
function tone(freq, dur, when, type, gain, dest) {
  const c = audio.ctx;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
  o.connect(g); g.connect(dest || audio.musicGain);
  o.start(when); o.stop(when + dur + 0.03);
}

// Advances the song one sixteenth-note at a time.
function musicTick() {
  if (!audio.ctx || !audio.track) return;
  const t = TRACKS[audio.track];
  if (!t) return;
  const beat = 60 / t.bpm / 2;          // eighth notes
  const now = audio.ctx.currentTime + 0.05;
  const s = audio.step;

  const b = t.bass[s % t.bass.length];
  if (b !== null && s % 2 === 0) tone(midi(b - 12), beat * 1.7, now, 'triangle', 0.5);

  const l = t.lead[s % t.lead.length];
  if (l !== null) tone(midi(l), beat * 0.85, now, t.wave, 0.22);

  // light hats to keep a pulse on the action tracks
  if (audio.track !== 'gameover' && s % 2 === 1) {
    tone(7000 + Math.random() * 900, 0.02, now, 'square', 0.03);
  }

  audio.step++;
  audio.timer = setTimeout(musicTick, beat * 1000);
}

function playMusic(name) {
  if (audio.track === name) return;
  audio.track = name;
  audio.step = 0;
  if (!audio.ctx) return;
  clearTimeout(audio.timer);
  musicTick();
}

function stopMusic() {
  clearTimeout(audio.timer);
  audio.timer = null;
  audio.track = null;
}

// Short sound effects, mixed above the music.
function sfx(kind) {
  if (!audio.ctx || !audio.on) return;
  const c = audio.ctx, now = c.currentTime;
  if (kind === 'jump') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(300, now);
    o.frequency.exponentialRampToValueAtTime(760, now + 0.11);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.16);
  } else if (kind === 'throw') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(680, now);
    o.frequency.exponentialRampToValueAtTime(200, now + 0.13);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.17);
  } else if (kind === 'hit') {
    // noise burst
    const len = Math.floor(c.sampleRate * 0.16);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = 0.22;
    src.connect(g); g.connect(audio.master);
    src.start(now);
  } else if (kind === 'power') {
    [0, 4, 7, 12].forEach((n, i) =>
      tone(midi(12 + n), 0.14, now + i * 0.07, 'square', 0.16, audio.master));
  } else if (kind === 'hurt') {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(420, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.35);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    o.connect(g); g.connect(audio.master);
    o.start(now); o.stop(now + 0.4);
  } else if (kind === 'boom') {
    const len = Math.floor(c.sampleRate * 0.45);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = c.createGain(); g.gain.value = 0.4;
    src.connect(f); f.connect(g); g.connect(audio.master);
    src.start(now);
  }
}

// Volume in steps, so it can be cycled from the menu with one key.
const VOLUME_STEPS = [0, 0.25, 0.5, 0.75, 1];
let volumeStep = 3;                          // 75% by default
try {
  const v = parseInt(localStorage.getItem('jerry-volume'), 10);
  if (v >= 0 && v < VOLUME_STEPS.length) volumeStep = v;
} catch (e) {}

function volumeLabel() {
  if (!audio.on || volumeStep === 0) return 'OFF';
  return Math.round(VOLUME_STEPS[volumeStep] * 100) + '%';
}

function setVolumeStep(i) {
  volumeStep = ((i % VOLUME_STEPS.length) + VOLUME_STEPS.length) % VOLUME_STEPS.length;
  try { localStorage.setItem('jerry-volume', String(volumeStep)); } catch (e) {}
  // step 0 is the same as muting, so keep the toggle in sync
  setAudioOn(volumeStep > 0);
}

function applyVolume() {
  if (!audio.master) return;
  const level = audio.on ? VOLUME_STEPS[volumeStep] : 0;
  const c = audio.ctx;
  audio.master.gain.cancelScheduledValues(c.currentTime);
  audio.master.gain.linearRampToValueAtTime(0.9 * level, c.currentTime + 0.12);
}

function setAudioOn(on) {
  audio.on = on;
  // turning sound back on from the button should not leave it at zero
  if (on && volumeStep === 0) volumeStep = 3;
  if (audio.musicGain) {
    const c = audio.ctx;
    audio.musicGain.gain.cancelScheduledValues(c.currentTime);
    audio.musicGain.gain.linearRampToValueAtTime(on ? 0.16 : 0, c.currentTime + 0.15);
  }
  applyVolume();
  const btn = document.getElementById('sound');
  if (btn) {
    btn.textContent = on ? '🔊' : '🔇';
    btn.classList.toggle('off', !on);
    btn.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
  }
  try { localStorage.setItem('jerry-sound', on ? '1' : '0'); } catch (e) {}
}

// Audio can only start inside a user gesture.
function unlockAudio() {
  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  if (audio.track && !audio.timer) musicTick();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { passive: true }));

// Sound toggle button. stopPropagation keeps the click off the canvas so it
// cannot double as a "tap to start".
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  e.preventDefault();
  unlockAudio();
  setAudioOn(!audio.on);
});
soundBtn.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.stopPropagation();
    e.preventDefault();
    unlockAudio();
    setAudioOn(!audio.on);
  }
});

// M key toggles sound too
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'm') {
    unlockAudio();
    setAudioOn(!audio.on);
  }
});

// restore the saved preference
try {
  const saved = localStorage.getItem('jerry-sound');
  if (saved !== null) audio.on = saved === '1';
} catch (e) {}
setAudioOn(audio.on);

// ============ PLAYER PROFILE + LEADERBOARD ============
// Talks to the local API (see server.js), which stores everything as CSV in
// ./media. If the server is not running the game still plays; scores are then
// kept in this browser and pushed up the next time the API is reachable.
const API = '/api';

const profile = {
  id: null,
  name: '',
  gamesPlayed: 0,
  bestScore: 0,
  bestLevel: 1,
  bestTimeMs: 0,
  totalTimeMs: 0,        // every run added up, shown on the board
  rank: null,
  totalPlayers: 0,
  history: [],
  returning: false,      // true when we recognised a saved id
};

const leaderboard = { rows: [], status: 'idle' };  // idle|loading|ok|offline

// The ranking table scrolls, so every player can be read however many there
// are. Geometry lives here because both the drawing and the input need it.
const BOARD_ROW_H = 24;      // height of one row
const BOARD_VIEW_Y = 155;    // top of the scrolling window
const BOARD_VIEW_H = 264;    // how much of the table is visible at once
let boardScroll = 0;         // pixels scrolled down
let boardScrollMax = 0;      // set while drawing, from the row count
let boardDrag = null;        // in-progress touch/mouse drag
let boardPressed = false;    // the press that may become a tap started here

const ID_KEY = 'jerry-player-id';
const NAME_KEY = 'jerry-player-name';
// only the address, so a returning player lands on the log-in form with it
// already filled in. The password is never kept on the device.
const EMAIL_KEY = 'jerry-player-email';
const PENDING_KEY = 'jerry-pending-scores';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

async function apiJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    // keep the status and any server message so callers can react to 409
    let msg = 'HTTP ' + res.status;
    try { const b = await res.json(); if (b && b.error) msg = b.error; } catch (e) {}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function applyProfile(p) {
  profile.id = p.id;
  profile.name = p.name;
  profile.gamesPlayed = p.gamesPlayed || 0;
  profile.bestScore = p.bestScore || 0;
  profile.bestLevel = p.bestLevel || 1;
  profile.bestTimeMs = p.bestTimeMs || 0;
  profile.totalTimeMs = p.totalTimeMs || 0;
  profile.rank = p.rank == null ? null : p.rank;
  profile.totalPlayers = p.totalPlayers || 0;
  profile.history = p.history || [];
  playerName = p.name;
}

// Look up the saved id so a returning player is greeted by name.
async function loadSavedPlayer() {
  const id = store.get(ID_KEY);
  if (!id) return false;
  try {
    const p = await apiJson(`${API}/player?id=${encodeURIComponent(id)}`);
    applyProfile(p);
    profile.returning = true;
    store.set(NAME_KEY, p.name);
    flushPendingScores();
    return true;
  } catch (e) {
    // No server: fall back to whatever this browser remembers.
    const savedName = store.get(NAME_KEY);
    if (savedName) {
      profile.id = id;
      profile.name = savedName;
      playerName = savedName;
      profile.returning = true;
      applyLocalStats();
      return true;
    }
    return false;
  }
}

async function registerPlayer(name) {
  const clean = (name || 'PLAYER').trim().toUpperCase().slice(0, 12) || 'PLAYER';
  try {
    const p = await apiJson(`${API}/player`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: clean }),
    });
    applyProfile(p);
    store.set(ID_KEY, p.id);
    store.set(NAME_KEY, p.name);
    profile.returning = false;
    return true;
  } catch (e) {
    // The server said this name belongs to someone else - that is a real
    // answer, not an outage, so surface it instead of playing on locally.
    if (e.status === 409) throw e;

    // No server (static hosting or it is down): keep playing locally, and
    // remember the name so a reload still recognises them.
    // Locally we can still stop an obvious duplicate.
    if (localNameTaken(clean)) {
      const err = new Error('That name is already used on this device.');
      err.status = 409;
      throw err;
    }
    profile.id = store.get(ID_KEY) || 'local_' + Math.random().toString(36).slice(2, 10);
    store.set(ID_KEY, profile.id);
    store.set(NAME_KEY, clean);
    profile.name = clean;
    playerName = clean;
    profile.returning = false;
    applyLocalStats();
    return false;
  }
}

// Offline duplicate check: has this browser already recorded runs under that
// name for a different player id?
function localNameTaken(name) {
  const nm = String(name || '').trim().toUpperCase();
  return loadLocalRuns().some(r =>
    String(r.name || '').toUpperCase() === nm && r.id !== profile.id);
}

// Rebuilds profile numbers from the runs saved in this browser.
function applyLocalStats() {
  const mine = loadLocalRuns().filter(r => r.name === profile.name);
  profile.gamesPlayed = mine.length;
  profile.bestScore = mine.reduce((m, r) => Math.max(m, r.score), 0);
  profile.bestLevel = mine.reduce((m, r) => Math.max(m, r.level), 1);
  profile.history = mine
    .slice()
    .sort((a, b) => new Date(b.playedAt) - new Date(a.playedAt))
    .slice(0, 20);
  const board = localBoard();
  const entry = board.find(r => r.name === profile.name);
  profile.rank = entry ? entry.rank : null;
  profile.totalPlayers = board.length;
  profile.bestTimeMs = entry ? entry.durationMs : 0;
  profile.totalTimeMs = mine.reduce((s, r) => s + (r.durationMs || 0), 0);
}

// Scores recorded while the server was down, retried later.
function queuePending(entry) {
  let q = [];
  try { q = JSON.parse(store.get(PENDING_KEY) || '[]'); } catch (e) {}
  q.push(entry);
  store.set(PENDING_KEY, JSON.stringify(q.slice(-50)));
}

async function flushPendingScores() {
  let q = [];
  try { q = JSON.parse(store.get(PENDING_KEY) || '[]'); } catch (e) {}
  if (!q.length || !profile.id) return;
  const left = [];
  for (const e of q) {
    try {
      const p = await apiJson(`${API}/score`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: profile.id, score: e.score, level: e.level, durationMs: e.durationMs }),
      });
      applyProfile(p);
    } catch (err) { left.push(e); }
  }
  store.set(PENDING_KEY, JSON.stringify(left));
}

async function submitScore(score, level, durationMs, mode) {
  const playedAt = new Date().toISOString();
  const entry = { score, level, durationMs, playedAt, mode };
  // optimistic local update so the end screen is correct straight away
  profile.gamesPlayed++;
  profile.totalTimeMs = (profile.totalTimeMs || 0) + (durationMs || 0);
  if (score > profile.bestScore) profile.bestScore = score;
  if (level > profile.bestLevel) profile.bestLevel = level;
  profile.history.unshift({ score, level, durationMs, playedAt, mode });

  // always keep a copy in this browser, so the board works with no server
  saveLocalRun({ id: profile.id || 'local', name: profile.name || 'PLAYER',
                 score, level, durationMs, playedAt, mode });

  if (!profile.id) { fetchLeaderboard(); return; }
  try {
    const p = await apiJson(`${API}/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: profile.id, score, level, durationMs, mode }),
    });
    applyProfile(p);
  } catch (e) {
    queuePending(entry);
    // offline: work out our own rank from the local runs
    const board = localBoard();
    const mine = board.find(r => r.name === profile.name);
    profile.rank = mine ? mine.rank : null;
    profile.totalPlayers = board.length;
    profile.bestTimeMs = mine ? mine.durationMs : 0;
    profile.totalTimeMs = mine ? mine.totalTimeMs : 0;
  }
  fetchLeaderboard();
}

async function fetchLeaderboard() {
  leaderboard.status = 'loading';
  try {
    const d = await apiJson(`${API}/leaderboard?limit=50`);
    leaderboard.rows = d.rows || [];
    leaderboard.status = 'ok';
  } catch (e) {
    // No API (static hosting, or the server is down). Show this device's own
    // runs so the board is never just an empty screen.
    leaderboard.rows = localBoard();
    leaderboard.status = 'offline';
  }
}

// Builds a board out of the runs stored in this browser, ranked with the same
// rules the server uses.
function localBoard() {
  const runs = loadLocalRuns();
  const best = new Map();
  const totals = new Map();
  for (const r of runs) {
    const cur = best.get(r.name);
    if (!cur || compareRunsClient(r, cur) < 0) best.set(r.name, r);
    totals.set(r.name, (totals.get(r.name) || 0) + (r.durationMs || 0));
  }
  const rows = [...best.values()].sort(compareRunsClient);
  rows.forEach((r, i) => {
    r.rank = i + 1;
    r.totalTimeMs = totals.get(r.name) || 0;   // matches what the server sends
  });
  return rows;
}

function compareRunsClient(a, b) {
  if (b.score !== a.score) return b.score - a.score;
  const ad = a.durationMs || Infinity, bd = b.durationMs || Infinity;
  if (ad !== bd) return ad - bd;
  const at = new Date(a.playedAt).getTime() || 0;
  const bt = new Date(b.playedAt).getTime() || 0;
  if (at !== bt) return at - bt;
  return String(a.id || '').localeCompare(String(b.id || ''));
}

const LOCAL_RUNS_KEY = 'jerry-local-runs';

function loadLocalRuns() {
  try { return JSON.parse(store.get(LOCAL_RUNS_KEY) || '[]'); }
  catch (e) { return []; }
}

function saveLocalRun(entry) {
  const runs = loadLocalRuns();
  runs.push(entry);
  // keep the file small; only the best 100 matter for a board
  runs.sort(compareRunsClient);
  store.set(LOCAL_RUNS_KEY, JSON.stringify(runs.slice(0, 100)));
}

// ============ PWA ============
// Registers the service worker so the game installs to the home screen and
// keeps working with no connection.
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, ms) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2600);
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // A cached old build would otherwise stick around until every tab is
      // closed. Watch for a new worker and reload as soon as it takes over.
      reg.addEventListener('updatefound', () => {
        const fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener('statechange', () => {
          if (fresh.state === 'installed' && navigator.serviceWorker.controller) {
            toast('Update ready - reloading');
            setTimeout(() => location.reload(), 900);
          }
        });
      });
      reg.update();
    }).catch(() => {});
  });

  // if the worker is replaced, pick up the new version once
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}

// Chrome/Edge fire this instead of installing straight away; we stash it and
// show our own button so the prompt appears at a sensible moment.
const installBtn = document.getElementById('installBtn');
let installPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  if (installBtn) installBtn.style.display = 'block';
});

if (installBtn) {
  installBtn.addEventListener('click', async e => {
    e.stopPropagation();
    if (!installPrompt) return;
    installBtn.style.display = 'none';
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null;
    if (outcome === 'accepted') toast('Installed! Look for Jerry on your home screen');
    else if (installBtn) installBtn.style.display = 'block';
  });
  installBtn.addEventListener('pointerdown', e => e.stopPropagation());
}

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  if (installBtn) installBtn.style.display = 'none';
  toast('Installed! Look for Jerry on your home screen');
});

window.addEventListener('online', () => {
  toast('Back online - syncing scores');
  flushPendingScores().then(fetchLeaderboard);
});
window.addEventListener('offline', () => toast('Offline - scores will sync later'));

function askName() {
  askingName = true;
  nameOverlay.classList.add('show');
  // someone who has signed up before lands on the log-in form
  setAuthMode(store.get(EMAIL_KEY) ? 'login' : 'signup');
  nameInput.value = '';
  emailInput.value = store.get(EMAIL_KEY) || '';
  passInput.value = '';
  showNameError('');
  refreshNameState();
  // the close button is only useful when there is something to go back to
  nameClose.style.display = profile.id ? 'flex' : 'none';
  // focusing immediately can be ignored on mobile, so defer a frame
  setTimeout(() => {
    const first = authMode === 'signup' ? nameInput : emailInput;
    first.focus();
    first.select();
  }, 50);
}

function closeNameOverlay() {
  nameOverlay.classList.remove('show');
  askingName = false;
  nameInput.blur(); emailInput.blur(); passInput.blur();
}

// Backing out of the dialog. Only possible when a player already exists -
// a first-time visitor has to sign in to play.
function cancelName() {
  if (!profile.id) return;
  showNameError('');
  closeNameOverlay();
}

// What is missing before this form can be sent.
function authError() {
  const m = AUTH_MODES[authMode];
  if (m.showName) {
    const n = nameInput.value.trim();
    if (!n) return 'Please enter your name';
    if (n.length < 2) return 'Name must be at least 2 characters';
    if (!/[a-z0-9]/i.test(n)) return 'Name needs at least one letter or number';
  }
  const em = emailInput.value.trim();
  if (!em) return 'Please enter your email';
  if (!/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(em)) return 'That email does not look right';
  if (passInput.value.length < 4) return 'Password must be at least 4 characters';
  return '';
}

function showNameError(msg) {
  nameHint.textContent = msg || (AUTH_MODES[authMode] || AUTH_MODES.signup).hint;
  nameHint.classList.toggle('error', !!msg);
}

function refreshNameState() {
  nameGo.disabled = !!authError();
  // clear the red outline as soon as a field is being fixed
  [nameInput, emailInput, passInput].forEach(i => i.classList.remove('invalid'));
}

async function confirmName() {
  const bad = authError();
  if (bad) {
    showNameError(bad);
    // point at the field that needs attention
    const target = /name/i.test(bad) ? nameInput
                 : /email/i.test(bad) ? emailInput : passInput;
    target.classList.add('invalid');
    target.focus();
    return;
  }

  const busy = { signup: 'CREATING...', login: 'LOGGING IN...', forgot: 'SAVING...' }[authMode];
  const label = nameGo.textContent;
  nameGo.disabled = true;
  nameGo.textContent = busy;

  try {
    await submitAuth();
  } catch (e) {
    nameGo.disabled = false;
    nameGo.textContent = label;
    showNameError(e.message || 'Something went wrong, try again');
    // an existing email on signup is really an invitation to log in
    if (authMode === 'signup' && e.status === 409) {
      emailInput.classList.add('invalid');
      setTimeout(() => { setAuthMode('login'); showNameError('You already have an account - log in'); }, 900);
    } else if (authMode === 'login' && e.status === 401) {
      passInput.classList.add('invalid');
      passInput.focus(); passInput.select();
    } else if (e.status === 404) {
      emailInput.classList.add('invalid');
      emailInput.focus();
    }
    return;
  }

  nameGo.disabled = false;
  nameGo.textContent = label;
  closeNameOverlay();
  unlockAudio();
  fetchLeaderboard();
  startRun();
}

// Talks to /api/auth and stores whoever comes back.
async function submitAuth() {
  const body = {
    name: nameInput.value.trim(),
    email: emailInput.value.trim(),
    password: passInput.value,
  };
  // the panel calls it "forgot"; the API calls the same thing "reset"
  const action = authMode === 'forgot' ? 'reset' : authMode;
  const acc = await apiJson(`${API}/auth?action=${action}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  applyAccount(acc);
  // Pull in their scores and rank. applyAccount() has already stored the id,
  // so this loads the account we just signed in as. A failure here only means
  // the stats are stale - they are still logged in.
  try { await loadSavedPlayer(); } catch (e) {}
  // loadSavedPlayer() overwrites the name from the players table; the account's
  // username is the authority.
  profile.name = acc.username;
  playerName = acc.username;
  return acc;
}

// Remembers the account on this device and points the game at it.
function applyAccount(acc) {
  profile.id = acc.id;
  profile.name = acc.username;
  playerName = acc.username;
  profile.returning = false;
  store.set(ID_KEY, acc.id);
  store.set(NAME_KEY, acc.username);
  store.set(EMAIL_KEY, acc.email);
}

// Two-stage powerup, Mario style. Jerry starts small with no bomb:
//   stage 0 (small)  -- hit a power block -> stage 1
//   stage 1 (big)    -- hit another power block -> stage 2
//   stage 2 (armed)  -- big AND able to throw water bombs
// Taking a hit knocks him down one stage instead of costing a life.
const BOMB_COOLDOWN = 46; // frames (~0.77s at 60fps)

const jerry = {
  x: 100, y: 300, vx: 0, vy: 0,
  w: 28, h: 36,
  onGround: false,
  stage: 0,
  powered: false,   // stage >= 1: bigger droplet
  hasBomb: false,   // stage 2 only: a bomb is ready to throw
  bombCooldown: 0,
  powers: new Set(),   // level rewards, kept for the rest of the run
  shield: false,       // 'shield' power charge, spent on the next hit
  shieldCd: 0,         // frames until the shield comes back
  jumps: 0,            // jumps used since leaving the ground
  facing: 1,
  invuln: 0,
  _xheld: false,
  // One held flag per jump key. A single shared flag meant that holding W
  // swallowed a later Space press, because "some jump key is down" never
  // changed and so no new press was ever detected.
  _jumpHeld: { ' ': false, w: false, arrowup: false },
  _coyote: 0
};

// The three jump keys are interchangeable - same height from each, so a
// player never has to learn which one jumps higher.
const JUMP_KEYS = [' ', 'w', 'arrowup'];

// Walking off a ledge without jumping used to leave jumps at 0, which handed
// the player both jumps in mid-air. Falling now spends the ground jump, so a
// step off an edge leaves exactly the one double jump - but only after a few
// frames of grace, the usual "coyote time", so a jump pressed just after the
// edge still counts as a proper ground jump.
const COYOTE_FRAMES = 6;
function spendLedgeJump() {
  if (jerry.onGround) { jerry._coyote = COYOTE_FRAMES; return; }
  if (jerry._coyote > 0) jerry._coyote--;
  else if (jerry.jumps === 0) jerry.jumps = 1;
}

// True when any jump key was newly pressed this frame. Each key keeps its own
// held flag: a single shared flag meant holding W swallowed a later Space
// press, because "some jump key is down" never changed back to false.
function jumpPressed() {
  let pressed = false;
  for (const key of JUMP_KEYS) {
    const down = !!keys[key];
    if (down && !jerry._jumpHeld[key]) pressed = true;
    jerry._jumpHeld[key] = down;
  }
  return pressed;
}

// Applies whatever a given stage means, so every place agrees.
function setStage(n) {
  jerry.stage = Math.max(0, Math.min(2, n));
  jerry.powered = jerry.stage >= 1;
  if (jerry.stage < 2) {
    jerry.hasBomb = false;
    jerry.bombCooldown = 0;
  } else {
    jerry.hasBomb = true;
    jerry.bombCooldown = 0;
  }
}

// ---- level powers ----
// Unlocked by reaching a level's second power block; they stack and persist
// for the rest of the run, so later levels feel genuinely stronger.
const POWER_INFO = {
  bomb:       { label: 'WATER BOMB',  blurb: 'Press [X] to throw water bombs' },
  rapid:      { label: 'RAPID FIRE',  blurb: 'Throw far more often' },
  triple:     { label: 'TRIPLE SHOT', blurb: 'Three bombs in a spread' },
  swift:      { label: 'SWIFT CURRENT', blurb: 'Run noticeably faster' },
  shield:     { label: 'SHIELD',      blurb: 'Absorbs one hit, then recharges' },
  pierce:     { label: 'PIERCING',    blurb: 'Bombs pass through enemies' },
  blast:      { label: 'BLAST RADIUS',blurb: 'Bigger explosions' },
  overdrive:  { label: 'OVERDRIVE',   blurb: 'Maximum fire rate' },
};

function hasPower(p) { return jerry.powers.has(p); }

function grantPower(p) {
  if (!p || jerry.powers.has(p)) return false;
  jerry.powers.add(p);
  if (p === 'shield') jerry.shield = true;
  return true;
}

// Cooldown shrinks as fire-rate powers stack up.
// The fire-rate powers used to stack down to 5 frames - a bomb every 0.08s,
// which turned every fight into holding X. They still help, but the floor is
// high enough that each throw has to be aimed.
function bombCooldownFrames() {
  let cd = BOMB_COOLDOWN;
  if (hasPower('rapid')) cd *= 0.72;
  if (hasPower('overdrive')) cd *= 0.8;
  return Math.max(24, Math.round(cd));
}

function bombRadius() { return hasPower('blast') ? 15 : 9; }

// SWIFT CURRENT: a straight run-speed boost from level 4 on.
function moveSpeed() { return hasPower('swift') ? MOVE_SPEED * 1.3 : MOVE_SPEED; }

// Every throw goes through here so all levels behave the same.
function throwBombs(speed) {
  const dirs = hasPower('triple') ? [-0.32, 0, 0.32] : [0];
  // In a boss fight the target is what matters, and the boss often ends up
  // behind you - so aim at him rather than at whichever way Jerry last walked.
  let dir = jerry.facing;
  // A flat throw is right for ground enemies but never reaches a boss who
  // flies; lift the arc towards whatever we are actually aiming at.
  let lift = -1.5;
  if (gameState === 'villain' && villain) {
    dir = Math.sign((villain.x + villain.w / 2) - (jerry.x + jerry.w / 2)) || jerry.facing;
    jerry.facing = dir;              // turn to look at him as well
    // Solve for the launch speed that peaks at the boss's height: with
    // gravity g per frame, rising dy needs vy = sqrt(2*g*dy), plus a little
    // margin so the bomb is still climbing when it arrives.
    const dy = (jerry.y + jerry.h / 2) - (villain.y + villain.h / 2);
    if (dy > 40) lift = -Math.sqrt(2 * (GRAVITY * 0.5) * (dy + 40));
  }
  for (const spread of dirs) {
    bombs.push({
      x: jerry.x + jerry.w / 2,
      y: jerry.y + jerry.h / 2,
      vx: dir * (speed || 9),
      vy: lift + spread * 9,
      r: bombRadius(),
      pierce: hasPower('pierce'),
      hits: 0,
    });
  }
  jerry.hasBomb = false;
  jerry.bombCooldown = bombCooldownFrames();
  sfx('throw');
}

// ============ LEVEL GENERATION ============
// Built from the LEVELS table so every stage scales the same way.
let platforms = [];
let hazards = [];
let blocks = [];
let enemies = [];
let signs = [];
let goal = { x: 0, y: 0, w: 40, h: 130 };
let boss = null;

const EDU_LINES = [
  'FILTRATION: sand and gravel filters trap solid particles from wastewater.',
  'SEWAGE carries harmful microbes and chemicals. Never touch it directly!',
  'Industries dump waste into rivers. Together we must hold them accountable!',
  'CHLORINATION kills bacteria and viruses in most city water supplies.',
  'UV DISINFECTION cleans water using light instead of chemicals.',
  'Heavy metals like lead and mercury build up in fish and in people.',
  'Wetlands act as natural filters - protecting them protects our water.',
  'One litre of oil can pollute a million litres of drinking water.',
];

// Enemy templates. Ground walkers sit on the floor, fliers hover.
function makeEnemy(kind, x, minX, maxX, speed) {
  const base = { x, alive: true, minX, maxX, type: kind };
  if (kind === 'trash')
    return { ...base, y: GROUND_Y - 30, w: 30, h: 30, vx: -1.2 * speed };
  if (kind === 'drum')
    return { ...base, y: GROUND_Y - 40, w: 40, h: 40, vx: 0 };
  if (kind === 'barrel')
    return { ...base, y: GROUND_Y - 34, w: 34, h: 34, vx: -1.8 * speed };
  if (kind === 'drone')
    return { ...base, y: 250, w: 32, h: 26, vx: 1.6 * speed,
             baseY: 200 + Math.random() * 90, phase: Math.random() * 6 };
  if (kind === 'spitter')
    return { ...base, y: GROUND_Y - 38, w: 34, h: 38, vx: 0.7 * speed,
             fireTimer: 60 + Math.floor(Math.random() * 90) };
  if (kind === 'chaser')
    return { ...base, y: GROUND_Y - 32, w: 32, h: 32, vx: 1.1 * speed, speed };
  return { ...base, y: GROUND_Y - 30, w: 30, h: 30, vx: -1.2 * speed };
}

// Turns a LEVELS row into an actual playable map.
function buildLevel(n) {
  const d = levelDef(n);
  const end = d.len;
  const rnd = mulberry(n * 7919);      // same layout every time you replay

  // --- ground split by sewage pits ---
  platforms = [];
  hazards = [];
  const segCount = d.gaps + 1;
  const usable = end - 260;            // keep the start and the goal solid
  const segW = usable / segCount;
  let x = 0;
  for (let i = 0; i < segCount; i++) {
    const isLast = i === segCount - 1;
    const w = isLast ? end - x : segW - d.gapW;
    platforms.push({ x, y: GROUND_Y, w: Math.max(120, w), h: 60, kind: 'ground' });
    x += Math.max(120, w);
    if (!isLast) {
      hazards.push({ x, y: GROUND_Y, w: d.gapW, h: 60 });
      x += d.gapW;
    }
  }

  // --- floating brick platforms, higher and thinner as levels go up ---
  const brickCount = 5 + Math.floor(n * 0.8);
  const brickW = Math.max(52, 126 - n * 9);   // narrower ledges later on
  for (let i = 0; i < brickCount; i++) {
    const bx = 300 + (i * (end - 500) / brickCount) + rnd() * 90;
    const by = 340 - rnd() * (90 + n * 10);
    platforms.push({ x: Math.round(bx), y: Math.round(by), w: brickW, h: 18, kind: 'brick' });
  }

  // --- power blocks: two early ones so bombs are always earnable ---
  // Both must sit over solid ground, otherwise the level's bomb is unreachable.
  blocks = [];
  for (const [wantX, type] of [[250, 'filter'], [620, 'uv']]) {
    blocks.push({ x: solidXNear(wantX), y: 300, w: 40, h: 40, type, hit: false });
  }
  // bonus blocks, fewer the further you get
  const bonus = Math.max(3, 8 - Math.floor(n / 2));
  for (let i = 0; i < bonus; i++) {
    const bx = 900 + i * ((end - 1200) / bonus) + rnd() * 60;
    const by = 320 - rnd() * (80 + n * 8);
    const roll = rnd();
    const type = roll < 0.5 ? 'water' : roll < 0.78 ? 'chlorine' : 'filter';
    const bl = { x: Math.round(bx), y: Math.round(by), w: 40, h: 40, type, hit: false };
    if (!overlapsAny(bl, platforms) && !overSewage(bl)) blocks.push(bl);
  }

  // --- enemies spread across the level ---
  enemies = [];
  for (let i = 0; i < d.enemies; i++) {
    const kind = d.kinds[i % d.kinds.length];
    const span = (end - 700) / d.enemies;
    const from = 500 + i * span;
    enemies.push(makeEnemy(kind, from + span * 0.4, from, from + span, d.speed * diff().speed));
  }

  // --- signs: level intro plus a couple of facts ---
  signs = [
    { x: 150, y: GROUND_Y - 50, text: d.intro },
    { x: Math.round(end * 0.42), y: GROUND_Y - 50, text: EDU_LINES[(n * 2) % EDU_LINES.length] },
    { x: Math.round(end * 0.72), y: GROUND_Y - 50, text: EDU_LINES[(n * 2 + 1) % EDU_LINES.length] },
  ];
  signs.forEach(s => s.shown = false);

  goal = { x: end - 150, y: GROUND_Y - 130, w: 40, h: 130 };

  // Checkpoints on solid ground, thinning out as the levels go on. Three of
  // them everywhere meant a death cost almost nothing and every player walked
  // to level 8; the last levels now make you hold your ground for longer.
  checkpoints = [];
  const cpCount = n <= 2 ? 3 : n <= 5 ? 2 : 1;
  for (let i = 1; i <= cpCount; i++) {
    checkpoints.push({ x: solidXNear(Math.round((end * i) / (cpCount + 1))), taken: false });
  }
  checkpointX = 60;

  levelData = { ...d, end };
  return levelData;
}

// Nearest x to `want` that has ground under it and is clear of every pit.
function solidXNear(want) {
  const ok = x => {
    const onGround = platforms.some(p =>
      p.kind === 'ground' && x > p.x + 20 && x + 40 < p.x + p.w - 20);
    const clear = !hazards.some(h => x + 40 > h.x - 20 && x < h.x + h.w + 20);
    return onGround && clear;
  };
  if (ok(want)) return want;
  for (let step = 20; step <= 900; step += 20) {
    if (ok(want + step)) return want + step;
    if (want - step > 60 && ok(want - step)) return want - step;
  }
  return want;
}

function overlapsAny(r, list) {
  return list.some(p => rectHit(
    { x: r.x - 6, y: r.y - 6, w: r.w + 12, h: r.h + 12 }, p));
}
function overSewage(r) {
  return hazards.some(h => r.x + r.w > h.x - 10 && r.x < h.x + h.w + 10);
}

// Small seeded RNG so a level looks identical every time it is replayed.
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resetLevel() { buildLevel(level); }

// ============ HELPERS ============
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function eduText(type) {
  return ({
    filter:   'FILTRATION: Sand & carbon filters trap dirt and solids.',
    chlorine: 'CHLORINATION: Chlorine kills bacteria & viruses. Used in most city water supplies.',
    uv:       'UV DISINFECTION: Ultraviolet light kills germs without chemicals.',
    water:    'Clean water collected! Every drop matters. +50 points',
  })[type];
}

function showPopup(text) { popup = { text, timer: 200 }; }

// ---- combo scoring ----
// Every kill inside the combo window raises the multiplier. Getting hit or
// letting the timer run out drops it back to zero.
function addKillScore(base, x, y) {
  combo++;
  comboTimer = 150;                       // ~2.5s to land the next one
  comboBest = Math.max(comboBest, combo);
  const mult = Math.min(8, combo);        // caps so it stays sane
  const gained = base * mult;
  score += gained;
  floatText.push({
    x, y, vy: -1.1, life: 60,
    text: '+' + gained + (mult > 1 ? '  x' + mult : ''),
    color: mult >= 5 ? '#ff8' : mult >= 3 ? '#8f8' : '#fff',
  });
  if (mult > 1) sfx('power');
  return gained;
}

function breakCombo() {
  combo = 0;
  comboTimer = 0;
}

function updateFloatText() {
  for (const f of floatText) { f.y += f.vy; f.life--; }
  floatText = floatText.filter(f => f.life > 0);
  if (comboTimer > 0 && --comboTimer === 0) combo = 0;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 6 - 1,
      color, life: 45, size: 2 + Math.random() * 4
    });
  }
}

function damagePlayer() {
  if (jerry.invuln > 0) return;
  breakCombo();          // getting hit always costs your streak

  // SHIELD soaks the hit and then recharges over a few seconds
  if (jerry.shield) {
    jerry.shield = false;
    jerry.shieldCd = 720;   // 12s - a real safety net, not a free pass
    jerry.invuln = 60;
    sfx('hit');
    spawnParticles(jerry.x + 14, jerry.y + 18, '#6ef', 18);
    return;
  }

  // In the boss arena bombs are the only weapon, so losing them would make the
  // fight unwinnable - take a life instead of dropping a stage.
  const inBossFight = gameState === 'villain';
  if (jerry.stage > 0 && !inBossFight) {
    // drop one stage: armed -> big -> small, only then lose a life
    setStage(jerry.stage - 1);
    jerry.invuln = 90;
    spawnParticles(jerry.x + 14, jerry.y + 18, '#fff', 12);
    sfx('hurt');
  } else {
    lives--;
    sfx('hurt');
    if (lives <= 0) { gameState = 'gameover'; return; }
    respawnPlayer();
  }
}

function respawnPlayer() {
  if (gameState === 'villain') {
    // respawn on the far side from the villain so he can't camp the spawn
    jerry.x = villain && villain.x < W / 2 ? W - 110 : 70;
    jerry.y = 280;
    villainShots = [];
  } else {
    // Send Jerry back to the last checkpoint he touched rather than a blind
    // 200px back, which could drop him straight into the pit that killed him.
    jerry.x = checkpointX;
    jerry.y = 200;
    // clear sludge near the respawn so you are not hit instantly
    villainShots = villainShots.filter(s => Math.abs(s.x - jerry.x) > 220);
    // give the nearby enemies a moment of breathing room
    for (const e of enemies) {
      if (e.alive && Math.abs(e.x - jerry.x) < 150) e.alive = false;
    }
  }
  jerry.vx = 0; jerry.vy = 0;
  jerry.jumps = 0;
  jerry.invuln = 120;
  breakCombo();
}

// Checkpoints sit on solid ground every so often through a level.
function updateCheckpoints() {
  for (const c of checkpoints) {
    if (c.taken) continue;
    if (jerry.x + jerry.w > c.x && jerry.x < c.x + 30) {
      c.taken = true;
      checkpointX = c.x;
      sfx('power');
      spawnParticles(c.x + 12, GROUND_Y - 40, '#4f8', 16);
      floatText.push({ x: c.x + 12, y: GROUND_Y - 60, vy: -1,
                       life: 70, text: 'CHECKPOINT', color: '#4f8' });
    }
  }
}

// ============ UPDATE ============
function updatePlaying() {
  const d = levelData || levelDef(level);

  // ---- input ----
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -moveSpeed();
  if (keys['arrowright'] || keys['d']) ax = moveSpeed();
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  // Jump, plus one mid-air double jump. MAX_JUMPS caps it at two - pressing
  // again after that does nothing, so there is never a triple jump.
  if (jumpPressed() && jerry.jumps < MAX_JUMPS) {
    jerry.vy = JUMP_POWER * (jerry.jumps === 0 ? 1 : DOUBLE_JUMP_POWER);
    jerry.onGround = false;
    jerry.jumps++;
    sfx('jump');
    if (jerry.jumps === 2) spawnParticles(jerry.x + 14, jerry.y + jerry.h, '#cfe9ff', 8);
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    throwBombs(9);
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  // shield slowly recharges after being spent
  if (hasPower('shield') && !jerry.shield) {
    if (--jerry.shieldCd <= 0) { jerry.shield = true; jerry.shieldCd = 0; }
  }

  // ---- physics ----
  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx;
  jerry.y += jerry.vy;
  jerry.onGround = false;
  if (jerry.x < 0) jerry.x = 0;

  for (const p of platforms.concat(blocks)) {
    if (rectHit(jerry, p)) {
      const prevX = jerry.x - jerry.vx;
      const prevY = jerry.y - jerry.vy;
      // A ? block pays out on any contact - from below, the side, or by
      // landing on it. Requiring a hit from underneath meant players who
      // approached from the wrong angle just bounced off with nothing.
      if (!p.hit && p.type) { p.hit = true; triggerBlock(p); }
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h; jerry.vy = 0;
        jerry.onGround = true; jerry.jumps = 0;
      } else if (prevY >= p.y + p.h - 1) {
        jerry.y = p.y + p.h; jerry.vy = 1;
      } else if (prevX + jerry.w <= p.x + 1) {
        jerry.x = p.x - jerry.w;
      } else if (prevX >= p.x + p.w - 1) {
        jerry.x = p.x + p.w;
      }
    }
  }
  spendLedgeJump();

  // ---- enemies ----
  for (const e of enemies) {
    if (!e.alive) continue;

    if (e.type === 'chaser') {
      // walks toward Jerry, but only within its own stretch of the level
      const dir = Math.sign((jerry.x + jerry.w / 2) - (e.x + e.w / 2)) || 1;
      e.x += dir * Math.abs(e.vx);
      e.x = Math.max(e.minX, Math.min(e.maxX - e.w, e.x));
      e.vx = dir * Math.abs(e.vx);
    } else if (e.type === 'spitter') {
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
      // fires sludge when Jerry is roughly in front of it
      if (--e.fireTimer <= 0) {
        e.fireTimer = Math.max(50, 130 - level * 8);
        const dx = (jerry.x + jerry.w / 2) - (e.x + e.w / 2);
        if (Math.abs(dx) < 380) {
          villainShots.push({
            x: e.x + e.w / 2, y: e.y + 8,
            vx: Math.sign(dx) * (3 + level * 0.15), vy: -3.4,
            r: 8, kind: 'toxic', spin: 0, fromEnemy: true,
          });
        }
      }
    } else if (e.type !== 'drum') {
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
    }

    if (e.type === 'drone') {
      e.phase += 0.04;
      e.y = e.baseY + Math.sin(e.phase) * 26;
    }

    if (jerry.invuln <= 0 && rectHit(jerry, e)) {
      // stompable on top: everything on the ground except drones and drums
      const stompable = e.type === 'trash' || e.type === 'barrel' || e.type === 'chaser';
      if (stompable && jerry.vy > 1 && (jerry.y + jerry.h - jerry.vy) < e.y + 10) {
        e.alive = false;
        jerry.vy = JUMP_POWER * 0.65;
        jerry.jumps = Math.min(jerry.jumps, 1);
        addKillScore(100 + level * 10, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#8b6f47', 10);
      } else {
        damagePlayer();
      }
    }
  }

  // ---- sludge fired by spitters ----
  for (const s of villainShots) {
    s.vy += GRAVITY * 0.55;
    s.x += s.vx; s.y += s.vy;
    s.spin += 0.2;
    if (s.y - s.r > H || s.x < camera.x - 120 || s.x > camera.x + W + 120) s.dead = true;
    if (!s.dead && jerry.invuln <= 0 &&
        rectHit({ x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 }, jerry)) {
      s.dead = true;
      damagePlayer();
    }
  }
  villainShots = villainShots.filter(s => !s.dead);

  // ---- sewage pits ----
  for (const h of hazards) {
    if (jerry.y + jerry.h > h.y + 8 &&
        jerry.x + jerry.w > h.x + 5 && jerry.x < h.x + h.w - 5) {
      damagePlayer();
      break;
    }
  }

  if (jerry.y > H + 50) damagePlayer();

  updateCheckpoints();

  for (const s of signs) {
    if (s.shown) continue;
    if (Math.abs((jerry.x + jerry.w / 2) - (s.x + 20)) < 40) {
      s.shown = true;
      showPopup(s.text);
    }
  }

  // ---- bombs ----
  for (const b of bombs) {
    b.vy += GRAVITY * 0.5;
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 50 || b.x < -50 || b.x > d.end + 50) b.dead = true;
    for (const e of enemies) {
      if (!e.alive || b.dead) continue;
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, e)) {
        e.alive = false;
        addKillScore(100 + level * 10, e.x + 12, e.y);
        sfx('hit');
        spawnParticles(e.x + 15, e.y + 15, '#4af', 15);
        // piercing bombs carry on through a couple of enemies
        if (b.pierce && ++b.hits < 3) continue;
        b.dead = true;
      }
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of particles) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  updateFloatText();

  // clamp against the visible width, so a wide view never scrolls past the end
  camera.x = Math.max(0, Math.min(d.end - VIEW_W, jerry.x - (VIEW_W / 2 - 100)));

  // ---- level complete ----
  if (jerry.x + jerry.w > goal.x + 10) {
    // every level ends with its own boss; nextLevel() runs once it is beaten
    startVillain();
  }

  if (jerry.invuln > 0) jerry.invuln--;
  if (popup) { popup.timer--; if (popup.timer <= 0) popup = null; }
}

// Moves on to the next stage, keeping powers and score.
function nextLevel() {
  // clear bonus rewards keeping lives and chaining kills, so playing well
  // pays off instead of just surviving
  const lifeBonus = lives * 150;
  const comboBonus = comboBest * 100;
  score += 500 + lifeBonus + comboBonus;
  powerBanner = {
    text: 'LEVEL CLEAR!  +' + (500 + lifeBonus + comboBonus),
    timer: 170,
  };
  comboBest = 0;
  breakCombo();

  // THE GATE TO LEVEL 8. Everyone was walking to the final tower, so it meant
  // nothing to get there. Beating the SMOG GENERAL is not enough on its own -
  // you have to still be standing, with a life in reserve. Limp out of level 7
  // on your last life and the run ends there, at level 7, with the score you
  // earned. It is the one place the game says no.
  if (level === GATE_LEVEL && lives < gateLives()) {
    gateFailed = true;
    gameState = 'gameover';
    return;
  }

  level++;
  levelReached = Math.max(levelReached, level);
  unlockLevel(level);
  buildLevel(level);
  gameState = 'playing';        // back to the platforming after a boss
  villain = null;
  jerry.x = 60; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
  jerry.jumps = 0;
  camera.x = 0;
  bombs = [];
  villainShots = [];
  bossActiveEnemies = [];
  particles = [];
  levelBanner = 150;
  sfx('power');
}

function triggerBlock(b) {
  spawnParticles(b.x + 20, b.y, '#4af', 12);
  sfx(b.type === 'filter' || b.type === 'uv' ? 'power' : 'hit');

  // filter and UV are the power blocks: each one moves Jerry up a stage
  if (b.type === 'filter' || b.type === 'uv') {
    score += 200;
    if (jerry.stage >= 2) {
      // already armed: hand out this level's reward power
      const reward = (levelData || levelDef(level)).power;
      setStage(2);
      spawnParticles(b.x + 20, b.y - 10, '#ff8', 16);
      if (grantPower(reward) && POWER_INFO[reward]) {
        powerBanner = { text: POWER_INFO[reward].label + ' UNLOCKED!', timer: 150 };
        showPopup(eduText(b.type) + ' ' + POWER_INFO[reward].blurb + '!');
      } else {
        showPopup(eduText(b.type) + ' Bomb recharged!');
      }
    } else {
      setStage(jerry.stage + 1);
      spawnParticles(b.x + 20, b.y - 10, jerry.stage === 2 ? '#ff8' : '#fff', 18);
      if (jerry.stage === 2) grantPower('bomb');
      showPopup(jerry.stage === 1
        ? eduText(b.type) + ' Jerry GREW BIGGER! Hit another power block for water bombs.'
        : eduText(b.type) + ' WATER BOMBS unlocked - press [X] to throw!');
    }
    return;
  }

  showPopup(eduText(b.type));
  if (b.type === 'chlorine') {
    // capped, so stacking chlorine blocks cannot make the run risk-free;
    // past the cap it pays out instead
    if (lives < MAX_LIVES) { lives++; score += 200; }
    else { score += 500; }
  }
  else if (b.type === 'water') { score += 50; }
}

// ============ LEVEL BOSSES ============
// Every level ends with the polluter behind it. One code path drives all
// eight; BOSSES[] decides how hard each one hits.
function startVillain() {
  gameState = 'villain';
  const d = bossDef(level);
  levelReached = Math.max(levelReached, level);
  jerry.x = 70; jerry.y = 300; jerry.vx = 0; jerry.vy = 0;
  jerry.invuln = 90;
  jerry.jumps = 0;
  levelBanner = 0;
  // bombs are the only way to hurt a boss, so make sure Jerry has them
  setStage(2);
  grantPower('bomb');
  camera.x = 0;
  bombs = [];
  villainShots = [];
  bossActiveEnemies = [];
  particles = [];

  villain = {
    def: d,
    name: d.name,
    // the flying boss starts at his hover height, not on the floor
    x: 600, y: d.shape === 'drone' ? 196 : GROUND_Y - d.h, w: d.w, h: d.h,
    vx: -d.speed, vy: 0, onGround: true,
    hp: d.hp, maxHp: d.hp,
    hurt: 0,           // flash timer after taking a hit
    attackTimer: 90,   // frames until the next attack
    phase: 1,          // gets more aggressive as hp drops
    facing: -1,
    minionTimer: d.minionGap || 0,
    slam: 0,           // shockwave animation timer
    rage: 0,           // final boss only: temporary frenzy
    // signature-move state, cleared for every new fight
    tide: 0,           // L3 rising sludge
    smog: 0,           // L7 blinding cloud
    laserAim: null,    // L4 targeting beam
    laserFire: 0,
    lastLaserX: 0,
    bought: null,      // L8 borrowed boss
    hover: 0,          // L4 flight bob
  };
  showPopup('BOSS: ' + d.taunt + (d.tip ? '  ' + d.tip : ''));
}

function updateVillain() {
  // ---- player ----
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax = -moveSpeed();
  if (keys['arrowright'] || keys['d']) ax = moveSpeed();
  jerry.vx = ax;
  if (ax !== 0) jerry.facing = Math.sign(ax);

  if (jumpPressed() && jerry.jumps < MAX_JUMPS) {
    jerry.vy = JUMP_POWER * (jerry.jumps === 0 ? 1 : DOUBLE_JUMP_POWER);
    jerry.onGround = false;
    jerry.jumps++;
    sfx('jump');
    if (jerry.jumps === 2) spawnParticles(jerry.x + 14, jerry.y + jerry.h, '#cfe9ff', 8);
  }

  if (keys['x'] && jerry.hasBomb && !jerry._xheld) {
    throwBombs(9);
    jerry._xheld = true;
  }
  if (!keys['x']) jerry._xheld = false;
  if (jerry.bombCooldown > 0 && --jerry.bombCooldown === 0) jerry.hasBomb = true;

  if (hasPower('shield') && !jerry.shield) {
    if (--jerry.shieldCd <= 0) { jerry.shield = true; jerry.shieldCd = 0; }
  }

  jerry.vy = Math.min(15, jerry.vy + GRAVITY);
  jerry.x += jerry.vx; jerry.y += jerry.vy;
  jerry.onGround = false;

  // arena platforms let Jerry get height to dodge
  const arena = [
    { x: 0, y: GROUND_Y, w: W, h: 60 },
    { x: 120, y: 330, w: 110, h: 16 },
    { x: 570, y: 330, w: 110, h: 16 },
    { x: 345, y: 240, w: 110, h: 16 },
  ];
  for (const p of arena) {
    if (rectHit(jerry, p)) {
      const prevY = jerry.y - jerry.vy;
      if (prevY + jerry.h <= p.y + 1) {
        jerry.y = p.y - jerry.h; jerry.vy = 0;
        jerry.onGround = true; jerry.jumps = 0;
      }
    }
  }
  spendLedgeJump();
  if (jerry.x < 0) jerry.x = 0;
  if (jerry.x + jerry.w > W) jerry.x = W - jerry.w;

  // ---- villain AI ----
  const v = villain;
  const d = v.def || bossDef(level);
  v.phase = v.hp <= v.maxHp / 3 ? 3 : (v.hp <= v.maxHp * 2 / 3 ? 2 : 1);

  // pace back and forth, turning at the arena edges; rage makes him sprint
  const speedMul = v.rage > 0 ? 1.7 : 1;
  v.x += v.vx * speedMul;
  if (v.x < 40) { v.x = 40; v.vx = Math.abs(v.vx); }
  if (v.x + v.w > W - 40) { v.x = W - 40 - v.w; v.vx = -Math.abs(v.vx); }
  v.facing = Math.sign(v.vx) || -1;

  // The DRONE MARSHAL flies instead of walking, so he cannot be stomped and
  // has to be brought down with bombs.
  if (d.shape === 'drone') {
    v.hover = (v.hover || 0) + 0.045;
    // low enough that a lobbed bomb can reach him from the floor
    v.y = 196 + Math.sin(v.hover) * 44;
    v.vy = 0;
    v.onGround = false;
  } else {
    // gravity for his jumps
    v.vy += GRAVITY;
    v.y += v.vy;
    if (v.y + v.h >= GROUND_Y) {
      if (!v.onGround && v.slamPending) {
        // landing from a slam sends a shockwave along the floor
        v.slamPending = false;
        v.slam = 26;
        screenShake = 14;
        sfx('boom');
        for (const dir of [-1, 1]) {
          villainShots.push({
            x: v.x + v.w / 2, y: GROUND_Y - 10,
            vx: dir * 5.2, vy: 0, r: 11, kind: 'wave', spin: 0, ground: true,
          });
        }
      }
      v.y = GROUND_Y - v.h; v.vy = 0; v.onGround = true;
    }
  }

  if (v.hurt > 0) v.hurt--;
  if (v.slam > 0) v.slam--;
  if (v.rage > 0) v.rage--;
  if (v.smog > 0) v.smog--;
  if (v.bought && --v.bought.timer <= 0) v.bought = null;

  // SLUDGE TIDE: the floor itself becomes deadly for a while, so the only
  // safe ground is the arena platforms.
  if (v.tide > 0) {
    v.tide--;
    if (jerry.invuln <= 0 && jerry.y + jerry.h > GROUND_Y - 14) damagePlayer();
  }

  // TARGETING LASER: paints a line, then fires down it.
  if (v.laserAim) {
    v.laserAim.timer--;
    if (v.laserAim.timer <= 0) {
      const lx = v.laserAim.x;
      v.lastLaserX = lx;
      v.laserFire = 12;
      screenShake = 8;
      sfx('boom');
      if (jerry.invuln <= 0 && jerry.x + jerry.w > lx - 13 && jerry.x < lx + 13) damagePlayer();
      spawnParticles(lx, GROUND_Y - 20, '#f66', 14);
      v.laserAim = null;
    }
  }
  if (v.laserFire > 0) v.laserFire--;

  // summon helpers on their own timer
  if (d.minions && d.minionGap) {
    if (--v.minionTimer <= 0) {
      v.minionTimer = Math.max(90, d.minionGap - v.phase * 30);
      if (bossActiveEnemies.length < 3 + v.phase) {
        const e = makeEnemy(d.minions, v.x + v.w / 2, 30, W - 30, 1 + v.phase * 0.2);
        e.y = d.minions === 'drone' ? 200 : GROUND_Y - e.h;
        e.baseY = e.y;
        e.minX = 30; e.maxX = W - 30;
        e.fromBoss = true;
        bossActiveEnemies.push(e);
        spawnParticles(v.x + v.w / 2, v.y + 20, '#8a8', 8);
      }
    }
  }

  // ---- attacks ----
  v.attackTimer--;
  if (v.attackTimer <= 0) {
    // later phases and rage shorten the gap between attacks
    const base = d.gap * [1, 0.78, 0.58][v.phase - 1];
    v.attackTimer = Math.max(24, Math.round(base * (v.rage > 0 ? 0.5 : 1))) +
                    Math.floor(Math.random() * 24);

    // A boss leans on the move that defines him, so each fight reads as its
    // own thing rather than a shuffle of the same handful of attacks.
    const moves = d.moves;
    const pick = (d.signature && Math.random() < 0.45)
      ? d.signature
      : moves[Math.floor(Math.random() * moves.length)];
    const dirTo = Math.sign((jerry.x + jerry.w / 2) - (v.x + v.w / 2)) || -1;

    if (pick === 'lob') {
      // hurl a money bag on an arc towards Jerry
      villainShots.push({
        x: v.x + v.w / 2, y: v.y + 20,
        vx: dirTo * (3.2 + v.phase * 0.5 + level * 0.12), vy: -5,
        r: 12, kind: 'money', spin: 0,
      });

    } else if (pick === 'spray') {
      // a fan of toxic blobs
      const n = 2 + v.phase + Math.floor(level / 4);
      for (let i = 0; i < n; i++) {
        villainShots.push({
          x: v.x + v.w / 2, y: v.y + 10,
          vx: (i - (n - 1) / 2) * 1.9,
          vy: -6.5,
          r: 9, kind: 'toxic', spin: 0,
        });
      }

    } else if (pick === 'slam') {
      // leap high, then shockwave on landing
      if (v.onGround) {
        v.vy = -13;
        v.onGround = false;
        v.slamPending = true;
        v.vx = dirTo * (2.2 + v.phase * 0.4);
      }

    } else if (pick === 'summon') {
      v.minionTimer = 0;      // trigger a helper immediately
